name: Reversão Instintiva
type: feat
img: icons/skills/melee/strike-chain-whip-blue.webp
system:
  description:
    value: >-
      <p class="MsoNormal">A partir do 2º nível de Especialista, você aprendeu a
      utilizar energia reversa de forma instintiva para causar dano em criaturas
      inimigas. Embora você não a controle com maestria suficiente para se
      curar, ela acaba sendo imbuída em cada um de seus golpes. Você recebe as
      seguintes características:</p><ul><li><p><em>A utilizar “Explosão
      Ofensiva” em uma maldição, você causa 2d4 de dano para cada PA
      usado;</em></p></li><li><p><em>Toda vez que você errar uma jogada de
      ataque (Comum), você causa dano em um Espírito Amaldiçoado igual ao seu
      modificador do atributo principal. Caso você erre uma técnica ou feitiço,
      você causa seu Modificador de Principal + seu nível de Estrategista, até
      um valor máximo de 20 de dano.</em></p></li></ul>
