  description:
    value: >-
      <p class="MsoNormal">Você tem um olfato com sensores capazes de farejar o
      mínimo odor. Quando identifica o cheiro de algo ou alguém, consegue seguir
      seu rastro, mesmo a grandes distâncias e em meio a outros cheiros, mas
      pode perder o alvo caso este modifique seu cheiro ou algo externo apague
      os rastros, como chuvas pesadas ou cheiros muito mais fortes interferindo
      a busca.</p><p class="MsoNormal"><strong>Característica:</strong> Você
      recebe vantagem em Testes de Atributo de Sabedoria (Percepção)
      relacionados ao olfato.</p>
