system:
  description:
    value: >-
      <p class="MsoNormal">A partir do <strong>2º nível de
      Especialista</strong>, sua energia amaldiçoada perde uma grande capacidade
      defensiva em troca de uma versatilidade e ofensiva mais poderosa. Você
      perde imediatamente 2 Pontos de Vida e; seu dado de vida do nível 2 e nos
      níveis seguintes se torna d6. Adicionalmente, você também perde 1 Ponto de
      Vida por nível de personagem. Em troca dessa restrição, você recebe as
      seguintes características:</p><ul><li><p><em>Você recebe o dobro de dados
      de energia amaldiçoada por nível de personagem inclusive do 1º
      nível;</em></p></li><li><p><em>Você recebe acerto adicional em suas
      jogadas de ataque (Comuns e de Técnica) igual seu bônus de
      proficiência;</em></p></li><li><p><em>Suas jogadas de ataque (de Técnica)
      e técnicas em área recebem 1 de dano adicional para cada dado usado na
      rolagem, até um valor máximo igual seu nível de personagem. Por Exemplo: 3
      dados = 3 de dano adicional.</em></p></li></ul>
