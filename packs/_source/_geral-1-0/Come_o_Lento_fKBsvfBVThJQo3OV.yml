system:
  description:
    value: "<p class=\"MsoNormal\">Você não consegue explodir com seu potencial de uma vez durante o início de uma luta, mas vai acumulando seu momento conforme ela avança. Toda rolagem de dados de dano, cura ou dados de redução que seja acima da média, se torna a média e você gera menos Pontos de Energia Amaldiçoada (PA) por rodada em um valor igual seu nível de personagem. A partir da 5º rodada de combate, você remove os limitadores acima e passa a gerar 50% a mais de PA no início de cada um de seus turnos (do padrão). Além disso, você recebe 2 dados de dano em todas as suas técnicas e feitiços, mas seu dano total não pode ser maior que o máximo possível dos dados padrões (esse máximo leva em conta qualquer adicional que aumente dados de dano como Explosão Ofensiva e similares, fazendo eles serem contados como dano base). Esse efeito dura até o fim do encontro.</p><p class=\"MsoNormal\">\_\_\_\_\_\_\_\_\_\_\_\_ Você ignora as restrições e ativa diretamente os benefícios caso seu inimigo seja uma criatura que você já enfrentou anteriormente e tenha uma rixa, desde que você esteja o enfrentando sozinho.</p>"
