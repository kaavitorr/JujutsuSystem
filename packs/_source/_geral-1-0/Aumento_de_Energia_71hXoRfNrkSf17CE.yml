system:
  description:
    value: >-
      <p class="MsoNormal">Sua habilidade em consumir objetos amaldiçoados e
      conter sua energia faz com que você possa crescer sem a necessidade de
      treinamentos muito intensos.</p><p
      class="MsoNormal"><strong>Característica:</strong> Caso você já tenha
      consumido seus 2 objetos amaldiçoados para receber novos feitiços inatos
      ou herdados, cada objeto novo irá aumentar sua Energia Amaldiçoada máxima
      por 5 vezes o grau daquele objeto. Esse efeito não funciona com
      “Ferramentas Amaldiçoadas”, apenas com objetos que você tenha a capacidade
      física de engolir por inteiro.</p>
