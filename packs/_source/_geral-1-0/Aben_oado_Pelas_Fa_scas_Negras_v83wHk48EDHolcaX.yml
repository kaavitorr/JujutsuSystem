system:
  description:
    value: >-
      <p class="TextoPadro">A partir do 2º nível de Lutador, você adquire a
      capacidade de alcançar o Fulgor Negro com mais facilidade que os demais.
      Você recebe acesso às seguintes características:</p><ul><li><p>Você recebe
      o <strong>“Fulgor Negro”</strong>, conforme descrito no <strong>Capítulo
      6;</strong></p></li><li><p>Você pode manter a Zona por 2 rodadas no lugar
      de uma ao atingir um Fulgor;</p></li><li><p>Você não precisa de uma
      segunda rolagem de 15–20 para ativar o “Fulgor Negro”, ativando-o em todo
      20 natural — ou em valores menores, caso algo tenha afetado sua
      margem.</p></li></ul>
