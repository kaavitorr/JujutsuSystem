system:
  description:
    value: "<p>Desde que você esteja a 1,5 metros de uma criatura, você pode ativar essa técnica para realizar um movimento único para segurar a arma do alvo e atira-lo simultaneamente por 6 metros de distância. A criatura deve realizar uma Salvaguarda de [[/save str dc=@attributes.spell.dc]] ou [[/save dex dc=@attributes.spell.dc]] (à escolha dela) para tentar evitar ser desarmada e arremessada.</p><p>\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_ Se você falhar na execução dessa técnica, a criatura que foi alvo está alerta e recebe +3 nas próximas Salvaguardas contra ela.</p><hr><p>\_<strong>Duração:</strong>\_Instantâneo</p><p><strong>Alcance:</strong>\_Toque</p><p><strong>Requisito:</strong>\_Ação Bônus</p><p><strong>Custo:</strong> 3 PA</p>"
