system:
  description:
    value: >-
      <p><strong>Rajada de Ácido (Aumenta o dano efetivo por rodada da criatura,
      considerando que acerte duas criaturas): </strong>A criatura cospe ácido
      em uma linha de 9 metros de comprimento e 1,5 metro de largura. Cada alvo
      na linha deve realizar um Teste de Resistência de Destreza, sofrendo dano
      de ácido se falhar na resistência, ou metade desse dano se obtive sucesso.
      A criatura pode usar esta característica uma vez. No início de cada um dos
      turnos da criatura, role 1d6. Se o resultado for 6, a criatura recupera o
      uso desta característica. Essa característica também se recarrega quando a
      criatura termina um descanso curto ou longo.</p>
