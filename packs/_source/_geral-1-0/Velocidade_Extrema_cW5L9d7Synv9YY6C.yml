system:
  description:
    value: "<p><span>A partir do <strong>15º nível de Restringido</strong>, você se tornou tão rápido que seus movimentos parecem até miragens, até para criaturas de alto nível. Você recebe as seguintes características:</span></p><ul><li><p><span><em>Você recebe uma ação bônus adicional, que só pode ser usada em efeitos, técnicas ou habilidades diferentes;</em></span></p></li><li><p><span><em>Você recebe uma reação adicional, que só pode ser usada em efeitos, técnicas ou habilidades diferentes;</em></span></p></li><li><p><em>Você pode usar seu deslocamento para se mover instantaneamente para qualquer lugar que você tenha deslocamento para alcançar, ignorando qualquer tipo de reação que seria gerada pelo seu movimento. Você desaparece da sua localização atual e aparece no seu destino final.</em></p></li></ul><p class=\"MsoNormal\"><span style=\"font-size:6pt;font-family:'Chaparral Pro', serif\"><em>\_</em></span></p><p class=\"MsoNormal\">As ações recebidas são renovadas no início de cada um de seus turnos.</p>"
