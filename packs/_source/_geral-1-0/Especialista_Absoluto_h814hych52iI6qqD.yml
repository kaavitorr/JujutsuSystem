name: Especialista Absoluto
type: feat
img: icons/skills/social/diplomacy-peace-alliance.webp
system:
  description:
    value: >-
      <p>A partir do <strong>19º nível de Especialista</strong>, você atingiu os
      limites da sua categoria, entrando em um nível de força que está na liga
      de figuras lendárias. Você recebe as seguintes
      características:</p><ul><li><p><strong>Preço Vital:</strong> Você pode
      escolher consumir PA para ativar seus feitiços no lugar do seu requisito
      de ações. Dessa forma, você pode escolher gastar 9 PA para ativar um
      feitiço sem precisar gastar sua ação de poder e 3 PA para ativar um sem
      precisar consumir uma ação bônus ou
      reação.</p></li><li><p><strong>Essência do Especialista:</strong> Você
      recebe um feitiço estendido adicional. Esse feitiço já vem naturalmente
      com uma versão de reversão de feitiço</p></li><li><p><strong>Ação
      Lendária:</strong> Você possui uma única ação lendária, que pode ser
      ativada no fim do turno de uma criatura qualquer, você recupera sua ação
      lendária no início de cada um de seus turnos. Você tem acesso as seguintes
      opções:</p><ol><li><p class="MsoListParagraph"><strong>Movimento:</strong>
      Você se move até metade do seu deslocamento máximo total.</p></li><li><p
      class="MsoListParagraph"><strong>Ataque:</strong> Você realiza uma única
      jogada de ataque (Comum) contra uma criatura dentro do seu
      alcance.</p></li><li><p
      class="MsoListParagraph"><strong>Detectar:</strong> Você pode realizar um
      Teste de Atributo de Sabedoria (Percepção) para procurar por
      algo.</p></li></ol></li></ul>
