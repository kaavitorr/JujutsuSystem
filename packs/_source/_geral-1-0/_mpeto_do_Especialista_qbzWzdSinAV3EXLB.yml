name: Ímpeto do Especialista
type: feat
img: icons/magic/lightning/bolt-strike-beam-yellow.webp
system:
  description:
    value: >-
      <p style="tab-stops:467.8pt;text-align:justify"><span
      style="mso-bidi-font-size:10.0pt">A partir do <strong>15º nível de
      Especialista</strong>, ao iniciar um encontro, você pode ativar
      instantaneamente todos os seus feitiços básicos, estendidos e máximos, se
      desejar, sem consumir ações — desde que não causem dano direto, condições
      ou efeitos negativos em criaturas inimigas. Dessa forma, você não pode ser
      pego de surpresa enquanto possuir essa habilidade. Caso você possua
      <strong>“Pronto para a Batalha”</strong>, você pode substituí-lo por outra
      habilidade.</span></p><p
      style="text-indent:35.45pt;tab-stops:467.8pt;text-align:justify"><span
      style="mso-bidi-font-size:10.0pt">Adicionalmente, durante o seu turno,
      você pode rolar até <strong>2 Dados de Energia Amaldiçoada</strong> e
      gerar o valor obtido como Energia Amaldiçoada adicional, sem reduzi-lo do
      seu total atual. Nesse caso, modificadores não são aplicados ao resultado.
      Você pode utilizar esse efeito uma vez por rodada, enquanto ainda possuir
      Dados de Energia Amaldiçoada disponíveis.</span></p>
