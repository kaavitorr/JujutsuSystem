name: Mudança de Encantamento
type: feat
img: icons/commodities/treasure/token-engraved-red-glowing.webp
system:
  description:
    value: >-
      <p class="MsoNormal">Seu clã aprendeu um processo extremamente doloroso
      para alterar a localização de seu encantamento, permitindo que você
      eliminasse um dos maiores defeitos da sua habilidade.</p><p
      class="MsoNormal"><strong>Requisito:</strong> 8º Nível de
      Personagem.</p><p
      class="MsoListParagraph"><strong>Característica:</strong> Você pode
      sacrificar 1 Ponto de Atributo Constituição e 40 Pontos de Energia
      Amaldiçoada (PA) máxima para mudar a localização da sua técnica inata da
      língua para a mão, permitindo que você possa remover o defeito “Língua
      Traiçoeira”. Dessa forma, você pode colocar a mão na frente da boca sempre
      que quiser utilizar sua habilidade, porém você perde acesso a sua
      habilidade se estiver com as mãos presas ou tiver perdido o braço
      escolhido para mover sua técnica inata até recupera-la.</p>
