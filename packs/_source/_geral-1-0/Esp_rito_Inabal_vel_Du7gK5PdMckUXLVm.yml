    value: >-
      <p style="text-align:justify"><span>A partir do <strong>11º nível de
      Lutador</strong>, </span>você consegue se manter em combate puramente com
      seu espírito inabalável, secando até os últimos vestígios de energia para
      continuar em combate. Você recebe resistência a todos os tipos de
      dano.</p><p style="text-indent:49.6pt;text-align:justify">Adicionalmente,
      se você cair a 0 Pontos de Vida e não morrer, você recupera metade dos
      seus Pontos de Vida e pode continuar lutando. Essa característica não pode
      ser usada novamente por 3 dias.</p>
