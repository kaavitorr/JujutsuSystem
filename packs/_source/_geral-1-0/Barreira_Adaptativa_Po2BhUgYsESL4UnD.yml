system:
  description:
    value: >-
      <p class="MsoNormal">A partir do <strong>10º nível de
      Especialista</strong>, após receber acesso a barreiras puras, você se
      torna capaz de manipula-las livremente para tomar a forma que desejar,
      assim como adicionar regras mais facilmente. Você recebe as seguintes
      características:</p><ul><li><p><em>Suas barreiras tem os Pontos de Vida
      finais multiplicados por 3;</em></p></li><li><p><em>Suas barreiras livres
      ou inferiores podem receber 2 regras adicionais
      livremente;</em></p></li><li><p><em>Suas barreiras puras ou superiores
      podem receber 2 regras adicionais gastando 1 hora para
      cada;</em></p></li><li><p><em>Suas barreiras recebem +4 de Classe de
      Resistência.</em></p></li></ul>
