system:
  description:
    value: >-
      <p>Você pode usar conhecimentos básicos em medicina para tratar criaturas,
      que tenham perdido mais que metade dos seus Pontos de Vida totais. Ao usar
      uma ação bônus, recupera 6 Pontos de Vida para cada nível de personagem da
      criatura e garante 3d10 Pontos de Vida temporários, que duram até o
      término de um descanso longo ou recupera 4 Pontos de Vitalidade (PVE). As
      condições <strong>“Envenenado”, “Letárgico”, “Queimado”,
      “Sangramento”</strong> e <strong>“Sonolento”</strong> são encerradas na
      criatura tratada com essa característica.</p><p>Caso a criatura perca os
      PV temporários, sem que tenha terminado um descanso longo, ela recebe um
      dano com o mesmo valor dos PV temporários recebidos.</p><p>Essa
      característica sempre consome 1 kit de primeiros socorros, quando usada,
      podendo ser usada uma vez em cada criatura e só surte efeito novamente
      após a criatura terminar um descanso longo.</p><p>Alternativamente, você
      pode usar essa característica para tratar apenas as condições citadas
      acima, quantas vezes quiser.</p>
