system:
  description:
    value: >-
      <p>A partir do <strong>14º nível de Restringido</strong>, você aprendeu a
      canalizar toda sua força em golpes extremamente poderosos. Você pode
      colocar quantos Pontos de Vigor tiver disponíveis ao realizar um ataque
      com sua Queima Agressiva do Constituição Anômala. Além disso, você pode
      gastar 5 Pontos de Vigor para transformar todo dano causado por você em
      dano do tipo “Verdadeiro” até o início do seu próximo turno.</p><p
      class="TextoPadro">Adicionalmente, todas as suas técnicas de dano têm o
      dano aumentado em 1 passo (d6 &gt; d8 &gt; d10 &gt; d12).</p>
