system:
  description:
    value: >-
      <p>A partir do <strong>2º nível de Restringido</strong>, seu físico
      evoluiu, te dando um metabolismo extremamente acelerado e um vigor
      extremo. Você recebe acesso as seguintes
      características:</p><ul><li><p><strong>Queima Agressiva:</strong> Você
      pode consumir 1 Ponto de Vigor para adicionar 1d4 de dano a sua próxima
      jogada de ataque (Comum) ou 1 dado de dano à sua próxima técnica. Você não
      pode adicionar um número de dados maior que seu bônus de
      proficiência.</p></li><li><p><strong>Queima Defensiva:</strong> Você pode
      consumir 1 Ponto de Vigor para reduzir 1d4 de dano ou adicionar 2d8 de
      redução a sua próxima redução de dano baseada em 2d8, até um máximo igual
      ao vigor gerado disponível.</p></li><li><p><strong>Metabolismo
      Extremo:</strong> Seu descanso longo se torna de 2 horas e seu descanso
      curto de 5 minutos. Além disso, você recupera todos os seus Pontos de
      Vigor, assim como os dados de vigor em um descanso longo.</p></li></ul>
