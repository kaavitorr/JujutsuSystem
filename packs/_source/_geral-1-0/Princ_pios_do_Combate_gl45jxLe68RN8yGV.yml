system:
  description:
    value: "<p>A partir do <strong>1º nível de Especialista</strong>, você aprendeu todos os princípios básicos do combate para lutar apenas usando energia amaldiçoada, embora seu uso principal de batalha ainda seja seu feitiço. Você recebe acesso as seguintes características:</p><ul><li><p><strong>Ataques Estratégicos:</strong> Enquanto estiver com um aliado a até 3 metros de uma criatura inimiga, suas jogadas de ataque (de Técnica) recebem vantagem contra ela.</p></li><li><p><strong>Redirecionar: </strong>Quando você for alvo de uma jogada de ataque (Comum ou de Técnica), você pode usar sua reação e escolher uma criatura voluntária para receber dano em seu lugar. A criatura deve estar a até 3 metros e você deve ter deslocamento sobrando para se mover para trás dela.</p></li><li><p><strong>Ataque Punitivo:</strong> Quando você errar uma jogada de ataque (Comum ou de Técnica), você causa dano a criatura inimiga igual seu modificador principal.</p></li></ul><p class=\"MsoNormal\">\_</p><p class=\"MsoNormal\">A partir do <strong>6º níve</strong>l, você não precisa mais utilizar reação ao usar o “Redirecionar”, mas ele é limitado a uma vez por rodada.</p>"
