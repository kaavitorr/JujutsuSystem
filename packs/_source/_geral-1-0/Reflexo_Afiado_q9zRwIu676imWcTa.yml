system:
  description:
    value: >-
      <p class="MsoNormal">Seu pensamento rápido e agilidade fazem você se mover
      e agir rapidamente:</p><ul><li><p><strong>Ataque de Oportunidade:</strong>
      Você pode realizar um ataque de oportunidade quando um inimigo que você
      possa ver se move para fora de seu alcance corpo-a-corpo, de forma
      voluntária.</p></li><li><p><strong>Movimentação Sagaz:</strong> Você pode
      usar sua ação bônus durante cada um de seus turnos em combate para
      realizar as ações “Disparada”, “Esconder” e “Esquivar”. Além disso, você
      recebe a capacidade de usar a ação “Desengajar” como uma ação bônus,
      permitindo que você se torne imune a ataques de oportunidade ao se
      movimentar.</p></li></ul>
