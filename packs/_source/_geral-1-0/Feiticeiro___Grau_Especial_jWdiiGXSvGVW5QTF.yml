name: Feiticeiro - Grau Especial
type: feat
img: icons/magic/light/beams-strike-blue.webp
system:
  description:
    value: >-
      <p>São aqueles que dominaram todos os princípios do nen com perfeição,
      aumentando o ND efetivo do PdN em 8. Eles recebem as seguintes
      características:</p><ul><li><p><em>Recebe + 15 em Testes de Atributo de
      Furtividade enquanto em Zetsu;</em></p></li><li><p><em>Aumenta a Classe de
      Dificuldade em +6;</em></p></li><li><p><em>Recebe 100 Pontos de
      Vida;</em></p></li><li><p><em>Recebe 5d4 de dano extra em todas as jogadas
      de ataque que realizar;</em></p></li><li><p><em>Sua margem de acerto
      crítico se torna 18-20;</em></p></li><li><p><em>Sua Classe de Resistência
      aumenta em +3;</em></p></li><li><p><em>Recebe resistência a todos os tipos
      de dano.</em></p><p></p></li></ul><p>Essas características são um resumo
      dos princípios, não precisando adiciona-los separadamente na ficha do NPC
      a menos que seja citado, podendo apenas adicionar o “Nível Ultimato”.
      Adicione todos os modificadores de atributo diretamente na ficha e
      qualquer característica que utiliza ações ou tenha limite de uso como
      parte dessa característica.</p>
