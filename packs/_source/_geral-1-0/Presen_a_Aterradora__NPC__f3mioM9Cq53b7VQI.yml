system:
  description:
    value: >-
      <p><strong>Presença Aterradora (Aumenta em 25% o PV efetivo de criaturas
      com ND 10 ou menor): </strong>Cada alvo a até 18 metros da criatura, que
      puder vê-la, deve ser bem sucedida em um Teste de Resistência de Espírito
      ou receberá a condição “Amedrontado” por 1 minuto. Um alvo amedrontado
      pode repetir o Teste de Resistência no final de cada um dos turnos dele,
      com desvantagem se a criatura estiver na linha de visão do alvo,
      terminando o efeito sobre si, se obtiver sucesso. Se o alvo for bem
      sucedido no teste, ou o se o efeito terminar nele, ele fica imune à
      Presença Aterradora da criatura pelas próximas 24 horas.</p>
