system:
  description:
    value: >-
      <p>A partir do <strong>1º nível de Restringido</strong>, devido a sua
      restrição, você recebeu certos benefícios gerais que ajudam você a se
      sobressair em combate. Você recebe as seguintes
      características:</p><ul><li><p><strong>Treinamento Físico:</strong> Você
      muda a perícia de “Controle de Energia” para “Controle Físico” e pode
      utiliza-la nos Treinamentos do Capítulo 6.5. Você não pode aprender
      treinamentos que usem efeitos ou habilidades que você não tem acesso, como
      “Energia Reversa”;</p></li><li><p><strong>Força Eficiente:</strong> Você
      recebe um bônus em Testes de Atributo de Força, Agilidade e Constituição
      igual metade do seu nível de personagem (arredondado para
      baixo);</p></li><li><p><strong>Golpe Certeiro:</strong> Você pode usar uma
      ação bônus para realizar um ataque (Comum) adicional, causando 1d4 de dano
      extra nesse ataque. A criatura atingida deve realizar uma Salvaguarda de
      Força para não receber a condição “Caído” ou ser empurrada por 9 metros de
      distância (à sua escolha).</p></li><li><p><strong>Velocidade
      Anormal:</strong> Seu deslocamento de caminhada, nado e escalada se torna
      12. A partir do 5º nível de restringido, ele aumenta para 15 e novamente
      para 18 no 9º nível de restringido. Caso você possua “Perito em Fuga”,
      você recebe 3 metros de deslocamento adicionais.</p></li></ul>
