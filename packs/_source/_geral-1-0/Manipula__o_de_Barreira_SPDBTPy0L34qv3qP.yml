  description:
    value: "<p class=\"MsoNormal\"><span>A partir do <strong>2º nível de Especialista</strong>, você aprendeu a utilizar barreiras como quem manipula a própria energia amaldiçoada, adquirindo uma incrível facilidade em sua execução. Você recebe as seguintes características:</span></p><ul><li><p><span><em>Você demora apenas um dia para adicionar cada efeito/regra a uma barreira e pode manter duas preparadas por vez;</em></span></p></li><li><p><span><em>Você recebe a habilidade de Manipulação – “<strong>Cortina (Véu)”</strong> do <strong>Capítulo 6 </strong>e pode cria-la com uma ação bônus;</em></span></p></li><li><p><span><em>A partir do <strong>6º nível</strong>, você recebe a habilidade – <strong>“Barreira Vazia”</strong>, recebendo <strong>“Barreira Pura”</strong> no <strong>10º nível</strong> e <strong>“Barreira Bon”</strong> no <strong>14º nível de Especialista</strong>.</em></span></p></li></ul><p style=\"margin-right:0.15pt\" class=\"TextoPadro\"><span style=\"font-size:7pt;font-family:''\">\_</span></p>"
