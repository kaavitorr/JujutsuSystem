system:
  description:
    value: >-
      <p>A partir do <strong>10º nível de Restringido</strong>, seu metabolismo
      se tornou acelerado a tal nível que você consegue recuperar rapidamente
      sua estamina, podendo exercer ainda mais poder em combate, assim como se
      recuperando rapidamente de qualquer ferida.</p><p class="TextoPadro">Você
      gera naturalmente 3 vezes o seu nível em Pontos de Vigor e, enquanto
      estiver abaixo da metade dos seus Pontos de Vida, você recupera Pontos de
      Vida adicionais igual seu nível de personagem.</p>
