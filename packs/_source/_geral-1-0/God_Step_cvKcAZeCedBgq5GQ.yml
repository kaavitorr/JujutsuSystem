system:
  description:
    value: "<p>Você expande seu domínio simples momentaneamente para 12 metros ao seu redor e desaparece de vista, cortando tudo em seu interior antes de voltar para sua posição inicial. Todas as criaturas dentro do alcance da linha devem realizar uma Salvaguarda de Agilidade. Sofrendo todo dano se falharem ou metade se obtiverem sucesso.</p><p>\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_ Uma criatura que falhou na primeira Salvaguarda recebe automaticamente a condição <strong>“Sangramento”.</strong></p><hr><p>\_<strong>Duração:</strong>\_Instantâneo</p><p><strong>Alcance:</strong>\_Até 12 metros de raio, Emanação</p><p><strong>Requisito:</strong> Katana, Domínio Simples, Ação de Poder</p><p><strong>Dano:</strong> 12d6 de dano Cortante</p><p><strong>Custo:</strong> 12 PA</p>"
