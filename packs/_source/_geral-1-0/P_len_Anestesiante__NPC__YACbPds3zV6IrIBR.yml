system:
  description:
    value: >-
      <p>Ao balançar as asas com mais força, libera substâncias anestesiantes no
      ar que atingem um círculo escolhida de 9 metros de diâmetro. Cada criatura
      no círculo deve realizar um teste de resistência de Constituição CD 17 ou
      ficará letárgica. Ela deve repetir o teste de resistência ao final de cada
      turno dela. Se obtiver sucesso no teste de resistência, o efeito se
      encerra e a criatura fica imune a este efeito por 24 horas.</p>
