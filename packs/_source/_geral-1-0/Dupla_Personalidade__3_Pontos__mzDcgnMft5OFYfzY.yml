system:
  description:
    value: "<p>Você possui uma característica rara, existem duas pessoas dentro de você, sendo uma delas a principal. Geralmente uma é bem diferente da outra e não compartilham memórias. Existe um gatilho para a segunda personalidade surgir, pode ser sempre que você dorme ou quando ficar muito irritado.</p><p>\_\_\_\_\_\_\_\_\_\_\_ \_\_\_\_\_\_\_Você recebe -2 em todas as jogadas, quando uma das personalidades estiver no controle e +1 em todas as jogadas, quando a outra estiver no controle. Você decide qual recebe o bônus e qual recebe a penalidade.</p>"
