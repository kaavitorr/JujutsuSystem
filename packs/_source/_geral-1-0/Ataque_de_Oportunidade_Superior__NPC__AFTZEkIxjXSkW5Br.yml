system:
  description:
    value: >-
      <p><strong>Ataque de Oportunidade Superior (Aumenta o bônus de ataque
      efetivo da criatura em 2):</strong> Se um alvo sair do alcance da
      criatura, de forma voluntária, mesmo se seu movimento não provocar um
      ataque de oportunidade e outras reações, o marinheiro pode realizar uma
      jogada de ataque corpo-a-corpo contra a criatura. Caso o ataque acerte, o
      deslocamento da criatura se torna 0, até o final da rodada.</p>
