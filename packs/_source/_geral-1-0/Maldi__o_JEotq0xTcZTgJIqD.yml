system:
  description:
    value: "<p>Ajuste de Atributo: +4 Pontos de Atributo para distribuir entre todos os 6 atributos.</p><p class=\"MsoNormal\">Pontos de Vida Base: 6 Pontos de Vida.</p><p class=\"MsoNormal\"><strong>Tamanho:</strong> Normalmente, entre 1,50 e 3,00 metros (Médio).</p><p class=\"MsoNormal\"><strong>Peso:</strong> Normalmente, entre 65 e 300 kg.</p><p class=\"MsoNormal\"><strong>Deslocamento:</strong> 9 metros.</p><p class=\"MsoNormal\"><strong>Nado:</strong> 4,5 metros.\_</p><table border=\"1\" style=\"margin-left:0pt;border-collapse:collapse;border:none\" class=\"MsoTableGrid\"><tbody><tr><td><p style=\"line-height:7pt;text-align:center\"><span style=\"font-size:large\"><strong>CARACTERÍSTICAS DA ORIGEM</strong></span></p></td></tr></tbody></table><p>Essas características acompanham a existência do personagem, são representações da sua origem, sendo uma parte essencial de como ele vê o mundo e de como o mundo olha pra ele.</p><p style=\"margin:0.5pt 0cm 0.0001pt 7.1pt;text-align:justify\"></p><p><span style=\"font-size:large\"><strong>BENEFÍCIOS DA ORIGEM</strong></span></p><hr><p><strong style=\"mso-bidi-font-weight:normal\">Natureza Amaldiçoada:</strong><span style=\"mso-bidi-font-weight:bold\"> Seu corpo é composto totalmente de energia amaldiçoada. Dessa forma, você pode se regenerar facilmente a utilizando. Você recebe imunidade a </span><strong style=\"mso-bidi-font-weight:normal\">“Ferimentos Persistentes”</strong><span style=\"mso-bidi-font-weight:bold\">. Adicionalmente, você recebe automaticamente a habilidade de manipulação </span><strong style=\"mso-bidi-font-weight:normal\">“Energia Reversa”</strong><span style=\"mso-bidi-font-weight:bold\"> e sua nomenclatura muda para </span><strong style=\"mso-bidi-font-weight:normal\">“Regeneração Amaldiçoada”,</strong><span style=\"mso-bidi-font-weight:bold\"> mas ela possui a mesma função da original, assim como suas técnicas que são adquiridas junto dela.</span></p><p style=\"tab-stops:467.8pt\" class=\"TextoPadro\"><strong style=\"mso-bidi-font-weight:normal\">Constituição de Maldição: </strong>Você recebe 10 Pontos de Energia Amaldiçoada (PA) adicional por nível de personagem e recebe 2 adicionais toda vez que receber um máximo adicional sem ser por aumento de nível.</p><p style=\"tab-stops:467.8pt\" class=\"TextoPadro\"><strong style=\"mso-bidi-font-weight:normal\">Manipulação Instintiva: </strong><span style=\"mso-bidi-font-weight:bold\">Por ser feito de energia amaldiçoada, você tem uma capacidade incrível em manipula-la, permitindo eficiência extrema. O custo dos seus feitiços e habilidades menores é reduzido em -2, até um mínimo de 1 PA.</span></p><p style=\"tab-stops:467.8pt\" class=\"TextoPadro\"><strong style=\"mso-bidi-font-weight:normal\">Corpo Bestial:</strong><span style=\"mso-bidi-font-weight:bold\"> Você pode diminuir a redução da </span><strong style=\"mso-bidi-font-weight:normal\">“Manipulação Instintiva”</strong><span style=\"mso-bidi-font-weight:bold\"> para -1 e receber </span><strong style=\"mso-bidi-font-weight:normal\">3 Traços Animais Comuns</strong><span style=\"mso-bidi-font-weight:bold\"> e </span><strong style=\"mso-bidi-font-weight:normal\">2 Traços Animais Específicos</strong><span style=\"mso-bidi-font-weight:bold\"> da Origem de Poder de </span><strong style=\"mso-bidi-font-weight:normal\">Corpo Amaldiçoado</strong><span style=\"mso-bidi-font-weight:bold\">.</span></p><p></p><p><span style=\"font-size:large\"><strong>DESVANTAGENS DA VARIANTE</strong></span></p><hr><p><strong style=\"mso-bidi-font-weight:normal\">Aniquilação Mútua: </strong><span style=\"mso-bidi-font-weight:bold\">Seu corpo não pode conter energia reversa por ser feito totalmente de energia negativa. Dessa forma, você não pode utilizar Reversão de Feitiços assim como recebe dano dobrado de energia reversa e Reversão de Feitiços.</span></p><p style=\"tab-stops:467.8pt\" class=\"TextoPadro\"><strong style=\"mso-bidi-font-weight:normal\">Natureza Imutável:</strong><span style=\"mso-bidi-font-weight:bold\"> Você não recebe e nem possui talentos de origem.</span></p>"
