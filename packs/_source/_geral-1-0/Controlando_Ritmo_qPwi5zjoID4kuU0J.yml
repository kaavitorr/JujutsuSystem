system:
  description:
    value: "<p>A partir do <strong>2º nível de Especialista</strong>, seu corpo passa a emitir grandes quantidades de energia amaldiçoada, que você pode usar para aprimorar seus golpes e sua velocidade.</p><p class=\"TextoPadro\">Sempre que você errar uma jogada de ataque (Comum ou de Técnica), pode escolher um dos seguintes efeitos para a sua próxima ação:</p><ul><li><p>Receber +2 nas jogadas de acerto em um ataque (Comum ou de Técnica);</p></li><li><p>Ou aumentar em +2 a CD de uma técnica ou feitiço em área (apenas para o dano).</p></li></ul><p class=\"TextoPadro\">\_</p><p class=\"TextoPadro\">Além disso, sempre que utilizar a ação “Atacar”, você pode realizar uma jogada de ataque adicional. Por fim, sempre que obtiver um 1 natural em uma jogada de ataque, você pode rolá-la novamente.</p>"
