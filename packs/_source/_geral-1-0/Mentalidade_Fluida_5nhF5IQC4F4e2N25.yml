system:
  description:
    value: >-
      <p class="MsoBodyText">A partir do <strong>7º nível de
      Estrategista</strong>, você se torna capaz de utilizar sua astúcia para
      lidar com a maioria das situações ao seu redor. Você pode usar o
      modificador de Sabedoria para realizar Testes de Atributo de Intelecto e
      Presença. Você recebe um número de usos dessa característica igual seu
      nível de personagem, recuperando todos os usos ao fim de um descanso
      longo.</p><p class="MsoBodyText">Adicionalmente, você recebe proficiência
      em Salvaguardas de Intelecto e Presença, caso não possua.</p>
