  description:
    value: "<p><strong>Ajuste de Atributo:</strong> +4 Pontos de Atributo para distribuir entre todos os 6 atributos.</p><p><strong>Vida Base:</strong> 10 Pontos de Vida.</p><p><strong>Tamanho:</strong> 1,50 a 2,00 metros (pequeno, médio).</p><p><strong>Peso:</strong> Normalmente, entre 45 kg e 200 kg.</p><p><strong>Deslocamento:</strong> 9 metros.</p><p><strong>Nado:</strong> 4,5 metros.</p><p>\_</p><table border=\"1\" style=\"margin-left:0pt;border-collapse:collapse;border:none\" class=\"MsoTableGrid\"><tbody><tr><td><p style=\"line-height:7pt;text-align:center\"><span style=\"font-size:large\"><strong>CARACTERÍSTICAS DA ESPÉCIA</strong></span></p></td></tr></tbody></table><p><span style=\"font-size:10pt;line-height:102%;font-family:'Chaparral Pro', serif\">Essas</span><span style=\"letter-spacing:0.7pt\"> </span><span style=\"font-size:10pt;line-height:102%;font-family:'Chaparral Pro', serif\">características</span><span style=\"letter-spacing:0.55pt\"> </span><span style=\"font-size:10pt;line-height:102%;font-family:'Chaparral Pro', serif\">acompanham</span><span style=\"letter-spacing:0.55pt\"> </span><span style=\"font-size:10pt;line-height:102%;font-family:'Chaparral Pro', serif\">a</span><span style=\"letter-spacing:0.7pt\"> </span><span style=\"font-size:10pt;line-height:102%;font-family:'Chaparral Pro', serif\">existência</span><span style=\"letter-spacing:0.65pt\"> </span><span style=\"font-size:10pt;line-height:102%;font-family:'Chaparral Pro', serif\">do</span><span style=\"letter-spacing:0.8pt\"> </span><span style=\"font-size:10pt;line-height:102%;font-family:'Chaparral Pro', serif\">personagem,</span><span style=\"letter-spacing:0.75pt\"> </span><span style=\"font-size:10pt;line-height:102%;font-family:'Chaparral Pro', serif\">são</span><span style=\"letter-spacing:0.6pt\"> </span><span style=\"font-size:10pt;line-height:102%;font-family:'Chaparral Pro', serif\">representações</span><span style=\"letter-spacing:0.75pt\"> </span><span style=\"font-size:10pt;line-height:102%;font-family:'Chaparral Pro', serif\">da</span><span style=\"letter-spacing:0.65pt\"> </span><span style=\"font-size:10pt;line-height:102%;font-family:'Chaparral Pro', serif\">sua</span><span style=\"letter-spacing:0.7pt\"> </span><span style=\"font-size:10pt;line-height:102%;font-family:'Chaparral Pro', serif\">origem,</span><span style=\"letter-spacing:0.55pt\"> </span><span style=\"font-size:10pt;line-height:102%;font-family:'Chaparral Pro', serif\">sendo</span><span style=\"letter-spacing:0.6pt\"> </span><span style=\"font-size:10pt;line-height:102%;font-family:'Chaparral Pro', serif\">uma</span><span style=\"letter-spacing:0.8pt\"> </span><span style=\"font-size:10pt;line-height:102%;font-family:'Chaparral Pro', serif\">parte</span><span style=\"letter-spacing:0.6pt\"> </span><span style=\"font-size:10pt;line-height:102%;font-family:'Chaparral Pro', serif\">essencial</span><span style=\"letter-spacing:0.75pt\"> </span><span style=\"font-size:10pt;line-height:102%;font-family:'Chaparral Pro', serif\">de</span><span style=\"letter-spacing:0.05pt\"> </span><span>como</span><span style=\"letter-spacing:-0.45pt\"> </span><span>ele</span><span style=\"letter-spacing:-0.4pt\"> </span><span>vê</span><span style=\"letter-spacing:-0.45pt\"> </span><span>o</span><span style=\"letter-spacing:-0.4pt\"> </span><span>mundo</span><span style=\"letter-spacing:-0.55pt\"> </span><span>e</span><span style=\"letter-spacing:-0.4pt\"> </span><span>de</span><span style=\"letter-spacing:-0.45pt\"> </span><span>como</span><span style=\"letter-spacing:-0.5pt\"> </span><span>o</span><span style=\"letter-spacing:-0.45pt\"> </span><span>mundo</span><span style=\"letter-spacing:-0.4pt\"> </span><span>olha</span><span style=\"letter-spacing:-0.4pt\"> </span><span>pra</span><span style=\"letter-spacing:-0.35pt\"> </span><span>ele.</span></p><p style=\"margin:0.5pt 0cm 0.0001pt 7.1pt;text-align:justify\"></p><p><span style=\"font-size:large\"><strong>BENEFÍCIOS DA ORIGEM - KAMO</strong></span></p><hr><ul><li><p><strong>Técnica Herdada: </strong>Como um membro da linhagem do Clã Kamo, você recebe acesso a técnica herdada da <strong>“Manipulação de Sangue”</strong>.</p></li><li><p><strong>Controle Refinado: </strong>Você consegue gerar sangue a partir da energia amaldiçoada, assim como controla-lo com quase perfeição. Você recebe imunidade a condição <strong>“Sangramento” </strong>e<strong> “Envenenado”</strong>, assim como ignora níveis de exaustão de 2º nível ou inferior.</p></li></ul><p></p><p><span style=\"font-size:large\"><strong>DESVANTAGENS DA VARIANTE</strong></span></p><hr><ul><li><p><strong>Letargia Inescapável:</strong> Você recebe 2 Pontos de Sangue, onde um é consumido ao fim de cada encontro que você usou sua técnica herdada. Caso você fique com 0 Pontos, você recebe a condição “Letárgico” até o fim do seu próximo descanso curto ou longo. Você recupera 1 Ponto de Sangue por descanso longo.</p><p class=\"TextoPadro\">Se você utilizar sua técnica amaldiçoada tendo 0 Pontos de Sangue, a letargia só é removida ao fim de um descanso longo ao invés de um curto.\_<span style=\"font-size:5pt\">\_</span></p><table><tbody><tr style=\"mso-yfti-irow:0;mso-yfti-firstrow:yes;mso-yfti-lastrow:yes\"><td><p class=\"TextoPadro\"><strong>EXCEÇÕES DO CLÃ KAMO</strong></p><p class=\"MsoNormal\">Apesar de não serem capazes de gerar sangue no mundo de Jujutsu, essa exceção foi feita com as mecânicas do RPG em mente, em vista de equilibra-lo com os outros clãs e diminuir o empecilho do jogador.</p></td></tr></tbody></table><p style=\"tab-stops:467.8pt\" class=\"TextoPadro\"><span style=\"font-size:5pt\">\_</span></p></li></ul>"
