name: Ativação Veloz
type: feat
img: icons/magic/light/beam-strike-orange-gold.webp
system:
  description:
    value: >-
      <p>A partir do <strong>6º nível de Especialista</strong>, você aprendeu a
      ativar suas técnicas e feitiços com grande velocidade, movendo sua energia
      por instinto para causar efeitos massivos durante um combate. Sempre que
      você utilizar uma técnica de manipulação ou feitiço com uma ação de poder,
      role um d20. Em um resultado de 11 ou maior, você pode, dentro de 3
      rodadas, utilizar uma técnica, habilidade menor ou feitiço de custo
      inferior que utilize ação de poder, mas você pode ativa-la usando uma ação
      bônus no lugar.</p><p class="MsoNormal">Adicionalmente, suas técnicas,
      feitiços e características com duração maior que 1 rodada não podem ser
      interrompidas por técnicas, feitiços, características ou efeitos, a menos
      que possuam “Concentração”. Caso alguma habilidade tenha um efeito
      constante que force sua desativação, ela volta de onde parou após você se
      livrar do efeito.</p>
