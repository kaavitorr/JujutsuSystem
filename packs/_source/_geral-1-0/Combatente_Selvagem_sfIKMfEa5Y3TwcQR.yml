folder: TH5zgkPcMDGwUXiB
name: Combatente Selvagem
type: feat
img: icons/magic/control/buff-flight-wings-runes-blue.webp
system:
  description:
    value: >-
      <p style="text-align:justify">A partir do 1º nível de Lutador, ao realizar
      uma jogada de ataque (comum) corpo a corpo desarmado durante a batalha,
      você pode implementar seus golpes, escolhendo um dos seguintes movimentos
      especiais:</p><ul><li><p><strong>Avanço Selvagem:</strong> Se você se
      mover pelo menos 3 metros em linha reta antes do ataque, o alvo sofre 1d6
      de dano extra.</p><p class="MsoListParagraph">Alternativamente, você pode
      escolher não causar o dano extra e forçar a criatura atingida, com
      categoria de tamanho Grande ou menor, a ser bem-sucedida em uma
      Salvaguarda de Força para não ser empurrada para um espaço desocupado a
      até 6 metros dela. Caso bata em uma estrutura ou objeto com raio maior que
      1,5 metro, recebe 2d8 de dano extra.</p></li><li><p><strong>Golpe
      Baixo:</strong> Você pode mirar um golpe nas pernas do inimigo para inibir
      sua mobilidade. A criatura recebe 1d6 de dano extra e uma redução de 3
      metros do seu deslocamento, até o final do próximo turno dela.</p><p
      class="MsoListParagraph">Alternativamente, você pode escolher não causar o
      dano extra e a redução de deslocamento para forçar a criatura atingida a
      receber a condição “Caído”, sem a necessidade de um
      teste.</p></li><li><p><strong>Subjugador:</strong> Você executa uma jogada
      de ataque (comum) corpo a corpo contra uma criatura, com categoria de
      tamanho Grande ou menor, e impõe a condição “Agarrado” ao invés de causar
      dano.</p></li></ul>
