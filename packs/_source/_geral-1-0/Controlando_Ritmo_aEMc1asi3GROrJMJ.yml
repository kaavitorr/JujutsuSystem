system:
  description:
    value: >-
      <p class="MsoNormal">A partir do <strong>6º nível de Lutador</strong>,
      quando você for alvo de uma jogada de ataque (Comum ou de Técnica) de uma
      criatura inimiga, você pode escolher ser atingido automaticamente de forma
      controlada para receber +10 em sua próxima rolagem de acerto. Se você
      causar um acerto crítico nessa rolagem de acerto, você recebe 1 dado de
      dano adicional ao resultado final.</p><p class="MsoNormal">Forçar um
      acerto automático em si mesmo dessa forma nega qualquer crítico normal que
      você sofreria sem ser de 20 natural, mas a criatura ainda rola para tentar
      ativar um Fulgor Negro.</p>
