system:
  description:
    value: "<p class=\"MsoNormal\">A partir do <strong>14º nível de Lutador</strong>, você aprendeu a explodir com seu potencial em momentos de importância dentro de um combate. Ao usar uma ação bônus, você libera uma quantidade enorme de energia amaldiçoada e recebe as seguintes características pelo próximo minuto:</p><ul><li><p><em>Você gera energia amaldiçoada adicional igual seu nível de personagem;</em></p></li><li><p><em>Você causa 2d4 de dano adicional em todas as suas jogadas de ataque (Comuns e de Técnica);</em></p></li><li><p><em>Suas jogadas de ataque (Comuns e de Técnica) ignoram resistências e invulnerabilidades de criaturas inimigas.</em></p></li></ul><p class=\"MsoNormal\">\_</p><p class=\"MsoNormal\">Você pode ativar essa característica 3 vezes, recuperando seus usos ao fim de um descanso longo.</p>"
