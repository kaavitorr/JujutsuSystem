system:
  description:
    value: "<p>Você realiza um golpe contra o ponto vital e, antes de atingir, gira seu corpo desferindo um chute na lateral do corpo do alvo. A criatura deve realizar uma Salvaguarda de [[/save str dc=@attributes.spell.dc]] para não ser atirada 6 metros em uma direção a sua escolha.</p><p>\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_ Se, durante o empurrão, a criatura colidir com um objeto ou estrutura de 1,5 metros de raio ou maior, ela recebe 2d8 de dano Contundente adicional.</p><hr><p><strong>Duração:</strong> Instantâneo</p><p><strong>Alcance:</strong>\_Toque</p><p><strong>Requisito:</strong>\_Ação de Poder</p><p><strong>Dano:</strong> 4d10 de dano Contundente</p><p><strong>Custo:</strong> 4 PA</p>"
