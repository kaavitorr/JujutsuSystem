    value: >-
      <p style="tab-stops:467.8pt" class="TextoPadro"><span
      style="mso-bidi-font-size:10.0pt">A partir do<strong> 6º nível de
      Lutador</strong>, você pode aproveitar a ativação de um Fulgor Negro para
      continuar sua investida contra as criaturas ao seu redor. Uma vez por
      rodada, ao ativar um Fulgor Negro, você recebe 2 jogadas de ataque
      (Comuns) adicionais.</span></p><p
      style="text-indent:1.0cm;tab-stops:467.8pt" class="TextoPadro"><span
      style="mso-bidi-font-size:10.0pt">Se uma criatura morrer como consequência
      do seu Fulgor, você recebe um turno extra ao final do turno atual, podendo
      novamente obter ataques adicionais nessa rodada. Esse efeito pode ser
      ativado até 3 vezes por encontro.</span></p>
