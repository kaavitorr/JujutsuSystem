system:
  description:
    value: >-
      <p>A partir do <strong>19º nível</strong> <strong>de Sentinela</strong>,
      você superou o que se julgava possível para um usuário do Novo Estilo das
      Sombras, conseguindo ultrapassar até mesmo seu criador em questão de
      maestria. Você recebe acesso as seguintes
      características:</p><ul><li><p><em>Você não consome mais reações para
      ativar o “Yuzuki”, mas ainda paga seu custo;</em></p></li><li><p><em>Você
      pode utilizar técnicas de 3º grau ou menor de Sentinela sem consumir
      PA;</em></p></li><li><p><em>Você recebe uma jogada de ataque (Comum)
      adicional na característica Ataque Extra;</em></p></li><li><p><em>Você não
      pode receber desvantagem em rolagens de acerto e pode utilizar “Hazy Moon”
      de mãos vazias e sem custo;</em></p></li><li><p><em>Você gera naturalmente
      3 vezes o seu nível em Pontos de Energia Amaldiçoada
      (PA)</em>.</p></li></ul>
