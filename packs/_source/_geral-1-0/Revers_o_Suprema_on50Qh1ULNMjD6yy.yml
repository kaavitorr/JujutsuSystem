system:
  description:
    value: >-
      <p class="TextoPadro">A partir do <strong>14º nível de
      Estrategista</strong>, você aprendeu técnicas de reversão e controle de
      energia amaldiçoada tão miraculosas que elas têm efeitos que só seriam
      possíveis normalmente ao utilizar energia reversa em si mesmo. Você recebe
      as seguintes características:</p><ul><li><p>Seu dado de “Energia Reversa”
      aumenta em 2 passos, indo de d4 para d8;</p></li><li><p>Você pode utilizar
      a técnica “Energia Reversa Avançada” em outras criaturas com o dobro do
      custo;</p></li><li><p>Enquanto você estiver com a “Regeneração Constante”
      ativada em si mesmo, você é imune a dano crítico sem ser de Fulgor
      Negro.</p></li></ul>
