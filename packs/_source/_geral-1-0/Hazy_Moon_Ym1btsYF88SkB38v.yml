system:
  description:
    value: "<p>Uma técnica que permite que você cria uma lâmina de energia amaldiçoada envolvendo sua arma ou substituindo uma lâmina quebrada. Enquanto ela estiver ativa, você recebe as seguintes características:</p><ul><li><p><em>Seu dano aumenta em um passo (d8 &gt; d10);</em></p></li><li><p><em>Você recebe vantagem em uma rolagem de acerto por rodada.</em></p></li></ul><hr><p>\_<strong>Duração:</strong> Até 1 minuto</p><p><strong>Alcance:</strong>\_Pessoal</p><p><strong>Requisito:</strong> Katana, Ação Bônus</p><p><strong>Custo:</strong> 5 PA</p>"
