system:
  description:
    value: "<p style=\"text-align:center\"><span><span style=\"font-size:38px\"><strong>RECEPTÁCULO</strong></span></span></p><p style=\"margin-bottom:.0001pt;text-justify:inter-ideograph;line-height:normal;mso-layout-grid-align:none;text-autospace:none;text-align:justify\"><span style=\"font-family:'Chaparral Pro, serif'\">\_</span></p><p><strong>Ajuste de Atributo:</strong> +4 Pontos de Atributo para distribuir entre todos os 6 atributos.</p><p><strong>Vida Base:</strong> 10 Pontos de Vida.</p><p><strong>Tamanho:</strong> 1,50 a 2,00 metros (pequeno, médio).</p><p><strong>Peso:</strong> Normalmente, entre 45 kg e 200 kg.</p><p><strong>Deslocamento:</strong> 9 metros.</p><p><strong>Nado:</strong> 4,5 metros.</p><p>\_</p><table border=\"1\" style=\"margin-left:0pt;border-collapse:collapse;border:none\" class=\"MsoTableGrid\"><tbody><tr><td><p style=\"line-height:7pt;text-align:center\"><span style=\"font-size:large\"><strong>CARACTERÍSTICAS DA ESPÉCIA</strong></span></p></td></tr></tbody></table><p><span style=\"font-size:10.0pt;line-height:102%;font-family:'Chaparral Pro',serif\">Essas</span><span style=\"letter-spacing:.7pt\"> </span><span style=\"font-size:10.0pt;line-height:102%;font-family:'Chaparral Pro',serif\">características</span><span style=\"letter-spacing:.55pt\"> </span><span style=\"font-size:10.0pt;line-height:102%;font-family:'Chaparral Pro',serif\">acompanham</span><span style=\"letter-spacing:.55pt\"> </span><span style=\"font-size:10.0pt;line-height:102%;font-family:'Chaparral Pro',serif\">a</span><span style=\"letter-spacing:.7pt\"> </span><span style=\"font-size:10.0pt;line-height:102%;font-family:'Chaparral Pro',serif\">existência</span><span style=\"letter-spacing:.65pt\"> </span><span style=\"font-size:10.0pt;line-height:102%;font-family:'Chaparral Pro',serif\">do</span><span style=\"letter-spacing:.8pt\"> </span><span style=\"font-size:10.0pt;line-height:102%;font-family:'Chaparral Pro',serif\">personagem,</span><span style=\"letter-spacing:.75pt\"> </span><span style=\"font-size:10.0pt;line-height:102%;font-family:'Chaparral Pro',serif\">são</span><span style=\"letter-spacing:.6pt\"> </span><span style=\"font-size:10.0pt;line-height:102%;font-family:'Chaparral Pro',serif\">representações</span><span style=\"letter-spacing:.75pt\"> </span><span style=\"font-size:10.0pt;line-height:102%;font-family:'Chaparral Pro',serif\">da</span><span style=\"letter-spacing:.65pt\"> </span><span style=\"font-size:10.0pt;line-height:102%;font-family:'Chaparral Pro',serif\">sua</span><span style=\"letter-spacing:.7pt\"> </span><span style=\"font-size:10.0pt;line-height:102%;font-family:'Chaparral Pro',serif\">origem,</span><span style=\"letter-spacing:.55pt\"> </span><span style=\"font-size:10.0pt;line-height:102%;font-family:'Chaparral Pro',serif\">sendo</span><span style=\"letter-spacing:.6pt\"> </span><span style=\"font-size:10.0pt;line-height:102%;font-family:'Chaparral Pro',serif\">uma</span><span style=\"letter-spacing:.8pt\"> </span><span style=\"font-size:10.0pt;line-height:102%;font-family:'Chaparral Pro',serif\">parte</span><span style=\"letter-spacing:.6pt\"> </span><span style=\"font-size:10.0pt;line-height:102%;font-family:'Chaparral Pro',serif\">essencial</span><span style=\"letter-spacing:.75pt\"> </span><span style=\"font-size:10.0pt;line-height:102%;font-family:'Chaparral Pro',serif\">de</span><span style=\"letter-spacing:.05pt\"> </span><span style=\"mso-font-width:105%\">como</span><span style=\"letter-spacing:-.45pt\"> </span><span style=\"mso-font-width:105%\">ele</span><span style=\"letter-spacing:-.4pt\"> </span><span style=\"mso-font-width:105%\">vê</span><span style=\"letter-spacing:-.45pt\"> </span><span style=\"mso-font-width:105%\">o</span><span style=\"letter-spacing:-.4pt\"> </span><span style=\"mso-font-width:105%\">mundo</span><span style=\"letter-spacing:-.55pt\"> </span><span style=\"mso-font-width:105%\">e</span><span style=\"letter-spacing:-.4pt\"> </span><span style=\"mso-font-width:105%\">de</span><span style=\"letter-spacing:-.45pt\"> </span><span style=\"mso-font-width:105%\">como</span><span style=\"letter-spacing:-.5pt\"> </span><span style=\"mso-font-width:105%\">o</span><span style=\"letter-spacing:-.45pt\"> </span><span style=\"mso-font-width:105%\">mundo</span><span style=\"letter-spacing:-.4pt\"> </span><span style=\"mso-font-width:105%\">olha</span><span style=\"letter-spacing:-.4pt\"> </span><span style=\"mso-font-width:105%\">pra</span><span style=\"letter-spacing:-.35pt\"> </span><span style=\"mso-font-width:105%\">ele.</span></p><p style=\"margin-top:.5pt;margin-right:0cm;margin-bottom:.0001pt;margin-left:7.1pt;text-justify:inter-ideograph;tab-stops:7.1pt 345.55pt 467.8pt 522.85pt;text-align:justify\"></p><p><span style=\"font-size:large\"><strong>BENEFÍCIOS DA ORIGEM - RESTRIÇÃO CELESTIAL</strong></span></p><hr><ul><li><p><strong>Talento de Origem: </strong>No <strong>3º nível</strong>, você recebe um talento de origem de acordo com o <strong>Capítulo 6</strong>.\_</p></li><li><p><strong>Receptáculo Amaldiçoado:</strong> Você pode consumir objetos amaldiçoados para ganhar energia amaldiçoada. Após 30 dias de ter consumido um objeto, você recebe uma técnica inata relacionado a ele. Você pode ter um máximo de 2 técnicas, que não podem ser trocadas, e todo objeto ingerido após isso não serve para essa característica.</p></li><li><p><strong>Resistência Elevada:</strong>Seu corpo é feito especialmente para conter maldições e seus efeitos. Dessa forma, você tem uma resistência enorme a efeitos debilitantes causados por elas. Você recebe resistência a efeitos negativos e condições causados por maldições e feitiços inatos, recebendo +5 em Salvaguarda contra eles.</p><p style=\"margin-left:1.0cm;text-indent:35.45pt;tab-stops:467.8pt\" class=\"TextoPadro\">Essa habilidade também torna você extremamente resistente a Venenos e Toxinas de todos os tipos, ignorando seus efeitos debilitantes.</p></li></ul><p></p><p><span style=\"font-size:large\"><strong>DESVANTAGENS DA VARIANTE</strong></span></p><hr><ul><li><p><strong>Reencarnação Temporária: </strong>Os objetos que você consome podem acabar lutando para tomar o controle. Toda vez que sua vida cair abaixo de 1/3, você deve realizar uma Salvaguarda de Presença CD 16 para manter o controle. Além disso, se você cair a 0 Pontos de Vida, você recupera todos os PV e o objeto reencarna por 10 minutos. Essa reencarnação não liga se você morre ou vive e nunca irá fugir de uma luta, mas se ela morrer, você também morre permanentemente.</p></li><li><p><strong>Peso da Maldição:</strong> Ao receber uma segunda técnica inata pelo Receptáculo Amaldiçoado, você perde ¼ do seu valor máximo de Pontos de Energia Amaldiçoada (PA).</p></li><li><p><strong>Potencial Inexplorado: </strong>Você nasceu sem uma técnica inata, dependendo apenas da energia amaldiçoada e do seu poderoso físico para lutar. Em alguns casos, você pode sequer ter energia amaldiçoada, dependendo apenas de ferramentas para tal, mas esses casos são extremamente raros e de cunho narrativo.</p></li></ul>"
