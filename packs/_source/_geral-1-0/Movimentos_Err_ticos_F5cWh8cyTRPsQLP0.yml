name: Movimentos Erráticos
type: feat
img: icons/magic/fire/explosion-flame-blue.webp
system:
  description:
    value: >-
      <p class="MsoNormal">A partir do <strong>6º nível de
      Especialista,</strong> você e seu Shikigami estão constantemente se
      movendo e trocando de posição durante o combate. Dessa forma, sempre que
      você ou ele forem alvos de uma rolagem de dano, e o outro estiver a até 9
      metros de distância, vocês podem trocar de posição, redirecionando o alvo
      do dano de um para o outro e trocando de posições no processo através de
      impulsos de alta velocidade.</p><p class="MsoNormal">Ao utilizar essa
      característica com um Shikigami, você não pode invoca-lo novamente por
      pelo menos 3 rodadas caso ele seja destruído como consequência da
      transferência de dano.</p><p class="MsoNormal">Você pode realizar a troca
      pelo menos uma vez por rodada de cada criatura.</p>
