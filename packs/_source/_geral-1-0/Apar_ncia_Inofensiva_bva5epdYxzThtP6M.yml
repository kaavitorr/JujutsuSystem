system:
  description:
    value: >-
      <p class="MsoNormal">Por algum motivo você não parece perigoso. Talvez
      pareça muito pequeno, muito fraco, uma menininha segurando um pirulito.
      Você escolhe o motivo.</p><p class="MsoNormal">Além de outros benefícios,
      como não levantar suspeitas. Possuir este talento também ajuda em
      combates, pegando oponentes desprevenidos. O truque não funciona com
      ninguém que já tenha visto você lutar, e não engana duas vezes a mesma
      pessoa.</p><p class="MsoBodyText"><strong>Característica:</strong> Você
      recebe + 5 na primeira jogada de ataque ou técnica contra uma criatura que
      não desconfie de você. Além disso, você possui – 2 em Testes de Atributo
      de Presença (Intimidação).</p>
