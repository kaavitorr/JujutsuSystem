system:
  description:
    value: >-
      <p class="MsoNormal">A partir do <strong>6º nível de
      Especialista</strong>, você aprendeu a canalizar sua energia amaldiçoada
      com maior potencial ofensivo. Toda vez que você receber Dados de Técnica,
      você recebe 1 adicional. Além disso, você recebe as seguintes
      características:</p><ul><li><p><em>Seus Dados de Técnica se tornam d8 no
      lugar do d6 original;</em></p></li><li><p><em>Você não tem mais limite
      para quantos dados de técnica pode acumular, mas o excedente some ao fim
      do combate;</em></p></li><li><p><em>Você pode usar Regenerar Maldição em
      si mesmo, mas com limite de 5 dados e apenas uma vez por descanso
      longo.</em></p></li></ul>
