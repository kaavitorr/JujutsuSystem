system:
  description:
    value: >-
      <p class="MsoBodyText">Você possui uma constituição mais forte que o
      normal, permitindo que você possa aguentar danos que de outra forma seriam
      os suficientes para derrubar qualquer outra criatura. Quando você for alvo
      de uma jogada de ataque (Comum ou de Técnica) ou tiver que realizar uma
      Salvaguarda de alvo único, você pode usar sua reação para reduzir o dano a
      0, mas ela deve ser ativada antes de saber se o ataque acertou ou errou.
      Você pode utilizar esse efeito uma vez, recuperando seu uso após o fim de
      um descanso longo. Ao reduzir um dano, de técnica ou feitiço, maior que
      50, você demora um descanso longo adicional para recuperar o uso dessa
      característica, aumentando em 1 descanso longo para cada 50 Pontos de Dano
      adicionais.</p>
