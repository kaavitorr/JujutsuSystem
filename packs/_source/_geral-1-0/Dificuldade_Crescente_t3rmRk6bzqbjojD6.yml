system:
  description:
    value: >-
      <p>A partir do <strong>14º nível de Especialista</strong>, toda vez que a
      criatura tirar um resultado no dado de 5 ou menor em Salvaguarda sua, ou
      você realizar um acerto crítico com técnica ou feitiço, você aumenta a CD
      de técnicas e feitiços para tomar todo ou metade do dano em +2, ou o
      acerto das suas técnicas ou feitiços em +2 respectivamente. Você pode
      acumular um máximo de 32 de CD ou +10 de acerto.</p><p
      class="MsoListParagraph">Além disso, ao executar uma técnica ou feitiço
      com mais de 8 PA, você pode fazer com que o primeiro um terço dos dados
      tenham resultado máximo.</p>
