system:
  description:
    value: "<p class=\"MsoNormal\">Você possui uma reserva de estamina e pode usá-la para proteger a si mesmo contra danos. No seu turno, você pode usar uma ação bônus para recuperar Pontos de Vida igual a 2 dados de vida + seu modificador de Constituição. Esta característica pode ser usada 3 vezes e recupera todos os seus usos após você terminar um descanso longo.</p><p class=\"MsoNormal\">O valor do dado rolado é igual ao do dado de vida do seu Estilo de Combate. Por exemplo: Se você for um lutador, você rola 2d10 + seu modificador de Constituição.</p><p class=\"MsoBodyText\">\_\_\_\_\_\_\_\_\_\_\_ Está habilidade aumenta para 4 dados de vida no 6º nível e para 6 dados de vida no 10º nível.</p>"
