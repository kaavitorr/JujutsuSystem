system:
  description:
    value: "<p style=\"text-align:center\"><span style=\"font-size:38px\"><strong>RESTRINGIDO</strong></span></p><p>\_</p><p><span style=\"font-size:large\"><strong>PONTOS DE VIDA</strong></span></p><p class=\"MsoNormal\">D<strong>ado de Vida:</strong> 1d12 por nível de Restringido.</p><p class=\"MsoNormal\"><strong>Pontos de Vida no 1º nível:</strong> 12 + seu modificador de Constituição.</p><p class=\"MsoNormal\"><strong>Média de Vida por nível:</strong> 7 + seu modificador de constituição por nível posterior.</p><p class=\"MsoNormal\"><strong>Pontos de Vida nos níveis seguintes:</strong> 1d12 + seu modificador de constituição por nível posterior.</p><p class=\"MsoNormal\">\_</p><p class=\"MsoNormal\"><span style=\"font-size:large\"><strong>PROFICIÊNCIAS</strong></span></p><p class=\"MsoNormal\"><strong>Equipamentos:</strong> Armas Marciais, uma Arma a sua escolha.</p><p class=\"MsoNormal\"><strong>Salvaguarda:</strong> Força ou Agilidade e Constituição.</p><p class=\"MsoNormal\"><strong>Perícias:</strong> Escolha 4 perícias para receber proficiência, sem ser Controle de Energia, Feitiço e Sorte.</p><p class=\"MsoNormal\">\_</p><p class=\"MsoNormal\"><span style=\"font-size:large\"><strong>INFORMAÇÕES GERAIS</strong></span></p><p class=\"MsoBodyText\"><strong>Atributo Principal:</strong> Força ou Agilidade (à sua escolha).</p><p class=\"MsoNormal\"><strong>Habilidade Inata:</strong> Escolha entre “Corpo de Lutador” ou “Superioridade Absoluta”.</p><p class=\"MsoNormal\"><strong>Talento:</strong> Escolha dois entre qualquer talento que você possua os requisitos.</p><p class=\"MsoNormal\"><strong>Equipamentos:</strong> Você recebe uma arma amaldiçoada de 4º grau, um par óculos ou lentes de contato que permite ver energia amaldiçoada e; $ 5.000.</p><p><strong>Arsenal Vazio:</strong> Você recebe um Espírito com a habilidade “Inventário” que demora 9 níveis para amadurecer e ser usado. Ele pode armazenar 10 ferramentas e não sofre dano ou pode ser alvo enquanto estiver junto de seu corpo</p><p></p><img src=\"systems/jujutsu-system/assets/Tabelas/Restringido.png\"><p></p><table border=\"1\" style=\"margin-left:0pt;border-collapse:collapse;border:none\" class=\"MsoTableGrid\"><tbody><tr><td><p style=\"line-height:7pt;text-align:center\"><span style=\"font-size:large\"><strong>CRIANDO UM ESPECIALISTA</strong></span></p></td></tr></tbody></table><p>Para criar rapidamente um Restringido, primeiro distribua seus atributos, colocando o mais alto em Força ou Agilidade, de acordo com sua escolha de atributo principal. O segundo atributo mais alto deve ser Constituição. Escolha a origem de poder de Restrição Celestial e as habilidades básicas de Corpo de Lutador, Retomar Fôlego e Poço de Estamina.</p><p class=\"MsoNormal\">Após isso, foque em pegar talentos para aumentar suas perícias que serão importantes no início do jogo, principalmente em talentos que dão proficiência nas perícias: Atletismo, Acrobacia, Percepção e Sobrevivência.</p><p style=\"margin:0cm -1.65pt 0.0001pt 7.1pt;text-align:justify\"><span style=\"font-family:'Chaparral Pro, serif'\">\_</span></p><table border=\"1\" style=\"margin-left:0pt;border-collapse:collapse;border:none\" class=\"MsoTableGrid\"><tbody><tr><td><p style=\"line-height:7pt;text-align:center\"><span style=\"font-size:large\"><strong>ACERTO E SALVAGUARDA</strong></span></p></td></tr></tbody></table><p>Você possui os seguintes modificadores para acerto de técnica ou feitiços e CD de Salvaguardas:</p><p class=\"MsoBodyText\"><strong>CD das técnicas =</strong> 8 + bônus de proficiência + seu modificador de Força ou Agilidade.</p><p class=\"MsoBodyText\"><strong>Modificador da técnica =</strong> seu bônus de proficiência + seu modificador de Força ou Agilidade.</p><p style=\"margin:0cm -1.65pt 0.0001pt 7.1pt;text-align:justify\"><span style=\"font-family:'Chaparral Pro, serif'\">\_</span></p><p></p><p style=\"text-align:center\"><span style=\"font-size:large\"><strong>CARACTERÍSTICAS DE COMBATE</strong></span></p><p>\_Como um manipulador, você recebe as seguintes características:<span style=\"font-family:'Chaparral Pro, serif'\">\_</span><span style=\"font-size:20.0pt;mso-bidi-font-size:11.0pt;font-family:'Chaparral Pro',serif\"><strong style=\"mso-bidi-font-weight:normal\">\_</strong></span></p><table border=\"1\" style=\"margin-left:7.1pt;border-collapse:collapse;border:none;mso-border-alt:solid windowtext .5pt;mso-yfti-tbllook:1184;mso-padding-alt:0cm 5.4pt 0cm 5.4pt\" class=\"MsoTableGrid\"><tbody><tr style=\"mso-yfti-irow:0;mso-yfti-firstrow:yes;mso-yfti-lastrow:yes\"><td><p class=\"MsoNormal\"><span style=\"font-size:large\"><strong>PECULIARIDADES DO RESTRINGIDO</strong></span></p><p class=\"MsoNormal\">Como uma criatura sem nenhuma energia amaldiçoada, você tem algumas características inatas da sua natureza. Você recebe acesso as seguintes características inatamente:</p><ul><li><p><em>Você é imune a habilidade de “Sentir Maldição” da manipulação de Energia Amaldiçoada;</em></p></li><li><p><em>Você pode passar livremente entre domínios e barreiras. Seja entrando, saindo ou se movendo dentro dele;</em></p></li><li><p><em>Você é naturalmente imune aos efeitos de acerto automático dos domínios;</em></p></li><li><p><em>Você possui “Vigor” no lugar de energia amaldiçoada e utiliza a mesma regra para geração da mesma;</em></p></li><li><p><em>Você pode treinar seu “Vigor” pelas regras de Treinamento Intenso do “Capítulo 6”.</em></p></li></ul></td></tr></tbody></table><table border=\"1\" style=\"margin-left:0pt;border-collapse:collapse;border:none\" class=\"MsoTableGrid\"><tbody><tr><td><p style=\"line-height:7pt;text-align:center\"><span style=\"font-size:large\"><strong>CORPO APRIMORADO</strong></span></p></td></tr></tbody></table><p>A partir do <strong>1º nível de Restringido</strong>, devido a sua restrição, você recebeu certos benefícios gerais que ajudam você a se sobressair em combate. Você recebe as seguintes características:</p><ul><li><p><strong>Treinamento Físico:</strong> Você muda a perícia de “Controle de Energia” para “Controle Físico” e pode utiliza-la nos Treinamentos do Capítulo 6.5. Você não pode aprender treinamentos que usem efeitos ou habilidades que você não tem acesso, como “Energia Reversa”;</p></li><li><p><strong>Força Eficiente:</strong> Você recebe um bônus em Testes de Atributo de Força, Agilidade e Constituição igual metade do seu nível de personagem (arredondado para baixo);</p></li><li><p><strong>Golpe Certeiro:</strong> Você pode usar uma ação bônus para realizar um ataque (Comum) adicional, causando 1d4 de dano extra nesse ataque. A criatura atingida deve realizar uma Salvaguarda de Força para não receber a condição “Caído” ou ser empurrada por 9 metros de distância (à sua escolha).</p></li><li><p><strong>Velocidade Anormal:</strong> Seu deslocamento de caminhada, nado e escalada se torna 12. A partir do 5º nível de restringido, ele aumenta para 15 e novamente para 18 no 9º nível de restringido. Caso você possua “Perito em Fuga”, você recebe 3 metros de deslocamento adicionais.</p></li></ul><p style=\"margin:0cm 5.4pt 0.0001pt 7.1pt;text-align:justify\"></p><table border=\"1\" style=\"margin-left:0pt;border-collapse:collapse;border:none\" class=\"MsoTableGrid\"><tbody><tr><td><p style=\"line-height:7pt;text-align:center\"><span style=\"font-size:large\"><strong>CONSTITUIÇÃO ANÔMALA</strong></span></p></td></tr></tbody></table><p>A partir do <strong>2º nível de Restringido</strong>, seu físico evoluiu, te dando um metabolismo extremamente acelerado e um vigor extremo. Você recebe acesso as seguintes características:</p><ul><li><p><strong>Queima Agressiva:</strong> Você pode consumir 1 Ponto de Vigor para adicionar 1d4 de dano a sua próxima jogada de ataque (Comum) ou 1 dado de dano à sua próxima técnica. Você não pode adicionar um número de dados maior que seu bônus de proficiência.</p></li><li><p><strong>Queima Defensiva:</strong> Você pode consumir 1 Ponto de Vigor para reduzir 1d4 de dano ou adicionar 2d8 de redução a sua próxima redução de dano baseada em 2d8, até um máximo igual ao vigor gerado disponível.</p></li><li><p><strong>Metabolismo Extremo:</strong> Seu descanso longo se torna de 2 horas e seu descanso curto de 5 minutos. Além disso, você recupera todos os seus Pontos de Vigor, assim como os dados de vigor em um descanso longo.</p></li></ul><p></p><table border=\"1\" style=\"margin-left:0pt;border-collapse:collapse;border:none\" class=\"MsoTableGrid\"><tbody><tr><td><p style=\"line-height:7pt;text-align:center\"><span style=\"font-size:large\"><strong>MESTRE DO COMBATE</strong></span></p></td></tr></tbody></table><p>A partir do <strong>3º nível de Restringido</strong>, você treinou o uso das armas para poder lutar de forma eficiente com o maior número de armas possíveis. Desde que você tenha proficiência em uma ferramenta amaldiçoada, você dobra os bônus numéricos da aba de características dela e pode escolher receber os seguintes benefícios enquanto estiver a utilizando:</p><p></p><p><span style=\"font-size:large\"><strong>MESTRE DA LÂMINA</strong></span></p><hr><p>Enquanto estiver utilizando armas cortantes, você recebe as seguintes características:</p><ul><li><p><strong>Corte Inevitável:</strong> Suas jogadas de ataque (Comuns e de Técnica) com arma cortante ignoram resistências e imunidades a dano Cortante.</p></li><li><p><strong>Ofensiva Brutal:</strong> Em caso de acerto crítico, você causa 2 dados de dano adicionais e você recebe +3 em suas rolagens de acerto até o fim do seu turno seguinte.</p></li><li><p><strong>Execução Veloz:</strong> Ao executar uma técnica com alcance diferente de “Toque”, você pode mudar seu dano para cortante e aparecer instantaneamente atrás da criatura com o golpe já executado. Se sua rolagem for um 20 natural, você ignora qualquer reação que a criatura tenha utilizado e ela perde a reação.</p></li></ul><p></p><p><span style=\"font-size:large\"><strong>PERITO EM ARMAS ESPECIAIS</strong></span></p><hr><p><span style=\"font-size:10.0pt;font-family:'Chaparral Pro',serif\">Enquanto estiver utilizando uma arma especial corpo-a-corpo, você recebe as seguintes características:</span></p><ul><li><p><strong>Ataque Certeiro: </strong>Ao errar duas jogadas de ataque (Comuns) ou uma técnica, você pode escolher ter acerto automático na sua próxima rolagem de acerto. Esse efeito se repete múltiplas vezes e só acumula enquanto você estiver utilizando uma arma especial.</p></li><li><p><strong>Proficiência Afiada</strong>: Ao executar uma técnica de dano, você causa 2 dados de dano adicionais, mas o dano não pode ultrapassar o máximo de dano que a técnica poderia causar sem esses dados. Esse efeito só funciona se você iniciou seu turno com uma arma especial em mãos.</p></li><li><p><strong>Golpe Veloz</strong>: Toda vez que uma criatura entrar ou sair do seu alcance, você pode realizar uma jogada de ataque (Comum), causando 4d4 + seu modificador principal em dano. Esse efeito funciona mesmo contra características que ignoram reações, não importa qual seja.</p></li></ul><p></p><p><span style=\"font-size:large\"><strong>MESTRE DOS PUNHOS</strong></span></p><hr><p>Enquanto estiver desarmado ou armas marciais, você recebe as seguintes características:</p><ul><li><p><strong>Defesa Impecável:</strong> Enquanto você não possuir nenhuma aliado a até 4,5 metros de distância, você pode escolher aplicar um dos seguintes efeitos nas jogadas de ataque corpo-a-corpo da criatura:</p><ol><li><p class=\"TextoPadro\">A criatura recebe -2 de acerto em todas as rolagens de acerto corpo-a-corpo;</p></li><li><p class=\"TextoPadro\">A criatura recebe desvantagem na primeira rolagem de acerto contra você de cada criatura;</p></li><li><p class=\"TextoPadro\">Toda vez que uma criatura te atacar, você pode devolver 1d8 de dano contra ela.</p></li></ol></li><li><p><strong>Postura Inquebrável:</strong> Toda vez que você receber um ataque corpo-a-corpo ou a distância, você reduz o dano sofrido em um valor igual seu bônus de proficiência.</p></li><li><p><strong>Desviar Golpe:</strong> Ao ser alvo de uma jogada de ataque (Comum ou de Técnica) corpo-a-corpo, você pode usar sua reação para desviar o ataque para outra criatura a até 3 metros dela. Se você desviar uma técnica, você deve consumir uma quantidade de Pontos de Vigor igual a quantidade de Energia Amaldiçoada usada pela técnica.</p></li></ul><p class=\"MsoNormal\">\_</p><p class=\"MsoNormal\">Você só pode se beneficiar de um conjunto de efeitos acima por rodada. Ao usar o conjunto de benefícios no turno, trocar para outro conjunto não concede os benefícios dele.</p><p></p><table border=\"1\" style=\"margin-left:0pt;border-collapse:collapse;border:none\" class=\"MsoTableGrid\"><tbody><tr><td><p style=\"line-height:7pt;text-align:center\"><span style=\"font-size:large\"><strong>AUMENTO NO VALOR DE ATRIBUTO</strong></span></p></td></tr></tbody></table><p>Quando você atinge o <strong>4º nível</strong> e novamente no <strong>8º, 12º, 16º</strong> e <strong>19º nível</strong>, você pode aumentar um valor de atributo, à sua escolha, em 2 ou você pode aumentar dois valores de atributo, à sua escolha, em 1. Como padrão, você não pode elevar um valor de atributo acima de 20 com esta característica.</p><p class=\"MsoBodyText\">A partir do <strong>12º nível</strong>, você pode elevar um valor de atributo até 22 com está característica. A partir do <strong>16º nível,</strong> você pode elevar um valor de atributo até 24 com está característica.</p><p></p><table border=\"1\" style=\"margin-left:0pt;border-collapse:collapse;border:none\" class=\"MsoTableGrid\"><tbody><tr><td><p style=\"line-height:7pt;text-align:center\"><span style=\"font-size:large\"><strong>REFORÇO DE VIGOR</strong></span></p></td></tr></tbody></table><p>A partir do <strong>5º nível de Restringido</strong>, você se torna capaz de liberar quantidades enormes de vitalidade do seu corpo. Você recebe acesso as seguintes características:</p><ul><li><p><em>Até 3 vezes por encontro, você pode escolher gerar Pontos de Vigor adicionais igual seu nível de restringido;</em></p></li><li><p><em>Você dobra seus dados de vida atuais, também dobrando os recebidos futuramente;</em></p></li><li><p><em>Você passa a recuperar 1 Ponto de Vida por segundo fora de combate e um valor igual seu nível de personagem no início de cada um de seus turnos, dentro dele. Essa cura sempre está ativa enquanto você não possuir mais de 4 níveis de exaustão e, ao cair a 0 Pontos de Vida, você estabiliza automaticamente e cura 1 de PV por segundo.</em></p><p class=\"MsoBodyText\"><em>Ao curar o equivalente a metade da sua vida, você levanta novamente, até lá você sofre falha em Salvaguarda de Morte ao sofrer dano de forma padrão.</em></p></li></ul><p class=\"MsoNormal\">\_</p><p class=\"TextoPadro\">A partir do <strong>10º nível de Restringido</strong>, você se torna imune a “Feridas Brutais” e “Ferimentos Persistentes” enquanto seus Pontos de Vida estiverem acima de 1/3 do total. Isso inclui desmembramento.</p><p></p><table border=\"1\" style=\"margin-left:0pt;border-collapse:collapse;border:none\" class=\"MsoTableGrid\"><tbody><tr><td><p style=\"line-height:7pt;text-align:center\"><span style=\"font-size:large\"><strong>ARMA VIVA</strong></span></p></td></tr></tbody></table><p>A partir do <strong>6º nível de Restringido</strong>, você aprendeu a continuar a luta independentemente do seu estado físico, resistindo a dor e mantendo uma ofensiva poderosa de forma constante. Você recebe as seguintes características:</p><ul><li><p><strong>Resistência Superior:</strong> Você recebe 1 Ponto de Redução de dano para todo dano sofrido. No início de cada um de seus turnos, você recebe 1 adicional, até um máximo igual seu nível de personagem.</p></li><li><p><strong>Impacto Inesperado:</strong> Ao usar uma ação bônus, você faz com que sua próxima jogada de ataque (Comum ou de Técnica) empurre uma criatura por 9 metros de distância ao falhar em uma Salvaguarda de Força. Se a criatura colidir com um objeto ou estrutura de 1,5 metros de raio ou maior, ela recebe 3d8 de dano Contundente adicional.</p><p class=\"TextoPadro\">A partir do 10º nível, você pode aplicar esse efeito em uma técnica de dano sem o uso de uma ação bônus, mas apenas uma vez por rodada.</p></li><li><p><strong>Ataque Brutal</strong>: Em uma jogada de ataque (Comum ou de Técnica) que resulte em um crítico, você causa dano adicional igual ao seu nível de personagem (arredondado para baixo).</p><p>A partir do <strong>10º nível</strong>, você recebe 1d6 de dano adicional em todos os seus ataques (Comuns).<span style=\"font-size:8.0pt;font-family:'Chaparral Pro',serif;mso-fareast-font-family:Calibri;mso-fareast-theme-font:minor-latin;mso-bidi-font-family:'Chaparral Pro';color:black\"><em>\_</em></span></p></li></ul><table border=\"1\" style=\"margin-left:0pt;border-collapse:collapse;border:none\" class=\"MsoTableGrid\"><tbody><tr><td><p style=\"line-height:7pt;text-align:center\"><span style=\"font-size:large\"><strong>ATAQUE EXTRA</strong></span></p></td></tr></tbody></table><p>A partir do <strong>7º nível de Restringido</strong>, você pode atacar duas vezes, ao invés de uma, quando usar a ação “Atacar” durante o seu turno. A partir do <strong>12º nível</strong>, você passa a poder atacar três vezes ao usar a ação “Atacar”.</p><p></p><table border=\"1\" style=\"margin-left:0pt;border-collapse:collapse;border:none\" class=\"MsoTableGrid\"><tbody><tr><td><p style=\"line-height:7pt;text-align:center\"><span style=\"font-size:large\"><strong>POTENCIAL AMALDIÇOADO</strong></span></p></td></tr></tbody></table><p>A partir do <strong>9º nível de Restringido</strong>, você pode escolher entre receber 40 Pontos de Treinamento ou 75 Ppntos de Vigor máximos. Você recebe esse benefício novamente no <strong>13º </strong>e<strong> 17º nível</strong>.</p><p></p><table border=\"1\" style=\"margin-left:0pt;border-collapse:collapse;border:none\" class=\"MsoTableGrid\"><tbody><tr><td><p style=\"line-height:7pt;text-align:center\"><span style=\"font-size:large\"><strong>REGENERAÇÃO SUPREMA</strong></span></p></td></tr></tbody></table><p>A partir do <strong>10º nível de Restringido</strong>, seu metabolismo se tornou acelerado a tal nível que você consegue recuperar rapidamente sua estamina, podendo exercer ainda mais poder em combate, assim como se recuperando rapidamente de qualquer ferida.</p><p class=\"TextoPadro\">Você gera naturalmente 3 vezes o seu nível em Pontos de Vigor e, enquanto estiver abaixo da metade dos seus Pontos de Vida, você recupera Pontos de Vida adicionais igual seu nível de personagem.</p><p></p><table border=\"1\" style=\"margin-left:0pt;border-collapse:collapse;border:none\" class=\"MsoTableGrid\"><tbody><tr><td><p style=\"line-height:7pt;text-align:center\"><span style=\"font-size:large\"><strong>EXISTÊNCIA APRIMORADA</strong></span></p></td></tr></tbody></table><p>A partir do <strong>11º nível de Restringido</strong>, você treinou seu corpo a tal nível que sua restrição celestial passou a lhe conceder uma resistência absurda a todas as maldições, assim como energia amaldiçoada e seus efeitos. Você recebe as seguintes características:</p><ul><li><p><em>Você recebe resistência a todos os tipos de dano;</em></p></li><li><p><em>Você recebe vantagem em Salvaguardas contra qualquer efeito/condição causada por Energia Amaldiçoada ou reversa;</em></p></li><li><p><em>No início de cada encontro, você recebe 60 Pontos de Armadura com as regras do “Foco Defensivo” do Capítulo 6;</em></p></li><li><p><em>Toda vez que você sofrer dano crítico, você pode escolher receber 1 nível de exaustão para nega-lo, sofrendo apenas o dano normal do ataque.</em></p></li></ul><p></p><table border=\"1\" style=\"margin-left:0pt;border-collapse:collapse;border:none\" class=\"MsoTableGrid\"><tbody><tr><td><p style=\"line-height:7pt;text-align:center\"><span style=\"font-size:large\"><strong>OFENSIVA ABSOLUTA</strong></span></p></td></tr></tbody></table><p>A partir do <strong>14º nível de Restringido</strong>, você aprendeu a canalizar toda sua força em golpes extremamente poderosos. Você pode colocar quantos Pontos de Vigor tiver disponíveis ao realizar um ataque com sua Queima Agressiva do Constituição Anômala. Além disso, você pode gastar 5 Pontos de Vigor para transformar todo dano causado por você em dano do tipo “Verdadeiro” até o início do seu próximo turno.</p><p class=\"TextoPadro\">Adicionalmente, todas as suas técnicas de dano têm o dano aumentado em 1 passo (d6 &gt; d8 &gt; d10 &gt; d12).</p><p></p><table border=\"1\" style=\"margin-left:0pt;border-collapse:collapse;border:none\" class=\"MsoTableGrid\"><tbody><tr><td><p style=\"line-height:7pt;text-align:center\"><span style=\"font-size:large\"><strong>VELOCIDADE EXTREMA</strong></span></p></td></tr></tbody></table><p><span style=\"mso-bidi-font-size:10.0pt\">A partir do <strong>15º nível de Restringido</strong>,</span><span style=\"mso-bidi-font-size:10.0pt;mso-bidi-font-family:'Times New Roman';mso-bidi-theme-font:minor-bidi\"> você se tornou tão rápido que seus movimentos parecem até miragens, até para criaturas de alto nível. Você recebe as seguintes características:</span></p><ul><li><p><span style=\"mso-bidi-font-size:10.0pt\"><em>Você recebe uma ação bônus adicional, que só pode ser usada em efeitos, técnicas ou habilidades diferentes;</em></span></p></li><li><p><span style=\"mso-bidi-font-size:10.0pt\"><em>Você recebe uma reação adicional, que só pode ser usada em efeitos, técnicas ou habilidades diferentes;</em></span></p></li><li><p><em>Você pode usar seu deslocamento para se mover instantaneamente para qualquer lugar que você tenha deslocamento para alcançar, ignorando qualquer tipo de reação que seria gerada pelo seu movimento. Você desaparece da sua localização atual e aparece no seu destino final.</em></p></li></ul><p class=\"MsoNormal\"><span style=\"font-size:6.0pt;font-family:'Chaparral Pro',serif;mso-font-width:105%\"><em>\_</em></span></p><p class=\"MsoNormal\">As ações recebidas são renovadas no início de cada um de seus turnos.</p><p></p><table border=\"1\" style=\"margin-left:0pt;border-collapse:collapse;border:none\" class=\"MsoTableGrid\"><tbody><tr><td><p style=\"line-height:7pt;text-align:center\"><span style=\"font-size:large\"><strong>EVOLUÇÃO SUPREMA</strong></span></p></td></tr></tbody></table><p>A partir do <strong>18º nível de Restringido</strong>, você pode distribuir livremente 6 pontos entre seus atributos, respeitando o limite máximo de cada um deles.</p><p></p><table border=\"1\" style=\"margin-left:0pt;border-collapse:collapse;border:none\" class=\"MsoTableGrid\"><tbody><tr><td><p style=\"line-height:7pt;text-align:center\"><span style=\"font-size:large\"><strong>REALIZAÇÃO</strong></span></p></td></tr></tbody></table><p>A partir do <strong>19º nível de Restringido</strong>, você supera os limites do que seria possível normalmente até para suas habilidades, atingindo um novo patamar de poder. Você recebe acesso as seguintes características:</p><ul><li><p><em>O dano de seus ataques com arma amaldiçoada se torna 4d8 no lugar do original;</em></p></li><li><p><em>Você recebe uma jogada de ataque (Comum) adicional na característica Ataque Extra;</em></p></li><li><p><em>Você recebe todos os benefícios do Mestre do Combate simultaneamente, independentemente da arma utilizada;</em></p></li><li><p><em>Sua Classe de Resistência se torna 30. Qualquer aumento externo, sem ser HB, pode eleva-la até um máximo de 35;</em></p></li><li><p><em>Sua resistência a dano do Existência Aprimorada passa a englobar dano do tipo “Verdadeiro” independentemente da fonte, e suas resistências não podem ser ignoradas de nenhuma forma.</em></p></li></ul><p></p>"
