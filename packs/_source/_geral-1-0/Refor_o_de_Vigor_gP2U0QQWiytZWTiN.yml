system:
  description:
    value: "<p>A partir do <strong>5º nível de Restringido</strong>, você se torna capaz de liberar quantidades enormes de vitalidade do seu corpo. Você recebe acesso as seguintes características:</p><ul><li><p><em>Até 3 vezes por encontro, você pode escolher gerar Pontos de Vigor adicionais igual seu nível de restringido;</em></p></li><li><p><em>Você dobra seus dados de vida atuais, também dobrando os recebidos futuramente;</em></p></li><li><p><em>Você passa a recuperar 1 Ponto de Vida por segundo fora de combate e um valor igual seu nível de personagem no início de cada um de seus turnos, dentro dele. Essa cura sempre está ativa enquanto você não possuir mais de 4 níveis de exaustão e, ao cair a 0 Pontos de Vida, você estabiliza automaticamente e cura 1 de PV por segundo. </em></p><p class=\"MsoBodyText\"><em>Ao curar o equivalente a metade da sua vida, você levanta novamente, até lá você sofre falha em Salvaguarda de Morte ao sofrer dano de forma padrão.</em></p></li></ul><p class=\"MsoNormal\">\_</p><p class=\"TextoPadro\">A partir do <strong>10º nível de Restringido</strong>, você se torna imune a “Feridas Brutais” e “Ferimentos Persistentes” enquanto seus Pontos de Vida estiverem acima de 1/3 do total. Isso inclui desmembramento.</p>"
