system:
  description:
    value: "<p class=\"MsoNormal\">A partir do <strong>10º nível de Especialista</strong>, você pode juntar dois ou mais shikigamis de mesmo grau que você controla em uma única ficha, formando uma criatura mais poderosa. Você soma os Pontos de Vida e adiciona as seguintes características:</p><ul><li><p><strong>Grau 4:</strong> Adiciona +1 de CR até um máximo de 20 e +1 dado de dano até um máximo de 2d12+5;</p></li><li><p><strong>Grau 3:</strong> Adiciona +1 de CR até um máximo de 23 e +1 dado de dano até um máximo de 3d12+5;</p></li><li><p><strong>Grau 2:</strong> Adiciona +1 de CR até um máximo de 25 e +1 dado de dano até um máximo de 4d12+5;</p></li><li><p><strong>Grau 1:</strong> Adiciona +1 de CR até um máximo de 27 e +1 dado de dano até um máximo de 5d12+5;</p></li><li><p><strong>Grau Especial:</strong> Adiciona +1 de CR até um máximo de 30 e +1 dado de dano até um máximo de 5d12+12.</p></li></ul><p class=\"MsoListParagraph\">\_</p><p class=\"MsoNormal\">Adicionalmente, todas as hordas recebem +1 em Testes de Atributo de Força a cada membro que estiver compondo a horda.</p><p class=\"MsoNormal\">Toda vez que a criatura a horda perder Pontos de Vida equivalente a criatura com o menor Ponto de Vida, aquela criatura é destruída, diminuindo os atributos da horda.</p>"
