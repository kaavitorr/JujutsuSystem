system:
  description:
    value: "<p><strong>Ajuste de Atributo:</strong> +4 Pontos de Atributo para distribuir entre todos os 6 atributos.</p><p><strong>Vida Base:</strong> 10 Pontos de Vida.</p><p><strong>Tamanho:</strong> 1,50 a 2,00 metros (pequeno, médio).</p><p><strong>Peso:</strong> Normalmente, entre 65 kg e 300 kg.</p><p><strong>Deslocamento:</strong> 9 metros.</p><p><strong>Nado:</strong> 4,5 metros.</p><p>\_</p><table border=\"1\" style=\"margin-left:0pt;border-collapse:collapse;border:none\" class=\"MsoTableGrid\"><tbody><tr><td><p style=\"line-height:7pt;text-align:center\"><span style=\"font-size:large\"><strong>CARACTERÍSTICAS DA ESPÉCIA</strong></span></p></td></tr></tbody></table><p>Essas características acompanham a existência do personagem, são representações da sua origem, sendo uma parte essencial de como ele vê o mundo e de como o mundo olha pra ele.</p><p></p><p><span style=\"font-size:large\"><strong>BENEFÍCIOS DA ORIGEM</strong></span></p><hr><p><strong style=\"mso-bidi-font-weight:normal\">Feitiço Único: </strong><span style=\"mso-bidi-font-weight:bold\">Você nasceu com um feitiço que foi despertado muito cedo, permitindo que você pudesse se familiarizar com ele, você recebe as seguintes características:</span></p><ul><li><p><em>Você recebe 3 Pontos de Maldição que devem ser usados para completar instantaneamente um Treinamento de Energia Amaldiçoada do Capítulo 6.5 na criação do personagem.</em></p></li><li><p><em>Você recebe a habilidade de manipulação “Despertar Habilidade” do Capítulo 6.3;</em></p></li><li><p><em>Uma vez por descanso curto ou longo, você pode reduzir o custo final do seu Feitiço Inato pela metade (arredondado para baixo)</em></p></li></ul><p class=\"TextoPadro\"><strong>Evolução Rápida:</strong> Você recebe 2 Pontos de Maldição adicionais toda vez que subir de nível. Além disso, a cada 25 Pontos de Treinamento Investidos, você recebe 20 Pontos de Energia Amaldiçoada (PA) adicionais.</p><p style=\"tab-stops:467.8pt\" class=\"TextoPadro\"><strong style=\"mso-bidi-font-weight:normal\">Talento de Origem: </strong>No <strong style=\"mso-bidi-font-weight:normal\">3º nível</strong>, você recebe um talento de origem de acordo com o <strong style=\"mso-bidi-font-weight:normal\">Capítulo 6</strong>.</p>"
