system:
  description:
    value: >-
      <p><strong>Aura de Medo (Aumenta em 25% o PV efetivo de criaturas com ND
      11 ou menor):</strong> Qualquer alvo hostil à criatura que comece seu
      turno a até 6 metros dela, deve realizar um Teste de Resistência de
      Espírito, a não ser que a criatura esteja incapacitada. Se falhar na
      resistência, o alvo receberá a condição “Amedrontado” até o início do
      próximo turno dele. Se alvo for bem sucedido, ele fica imune a Aura de
      Medo da criatura pelas próximas 24 horas.</p>
