system:
  description:
    value: >-
      <p class="MsoNormal">Ao término do cálculo de dano de uma ou mais
      criaturas, por uma jogada de ataque, feitiço ou técnica sua, caso o valor
      dos Pontos de Vida restantes seja igual ou menor que o seu nível, a
      criatura recebe o dano necessário para ter seus PVs reduzidos a 0.</p><p
      class="MsoNormal">Sempre que uma criatura for derrotada por essa
      característica, aumenta em +5 na contagem do seu nível para reduzir os
      Pontos de Vida a 0 (até um máximo de +20), que dura até o final do
      encontro.</p>
