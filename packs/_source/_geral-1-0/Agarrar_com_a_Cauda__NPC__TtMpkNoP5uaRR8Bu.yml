system:
  description:
    value: >-
      <p><strong>Agarrar com a Cauda (Aumenta o bônus de ataque efetivo da
      criatura em 1):</strong> A criatura pode usar uma ação bônus para usar sua
      cauda e tentar agarrar um alvo com uma jogada de ataque corpo-a-corpo
      desarmado. Caso acerte, ao invés de causar dano, o alvo fica agarrado.
      Enquanto o alvo estiver agarrado, você tem vantagem nas suas jogadas de
      ataque corpo-a-corpo contra ele, não podendo usar esta característica em
      mais de um alvo ao mesmo tempo.</p>
