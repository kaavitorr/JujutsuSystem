name: Entrada Impactante
type: feat
img: icons/skills/movement/ball-spinning-blue.webp
system:
  description:
    value: >-
      <p class="MsoNormal">A partir do <strong>10º nível de Lutador,</strong> ao
      iniciar um combate, você se torna o primeiro na ordem de iniciativa e pode
      avançar contra uma criatura a até o dobro do seu deslocamento, podendo
      usar disparada para deslocamento adicional, desferindo um ataque (Comum ou
      de Técnica) com sua Ferramenta Amaldiçoada.</p><p class="MsoNormal">Se a
      criatura for atingida, ela passa a ocupar a última posição na ordem de
      iniciativa. Caso o ataque seja um acerto crítico, ela recebe a condição
      “Atordoado”, sem a necessidade de realizar uma Salvaguarda.</p><p
      class="MsoNormal">Esse efeito também se aplica caso você entre no combate
      de forma tardia.</p>
