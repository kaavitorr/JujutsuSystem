    value: >-
      <p class="TextoPadro">A partir do <strong>6º nível de Lutador,</strong> no
      seu turno, você pode fazer uma ação adicional ou ação poderosa adicional
      (Para Feitiços ou Técnicas de até 10 PA de custo final, sem contar
      “Explosão Ofensiva”.). Essa característica não poderá ser usada novamente
      até o término de um descanso curto ou longo.</p><p class="TextoPadro">No
      <strong>10º nível de Lutador,</strong> você pode usar até 2 vezes, mas
      apenas 1 vez por rodada; no 15º nível de Lutador, você pode usar até 3
      vezes, mas apenas 1 vez por rodada, recuperando todos os seus usos ao
      término de um descanso longo.</p>
