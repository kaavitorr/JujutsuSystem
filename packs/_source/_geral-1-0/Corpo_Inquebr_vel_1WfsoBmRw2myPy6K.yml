system:
  description:
    value: >-
      <p class="MsoBodyText">Você possui um corpo poderoso e você é capaz de
      utiliza-lo em seu máximo potencial. Você recebe acesso as seguintes
      características:</p><ul><li><p><strong>Vitalidade Exuberante:</strong> Seu
      dado de vida aumenta em um passo (d8 para d10 e d10 para d12). Caso sua
      vida já se encontre no d12, você recebe 2 Pontos de Vida por nível no
      lugar.</p></li><li><p><strong>Duro de Matar:</strong> Uma vez pode
      descanso longo, ao cair a 0 Pontos de Vida, você remove qualquer efeito
      negativo ou condição (sem ser maldições) que estejam afetando seu corpo,
      estabiliza automaticamente e fica imune a dano até o início do seu próximo
      turno. Essa imunidade a dano é cancelada caso seus Pontos de Vida sejam
      curados ou você possa continuar lutando de alguma forma mesmo com 0 de
      PV.</p></li></ul>
