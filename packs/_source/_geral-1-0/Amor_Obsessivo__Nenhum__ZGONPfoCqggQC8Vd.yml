system:
  description:
    value: "<p>Como um membro dos Zoldyck, você possui um membro da sua família que tem uma forte obsessão por você, derivada de um amor doentio. Ele deseja que você sempre fique sozinho no mundo com exceção da sua família e se torne um exemplo dentro dela.</p><p>\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_ Esse membro pode interferir de forma negativa com o seu grupo de tempos em tempos, causando o caos na tentativa de que você seja expulso do grupo e volte para a família, mas ele nunca irá matar alguém com as próprias mãos, pois o efeito pode ser contrário as expectativas.</p>"
