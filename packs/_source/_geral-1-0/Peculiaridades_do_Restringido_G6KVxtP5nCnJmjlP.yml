system:
  description:
    value: >-
      <p class="MsoNormal"><span style="font-size:large"><strong>PECULIARIDADES
      DO RESTRINGIDO</strong></span></p><p class="MsoNormal">Como uma criatura
      sem nenhuma energia amaldiçoada, você tem algumas características inatas
      da sua natureza. Você recebe acesso as seguintes características
      inatamente:</p><ul><li><p><em>Você é imune a habilidade de “Sentir
      Maldição” da manipulação de Energia
      Amaldiçoada;</em></p></li><li><p><em>Você pode passar livremente entre
      domínios e barreiras. Seja entrando, saindo ou se movendo dentro
      dele;</em></p></li><li><p><em>Você é naturalmente imune aos efeitos de
      acerto automático dos domínios;</em></p></li><li><p><em>Você possui
      “Vigor” no lugar de energia amaldiçoada e utiliza a mesma regra para
      geração da mesma;</em></p></li><li><p><em>Você pode treinar seu “Vigor”
      pelas regras de Treinamento Intenso do “Capítulo 6”.</em></p></li></ul>
