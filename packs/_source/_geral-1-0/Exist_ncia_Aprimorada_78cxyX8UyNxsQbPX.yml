system:
  description:
    value: >-
      <p>A partir do <strong>11º nível de Restringido</strong>, você treinou seu
      corpo a tal nível que sua restrição celestial passou a lhe conceder uma
      resistência absurda a todas as maldições, assim como energia amaldiçoada e
      seus efeitos. Você recebe as seguintes
      características:</p><ul><li><p><em>Você recebe resistência a todos os
      tipos de dano;</em></p></li><li><p><em>Você recebe vantagem em
      Salvaguardas contra qualquer efeito/condição causada por Energia
      Amaldiçoada ou reversa;</em></p></li><li><p><em>No início de cada
      encontro, você recebe 60 Pontos de Armadura com as regras do “Foco
      Defensivo” do Capítulo 6;</em></p></li><li><p><em>Toda vez que você sofrer
      dano crítico, você pode escolher receber 1 nível de exaustão para nega-lo,
      sofrendo apenas o dano normal do ataque.</em></p></li></ul>
