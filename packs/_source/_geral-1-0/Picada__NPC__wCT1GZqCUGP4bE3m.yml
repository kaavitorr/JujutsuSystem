system:
  description:
    value: >-
      <p>Ataque Corpo-a-Corpo com Arma: +2 para atingir, alcance 1,5 metros, uma
      criatura. Acerto: 2 (1d4) de dano de veneno e o alvo deve ser bem sucedido
      em um teste de resistência de Constituição CD 13 ou ficará envenenado por
      1 minuto. Até a duração do veneno acabar, o alvo receberá 1d4 no final de
      cada um de seus turnos. O alvo pode repetir o teste de resistência no
      final de cada um dos turnos dele, terminando o envenenamento sobre si com
      um sucesso.</p>
