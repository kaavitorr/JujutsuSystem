name: Poço de Energia Reversa
type: feat
img: icons/magic/life/heart-area-circle-red-green.webp
system:
  description:
    value: >-
      <p class="TextoPadro">A partir do <strong>6º nível de
      Especialista</strong>, você aprende a guardar uma grande quantidade de
      energia reversa em seu corpo que pode ser utilizado para curar uma
      criatura. Ao fim de cada descanso longo, você recebe um valor igual a 20
      vezes o seu nível de personagem. A qualquer momento, você pode tocar uma
      criatura e curar qualquer valor de vida dela até o limite que você possui
      de cura disponível.</p><p class="MsoNormal">Ao realizar um descanso curto,
      você pode rolar dados de energia amaldiçoada e recuperar seu poço de
      energia reversa no lugar da sua energia amaldiçoada, podendo dividir os
      dados da forma como desejar.</p>
