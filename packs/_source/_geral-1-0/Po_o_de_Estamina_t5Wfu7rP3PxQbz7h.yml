system:
  description:
    value: "<p>Você tem uma recuperação natural bem forte, algo que acompanha você por toda sua vida. Ao utilizar uma ação, você pode recuperar 3 níveis de exaustão e receber imunidade aos efeitos de níveis de exaustão até 5º nível durante 30 minutos. Essa característica pode ser utilizada uma vez, recuperando seu uso ao fim de um descanso longo.</p><p>\_\_\_\_\_\_\_\_\_\_\_\_ Além disso, toda vez que você realizar um descanso e recuperar níveis de exaustão como consequência, você recupera 1 nível adicional.</p>"
