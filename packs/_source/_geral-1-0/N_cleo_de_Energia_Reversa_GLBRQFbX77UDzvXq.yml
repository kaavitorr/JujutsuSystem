system:
  description:
    value: >-
      <p class="MsoBodyText">A partir do <strong>19º nível de
      Estrategista</strong>, você se torna capaz de manter uma enorme reserva de
      energia reversa dentro de seu corpo para utilizar quando necessário. No
      fim de cada descanso longo, você recebe uma quantidade de Pontos de
      Energia Reversa (PR) igual metade da sua Energia Amaldiçoada, que deve ser
      utilizada apenas para utilizar efeitos e técnicas que utilizem energia
      reversa sem consumir sua energia amaldiçoada padrão. Essa energia reversa
      é gerada na mesma proporção que sua energia amaldiçoada.</p>
