    value: >-
      <p class="Default">São aqueles que dominaram o básico e sabem utilizar
      algumas habilidades avançadas de Energia Amaldiçoada com certo nível de
      proficiência, aumentando o ND efetivo do PdN em 2. Eles recebem as
      seguintes características:</p><ul><li><p>Aumenta a Classe de Dificuldade
      em +1;</p></li><li><p> Detecta energia amaldiçoada em um raio de 9 metros,
      tendo +3 em percepção para encontrar essas criaturas em
      furtividade;</p></li><li><p>Recebe 30 Pontos de Armadura e resistência a
      todos os tipos de dano enquanto eles não acabarem;</p></li><li><p>Recebe
      1d4 de dano extra em todas as jogadas de ataque que
      realizar.</p></li></ul>
