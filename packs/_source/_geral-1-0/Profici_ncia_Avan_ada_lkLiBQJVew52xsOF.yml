system:
  description:
    value: >-
      <p>Você possui uma grande maestria utilizando uma arma específica, dessa
      forma você recebe as seguintes características:</p><p><strong>Arma
      Favorita:</strong> A cada vez que você subir de nível, você pode escolher
      uma arma que você é proficiente e transformar em sua arma favorita. Dessa
      forma você pode utilizar seu modificador de principal para acerto e dano.
      ]</p><p><strong>Defesa Ofensiva:</strong> Você pode substituir o
      modificador de Agilidade pelo modificador de atributo principal, escolhido
      na sua categoria. Desde que não esteja se beneficiando de outra Habilidade
      Básica defensiva (como Defesa Avançada). Você recebe as seguintes
      características:</p><ul><li><p><strong>Em Guarda:</strong> Acrescente a CR
      metade da sua proficiência, arredondada para
      baixo.</p></li><li><p><strong>Aparar:</strong> Ao ser alvo de uma jogada
      de ataque (Comum ou de Técnica), você pode usar sua reação e acrescentar
      toda sua proficiência, ao invés da metade, para tentar se defender da
      jogada de ataque. Para tanto, você deve poder ver o
      atacante.</p></li><li><p><strong>Guarda Aprimorada:</strong> Ao chegar no
      5º nível de personagem, é adicionado um bônus na CR de + 1. No 10º nível
      de personagem o bônus se torna +3 e novamente +5 a partir do 20º
      nível.</p></li><li><p><strong>Aparar Aprimorado:</strong> Ao chegar no 7º
      nível de personagem, você pode escolher se beneficiar da característica
      “Aparar” sem usar uma reação, mas apenas uma vez por rodada. Você pode
      utilizar essa característica dessa forma por até 3 vezes, recuperando
      todos os usos após realizar um descanso curto ou longo.</p></li></ul>
