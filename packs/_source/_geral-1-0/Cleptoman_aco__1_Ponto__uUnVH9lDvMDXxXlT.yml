    value: "<p>Você rouba coisas de que não precisa, não por seu valor, apenas por serem interessantes. Sempre que surgir a chance de roubar algo, você irá roubar. Um cleptomaníaco nunca devolve para os donos o produto de seus roubos, e lutará para evitar que isso aconteça.</p><p>\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_ Se ignorar sua vontade de roubar, você recebe -1 em todas as suas jogadas até que roube o objeto cobiçado (não acumulativo).</p>"
