system:
  description:
    value: >-
      <p>Seu espírito queima com uma obstinação sem igual, permitindo que você
      se recuse a continuar caído. Quando você receber dano suficiente para
      ficar com 0 Pontos de Vida e não morrer, você levanta com 1 Ponto de Vida
      / Vitalidade no final daquele turno e recebe 2d10 + Seu modificador de
      Constituição em Pontos de Vida temporários ou 2 Pontos de Vitalidade (PVE)
      temporários que duram por 1 minuto. Essa característica pode ser utilizada
      uma vez, recuperando seu uso após realizar um descanso longo.</p><p>A
      partir do <strong>9º nível</strong>, os Pontos de Vida temporários mudam
      para 5d10 e para 8d10 no <strong>15º nível</strong>.</p>
