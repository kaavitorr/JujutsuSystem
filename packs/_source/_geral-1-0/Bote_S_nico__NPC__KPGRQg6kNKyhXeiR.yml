system:
  description:
    value: >-
      <p><strong>Bote Sônico (Aumenta o dano efetivo da criatura na primeira
      rodada): </strong>Se a criatura puder percorrer 6 metros ou mais, em uma
      linha reta livre de obstáculos, em direção a um alvo, ela pode se lançar
      em alta velocidade contra o alvo e atingi-lo com uma jogada de ataque
      corpo-a-corpo, adicionando dano extra em seu ataque. O alvo deve ser bem
      sucedido em um Teste de Resistência de Força para não cair no chão. O
      movimento percorrido durante está habilidade não provoca ataque de
      oportunidade.</p>
