system:
  description:
    value: >-
      <p class="MsoNormal">A partir do <strong>10º nível de
      Especialista</strong>, ao usar uma ação de poder, você pode se vincular a
      até 3 criaturas diferentes a até 9 metros de distância e ativar sua
      habilidade “Regeneração Constante”, curando essas criaturas em vez de si
      mesmo. Nesse caso, o limite total de cura passa a ser igual a 30 vezes o
      seu nível, em vez das 9 vezes padrão.</p><p class="MsoNormal">A cura deve
      ser dividida entre os alvos. Se você escolher 3 criaturas, cada uma recebe
      uma quantidade de cura igual ao seu nível de personagem. Se escolher 2
      criaturas, uma delas recebe o dobro do seu nível, e a outra, uma vez o seu
      nível. Caso escolha apenas 1 criatura, ela recebe o triplo do seu
      nível.</p><p class="MsoNormal">Você pode escolher a si mesmo como um dos
      alvos da cura.</p>
