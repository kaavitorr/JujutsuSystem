system:
  description:
    value: "<p>Enquanto uma criatura estiver dentro do seu domínio simples, você pode desaparecer momentaneamente aparecendo agachado na frente da criatura enquanto levanta desferindo um corte extremamente veloz de baixo para cima que carrega tamanho poder que atira a criatura para o alto, sendo arremessada a 30 metros de altura.</p><p>\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_ Caso você acerte a criatura novamente com um ataque qualquer antes dela atingir o chão, você causa 1 dado de dano adicional nesse ataque.</p><hr><p>\_<strong>Duração:</strong>\_Instantâneo</p><p><strong>Alcance:</strong>\_Toque</p><p><strong>Requisito:</strong> Domínio Simples, Ação de Poder</p><p><strong>Dano:</strong> 6d10 de dano Cortante</p><p><strong>Custo:</strong> 8 PA</p>"
