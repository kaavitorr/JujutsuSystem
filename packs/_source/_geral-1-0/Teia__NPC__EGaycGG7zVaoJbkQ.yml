system:
  description:
    value: >-
      <p><strong>Teia (Aumenta a CR efetiva da criatura em 1): </strong>Ataque à
      Distância com Arma (distância 9/18 metros) contra um alvo Grande ou menor.
      Caso acerte, o alvo recebe a condição “Impedido” pela teia. Com uma ação,
      o alvo impedido pode realizar um Teste de Habilidade de Força, escapando
      da teia se for bem sucedido. O efeito termina se a teia for destruída. A
      teia tem CR 10, 5 pontos de vida, resistência a dano de Concussão e
      imunidade a dano Psíquico e de Veneno. Se o resultado for 5 ou 6, a
      criatura recupera o uso desta característica. Essa característica também
      se recarrega quando a criatura termina um descanso curto ou longo.</p>
