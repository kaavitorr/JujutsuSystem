system:
  description:
    value: >-
      <p class="MsoNormal">Você pode escolher 3 perícias dentre: Acrobacia,
      Atletismo, Atuação, Ciência, Enganação, Furtividade, História,
      Intimidação, Intuição, Investigação, Percepção, Persuasão, Pilotagem,
      Prestidigitação, Provocação, Sobrevivência e Tecnologia, para receber o
      talento referente a essas perícias, ganhando a proficiência normal
      nelas.</p><p class="MsoNormal">Você também consegue contornar mesmo os
      piores cenários com sua sagacidade e pensamento rápido. Ao falhar em um
      Teste de Atributo por menos de 5, você pode alterar o resultado para um
      sucesso.</p><p class="MsoNormal">Essa característica pode ser usada até 3
      vezes e você recupera todos os seus usos ao término de um descanso
      longo.</p>
