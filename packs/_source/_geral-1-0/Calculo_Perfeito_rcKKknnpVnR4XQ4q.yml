    value: >-
      <p class="TextoPadro">A partir do <strong>6º nível de
      Especialista</strong>, você pode rolar 5 vezes seu d20 no fim de cada
      descanso longo que se passe de um dia para o outro. A qualquer momento
      após isso, quando você ou uma criatura qualquer realizar uma rolagem no
      d20, você pode substituir a rolagem do dado dela por uma das que você tem
      disponíveis. Após usar aquela rolagem, ela é consumida e não pode ser
      utilizada novamente.</p><p class="MsoNormal">Cada criatura inimiga só pode
      ter duas rolagens substituídas em um mesmo encontro</p>
