system:
  description:
    value: >-
      <p style="text-align:justify">A partir do <strong>19º nível de
      lutador</strong>, você transcende os limites de meros combatentes e atinge
      um patamar que será passado adiante em lendas. Como resultado, você recebe
      as seguintes características:</p><ul><li><p
      style="text-align:justify"><strong>Golpe Potencializado:</strong> Suas
      jogadas de ataque (Comuns) com margem 15-19 que não forem consideradas um
      acerto crítico, causam o resultado máximo possível da rolagem dos
      dados;</p></li><li><p style="text-align:justify"><strong>Ataque
      Destruidor:</strong> Atingir uma criatura com ND 10 ou menor reduz os
      Pontos de Vida dela a 0;</p></li><li><p
      style="text-align:justify"><strong>Ataque Certeiro:</strong> Você acerta
      automaticamente suas rolagens de ataque (Comuns e de Técnica) e rola
      apenas para definir um acerto crítico e o efeito do “Golpe
      Potencializado”.</p></li></ul>
