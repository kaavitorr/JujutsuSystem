      furtividade;</p></li><li><p>Recebe 40 Pontos de Armadura e resistência a
      todos os tipos de dano enquanto eles não acabarem;</p></li><li><p>Recebe
      2d4 de dano extra em todas as jogadas de ataque que
      realizar.</p></li></ul>
