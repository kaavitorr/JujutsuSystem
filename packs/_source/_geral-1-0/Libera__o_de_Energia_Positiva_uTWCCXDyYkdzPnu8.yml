system:
  description:
    value: >-
      <p class="TextoPadro">A partir do <strong>15º nível de
      Estrategista</strong>, você pode escolher uma criatura a até 30 metros de
      distância (sem ser você) e usar uma ação bônus para suprir o corpo dela
      com energia de forma constante, ajudando-o a manter o pico do poder.
      Enquanto essa criatura se mantiver dentro do alcance, ela pode adicionar o
      seu modificador de Sabedoria em todas as Salvaguardas que ela
      realizar.</p><p class="TextoPadro">Esse efeito se encerra caso a criatura
      saia do seu alcance.</p>
