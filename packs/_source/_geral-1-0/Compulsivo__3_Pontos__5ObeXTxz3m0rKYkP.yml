system:
  description:
    value: "<p>Existe algo que você precisa fazer constantemente e que lhe traz alguma gratificação emocional, normalmente um alívio de ansiedade e/ou angústia. São hábitos mal adaptativos que já foram executados inúmeras vezes e acontecem quase automaticamente. É comum que haja um \"gatilho\" ou situações que tragam sua compulsão à tona.</p><p>\_\_\_\_\_\_\_\_\_\_\_\_\_\_ Se ignorar uma vez sua compulsão, você não consegue usar ações bônus até que a faça novamente. Você recebe -2 em Testes de Atributo de Sabedoria (Investigação).</p>"
