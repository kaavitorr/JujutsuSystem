  description:
    value: >-
      <p><strong>Casco Protetor (Aumenta a CR efetiva da criatura em 2):
      </strong>Ao receber uma jogada de ataque, a criatura pode usar sua reação
      para entrar totalmente no casco e receber +5 na CR normal. Enquanto dentro
      do casco, a criatura recebe a condição “Incapacitado” e com deslocamento
      reduzido a 0. A criatura só pode usar uma ação para sair do casco.</p>
