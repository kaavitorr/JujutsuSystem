system:
  description:
    value: >-
      <p>Você cresceu em um ambiente onde matar não era diferente de uma ação
      mundana, como fazer compras ou realizar tarefas domésticas. Para você, a
      morte é algo comum e leviana e você não se importa de tirar a vida de
      alguém e nem entende a ideologia ou a mente das pessoas que preferem
      preservar a vida.</p><p>Você falha automaticamente em Testes para saber
      como as criaturas estão se sentindo e quando não fizer diferença para
      você, como essa criatura não possuir nada que você precise, você sempre
      irá tirar a vida dela.</p>
