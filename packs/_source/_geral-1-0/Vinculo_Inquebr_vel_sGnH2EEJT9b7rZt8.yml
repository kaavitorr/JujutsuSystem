system:
  description:
    value: >-
      <p class="TextoPadro">A partir do 14º nível de Especialista, você é ligado
      a todas as criaturas que você controla pela sua energia amaldiçoada,
      permitindo que você possa controlar melhor o combate que as envolva. Você
      recebe as seguintes características:</p><p>Até 3 vezes por descanso longo,
      quando você sofrer qualquer quantia de dano, você pode transferi-la para
      uma das criaturas que você controla a até 12 metros. Caso o dano exceda os
      pontos de vida da criatura, você recebe o excedente. Esse efeito não pode
      ser negado de nenhuma forma.</p><p>Quando você for perder o controle de
      uma ou mais criaturas que você controla ou elas forem destruídas
      simultaneamente, você pode negar a destruição dela e recuperar metade dos
      Pontos de Vida dela. Essa característica pode ser utilizada uma vez por
      descanso longo.</p>
