    value: >-
      <p class="MsoNormal">Você emana uma presença intimidadora, que não tem
      nada a ver com sua aparência física, seja por já ter matado incontáveis
      pessoas ou talvez por possuir uma grande fúria contida dentro de si.</p><p
      class="MsoBodyText"><strong>Característica:</strong> Sempre que uma
      criatura hostil faça qualquer ação contra você, como uma jogada de ataque
      ou tentar te enganar, ela deve fazer uma Salvaguarda de Presença CD 15, se
      falhar, ela recebe desvantagem na primeira jogada de dados. Essa
      característica funciona uma vez contra cada criatura dentro de um
      encontro.</p>
