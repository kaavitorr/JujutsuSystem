      Constituição (arredondado para baixo).</p><p>Alternativamente, você pode
      escolher o Modificador de Constituição como primário e usar metade do
      modificador principal, tornando-os como atributo secundários.</p><p>Usando
      esta característica, ao considerar o bônus de CR do seu Atributo de
      Constituição, só é possível adicionar à sua CR um valor igual à metade do
      seu nível, arredondado para baixo.</p><p>Por exemplo, no 7º nível,
      independentemente do valor do modificador de Constituição, o bônus máximo
