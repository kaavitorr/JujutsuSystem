name: Brutalidade Desenfreada
type: feat
img: icons/magic/control/debuff-chains-red.webp
system:
  description:
    value: >-
      <p class="MsoNormal">A partir do 2º nível de Lutador, você utiliza seu
      controle de energia amaldiçoada para aumentar a velocidade e força de seus
      golpes de forma precisa, aumentando sua capacidade geral de combate. Você
      recebe acesso as seguintes
      características:</p><ul><li><p><strong>Reativo</strong>: Quando você
      sofrer qualquer quantidade de dano de uma criatura dentro do seu alcance,
      você pode realizar um contra-ataque contra o alvo com uma jogada de ataque
      (Comum), causando 2d4 de dano físico a ele no fim do turno da criatura
      para cada rolagem de dano individual que ela causou contra você.</p><p
      class="TextoPadro">A partir do 10º nível, você passa a causar 4d4 de dano
      no lugar de 2d4.</p></li><li><p><strong>Golpe Devastador:</strong> Sempre
      que você causar um acerto crítico em uma criatura inimiga, você causa dano
      adicional igual seu nível de personagem e a criatura deve realizar uma
      Salvaguarda de Constituição para não perder uma ação bônus e um ataque da
      característica “Ataque Extra”, se ela tiver mais de um
      ataque.</p></li><li><p><strong>Ataque Veloz:</strong> Quando você realizar
      uma jogada de ataque (Comum ou de Técnica), você pode usar uma ação bônus
      para realizar uma jogada de ataque (Comum) adicional.</p><p
      class="TextoPadro">Enquanto dentro da sua expansão de domínio, você não
      precisa utilizar uma ação bônus para esse efeito, mas apenas pode realizar
      um ataque dessa forma por rodada.</p></li></ul>
