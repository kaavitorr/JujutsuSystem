system:
  description:
    value: >-
      <p class="MsoNormal">Você gosta de ter uma contingência para cada plano —
      até mesmo quando sai para tomar um sorvete, já possui uma alternativa caso
      a sorveteria esteja fechada.</p><p class="MsoNormal">No início de cada
      dia, você pode gastar 1 hora preparando planos (A, B, C ou até D) para
      diferentes situações. Ao fazer isso, role 3d20 e anote os
      resultados.</p><p class="MsoNormal">Sempre que realizar uma rolagem de
      d20, você pode optar por manter o resultado obtido ou substituí-lo por um
      dos valores anotados. Cada resultado só pode ser utilizado uma vez e é
      consumido após o uso.</p><p class="MsoNormal">Você não pode utilizar esses
      dados nas seguintes condições:</p><ul><li><p>Se for surpreendido no início
      de um combate; </p></li><li><p>Se estiver indo para um local sobre o qual
      não possui nenhuma informação; </p></li><li><p>Se não tiver gasto 1 hora
      no início do dia para preparar seus planos. </p></li></ul><p></p><p
      class="MsoNormal">Fora dessas situações, considera-se que você sempre tem
      um plano.</p>
