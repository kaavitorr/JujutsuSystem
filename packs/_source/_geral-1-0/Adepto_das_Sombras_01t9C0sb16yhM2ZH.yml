folder: QwYh3uEF10z8gSGn
name: Adepto das Sombras
type: feat
img: icons/magic/unholy/silhouette-robe-evil-glow.webp
system:
  description:
    value: >-
      <p>A partir do <strong>3º nível de Sentinela</strong>, você dominou o
      estilo das sombras até um nível de maestria que te coloca entre membros
      habilidades até mesmo na época de ouro do Jujutsu, permitindo que você
      possa exterminar maldições e usuários de maldições com eficiência. Você
      recebe as seguintes características enquanto estiver empunhando uma katana
      ou similar:</p><ul><li><p><strong>Lâmina Imbatível:</strong> Uma vez por
      turno, ao realizar um acerto crítico com katana ou similar, você pode
      realizar uma jogada de ataque (Comum)
      adicional.</p></li><li><p><strong>Fio Imbatível:</strong> Suas jogadas de
      ataque (Comuns) com uma katana ou similar causam dano cortante extra igual
      a metade do seu nível de Sentinela, arredondado para acima (máximo de
      8).</p></li><li><p><strong>Lâmina Traiçoeira:</strong> Uma vez por turno,
      ao acertar uma jogada de ataque (Comum ou de Técnica), você pode escolher
      ignorar qualquer resistência ou invulnerabilidade a dano Cortante que a
      criatura possua.</p></li><li><p><strong>Grande Maestria:</strong>
      Independentemente da sua katana, você sempre possui d10 de dano ao
      utiliza-la (prevalece o maior). A partir do 6º nível de Sentinela, seu
      dano se torna d12.</p></li></ul><p class="MsoNormal"></p><p
      class="MsoNormal">A partir do 6º nível de Sentinela, toda vez que você
      tiver com seu domínio simples expandido, você reduz todo dano sofrido em
      uma quantidade de dano igual seu bônus de proficiência.</p><p
      class="MsoNormal">Adicionalmente, você pode utilizar a técnica “Hazy Moon”
      dentro ou fora do seu turno sem consumir ações.</p>
