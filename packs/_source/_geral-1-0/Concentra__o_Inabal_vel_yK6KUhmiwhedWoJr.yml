system:
  description:
    value: >-
      <p class="MsoNormal">Você aumenta sua capacidade mental, fazendo com que
      você receba as seguintes características:</p><ul><li><p><em>Sua primeira
      Salvaguarda para manter a concentração tem sucesso
      automático;</em></p></li><li><p><em>Sua segunda Salvaguarda para manter a
      concentração recebe +5;</em></p></li><li><p><em>Você pode manter duas
      técnicas ou habilidades menores de concentração ao mesmo
      tempo;</em></p></li><li><p><em>A partir do 6º nível de personagem, você
      sempre terá vantagem para manter sua
      concentração;</em></p></li><li><p><em>A partir do 12º nível de personagem,
      a CD da Salvaguarda para manter a concentração não poderá passar de
      30.</em></p></li></ul>
