system:
  description:
    value: >-
      <p class="Default">São aqueles que dominaram o básico e parte do avançado
      da Energia Amaldiçoada com grande nível de proficiência, aumentando o ND
      efetivo do PdN em 5. Eles recebem as seguintes
      características:</p><ul><li><p><em>Recebe 60 Pontos de
      Vida;</em></p></li><li><p><em>Aumenta a Classe de Dificuldade em
      +4;</em></p></li><li><p><em>Sua Classe de Resistência aumenta em
      +3;</em></p></li><li><p><em>Recebe resistência a todos os tipos de
      dano;</em></p></li><li><p><em>Você recebe +3 de acerto em suas jogadas de
      ataque (comuns e de Técnica);</em></p></li><li><p><em>Recebe 3d4 de dano
      extra em todas as jogadas de ataque que realizar;Detecta energia
      amaldiçoada em um raio de 30 metros, tendo +6 em percepção para encontrar
      essas criaturas em furtividade</em></p></li></ul>
