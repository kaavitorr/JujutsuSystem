system:
  description:
    value: >-
      <p class="MsoNormal">Você está sempre preparado para recorrer às suas
      habilidades quando necessário, mas forçar esse preparo tem um preço.</p><p
      class="MsoNormal">No início de um encontro, antes da rolagem de
      iniciativa, você pode utilizar suas ações para ativar qualquer quantidade
      de habilidades ou feitiços que não realizem jogada de ataque e nem deem
      alvos em criaturas inimigas. Após fazê-lo, role a iniciativa normalmente.
      Porém, você se torna o último da iniciativa e começa seu turno sem as
      ações usadas para ativar as habilidades.</p>
