name: Especialista em Reversão
type: feat
img: icons/skills/melee/spear-tips-quintuple-orange.webp
system:
  description:
    value: >-
      <p class="TextoPadro">A partir do <strong>14º nível de
      Estrategista</strong>, você aprendeu a controlar energia reversa com tanta
      maestria que você pode facilmente utilizar reversão de feitiço. Você
      recebe as seguintes características:</p><ul><li><p><em>Seu dado de
      <strong>“Energia Reversa”</strong> aumenta em 1 passo, indo de d4 para
      d6;</em></p></li><li><p><em>Sua <strong>“Regeneração Constante”</strong>
      passa a ter limite de 15 vezes o nível e você cura 3 vezes o nível por
      vez, resetando a cada vez que você ativar o Fulgor Negro com
      sucesso;</em></p></li><li><p><em>Você recebe 3 vezes o “Reversão de
      Feitiço” sem consumir Pontos de Maldição, mas ele só pode ser utilizado
      para aumentar o dano ou reduzir um custo de um feitiço já existente e
      transforma-lo em energia positiva sem alterar sua natureza, igual a forma
      alternativa da reversão de feitiço.</em></p></li></ul>
