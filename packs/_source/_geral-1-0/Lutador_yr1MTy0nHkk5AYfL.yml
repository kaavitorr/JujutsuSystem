system:
  description:
    value: "<p style=\"text-align:center\"><span style=\"font-size:38px\"><strong>LUTADOR</strong></span></p><p style=\"margin-top:0cm;margin-right:-1.65pt;margin-bottom:.0001pt;margin-left:7.1pt;text-align:justify\"><span style=\"font-family:'Chaparral Pro, serif'\">\_\_</span></p><p><span style=\"font-size:large\"><strong>PONTOS DE VIDA</strong></span></p><p class=\"MsoNormal\"><strong>Dado de Vida:</strong> 1d10 por nível de Lutador.</p><p class=\"MsoNormal\"><strong>Pontos de Vida no 1º nível:</strong> 10 + seu modificador de Constituição.</p><p class=\"MsoNormal\"><strong>Média de Vida por nível:</strong> 6 + seu modificador de constituição por nível posterior.</p><p class=\"MsoNormal\"><strong>Pontos de Vida nos níveis seguintes:</strong> 1d10 + seu modificador de constituição por nível posterior.</p><p class=\"MsoNormal\">\_</p><p class=\"MsoNormal\"><span style=\"font-size:large\"><strong>PROFICIÊNCIAS</strong></span></p><p class=\"MsoNormal\"><strong>Equipamentos:</strong> Armas Marciais e uma “Ferramenta Amaldiçoada” a sua escolha.</p><p class=\"MsoNormal\"><strong>Salvaguarda:</strong> Força ou Agilidade e Constituição.</p><p class=\"MsoNormal\"><strong>Perícias:</strong> Escolha 3 perícias entre: Atletismo, Acrobacia, Intimidação, Intuição, Percepção, Prestidigitação, Provocação e Sobrevivência.</p><p class=\"MsoNormal\">\_</p><p class=\"MsoNormal\"><span style=\"font-size:large\"><strong>INFORMAÇÕES GERAIS</strong></span></p><p class=\"MsoBodyText\"><strong>Atributo Principal:</strong> Força ou Agilidade (à sua escolha).</p><p class=\"MsoNormal\"><strong>Habilidade Inata</strong>: Escolha entre “Corpo de Lutador” ou “Homem de Aço”.</p><p class=\"MsoNormal\"><strong>Talento:</strong> Escolha um entre qualquer talento que você possua os requisitos.</p><p class=\"MsoNormal\"><strong>Equipamentos:</strong> Uma arma marcial ou $ 3.000 e; $ 5.000.</p><img src=\"systems/jujutsu-system/assets/Tabelas/Lutador.png\"><p></p><table border=\"1\" style=\"margin-left:0pt;border-collapse:collapse;border:none;mso-border-alt:solid windowtext .5pt;mso-yfti-tbllook:1184;mso-padding-alt:0cm pt 0cm 0pt\" class=\"MsoTableGrid\"><tbody><tr style=\"mso-yfti-irow:0;mso-yfti-firstrow:yes;mso-yfti-lastrow:yes\"><td><p style=\"line-height:7pt;mso-line-height-rule:exactly;tab-stops:363.15pt;text-align:center\"><span style=\"font-size:large\"><strong>CRIANDO UM LUTADOR</strong></span></p></td></tr></tbody></table><p>Para criar rapidamente um Lutador primeiro distribua seus atributos, colocando o mais alto em Força ou Agilidade, de acordo com sua escolha de atributo principal. O segundo atributo mais alto deve ser Constituição. Escolha uma origem de poder de Feitiço Inato, Imaculado, Receptáculo ou Corpo Amaldiçoado e as habilidades básicas de Corpo de Lutador ou Proficiência Avançada, Espírito Marcial e Retomar Fôlego.</p><p class=\"MsoNormal\">Após isso, foque em pegar talentos para aumentar suas perícias que serão importantes no início do jogo, principalmente em talentos que dão proficiência nas perícias: Atletismo, Acrobacia, Percepção e Sobrevivência.</p><p style=\"margin-top:0cm;margin-right:5.4pt;margin-bottom:.0001pt;margin-left:7.1pt;tab-stops:524.5pt;text-align:justify\"><span style=\"font-family:'Chaparral Pro, serif'\">\_</span></p><table border=\"1\" style=\"margin-left:0pt;border-collapse:collapse;border:none;mso-border-alt:solid windowtext .5pt;mso-yfti-tbllook:1184;mso-padding-alt:0cm pt 0cm 0pt\" class=\"MsoTableGrid\"><tbody><tr style=\"mso-yfti-irow:0;mso-yfti-firstrow:yes;mso-yfti-lastrow:yes\"><td><p style=\"line-height:7pt;mso-line-height-rule:exactly;tab-stops:363.15pt;text-align:center\"><span style=\"font-size:large\"><strong>ACERTO E SALVAGUARDA</strong></span></p></td></tr></tbody></table><p><strong>CD dos Feitiços =</strong> 8 + bônus de proficiência + seu modificador de Força ou Agilidade.</p><p class=\"MsoBodyText\"><strong>Modificador do Feitiço =</strong> seu bônus de proficiência + seu modificador de Força ou Agilidade.</p><p></p><p style=\"text-align:center\"><span style=\"font-size:x-large\"><strong>CARACTERÍSTICAS DE COMBATE</strong></span></p><p>\_Como um Lutador, você recebe as seguintes características:<span style=\"font-family:'Chaparral Pro, serif'\">\_</span><span style=\"font-size:20pt;font-family:'Chaparral Pro', serif\"><strong>\_</strong></span></p><table border=\"1\" style=\"margin-left:0pt;border-collapse:collapse;border:none\" class=\"MsoTableGrid\"><tbody><tr><td><p style=\"line-height:7pt;text-align:center\"><span style=\"font-size:large\"><strong>COMBATENTE SELVAGEM</strong></span></p></td></tr></tbody></table><p style=\"text-align:justify\">A partir do 1º nível de Lutador, ao realizar uma jogada de ataque (comum) corpo a corpo desarmado durante a batalha, você pode implementar seus golpes, escolhendo um dos seguintes movimentos especiais:</p><ul><li><p><strong>Avanço Selvagem:</strong> Se você se mover pelo menos 3 metros em linha reta antes do ataque, o alvo sofre 1d6 de dano extra.</p><p class=\"MsoListParagraph\">Alternativamente, você pode escolher não causar o dano extra e forçar a criatura atingida, com categoria de tamanho Grande ou menor, a ser bem-sucedida em uma Salvaguarda de Força para não ser empurrada para um espaço desocupado a até 6 metros dela. Caso bata em uma estrutura ou objeto com raio maior que 1,5 metro, recebe 2d8 de dano extra.</p></li><li><p><strong>Golpe Baixo:</strong> Você pode mirar um golpe nas pernas do inimigo para inibir sua mobilidade. A criatura recebe 1d6 de dano extra e uma redução de 3 metros do seu deslocamento, até o final do próximo turno dela.</p><p class=\"MsoListParagraph\">Alternativamente, você pode escolher não causar o dano extra e a redução de deslocamento para forçar a criatura atingida a receber a condição “Caído”, sem a necessidade de um teste.</p></li><li><p><strong>Subjugador:</strong> Você executa uma jogada de ataque (comum) corpo a corpo contra uma criatura, com categoria de tamanho Grande ou menor, e impõe a condição “Agarrado” ao invés de causar dano.</p></li></ul><p style=\"margin:0cm 5.4pt 0.0001pt 7.1pt;text-align:justify\"></p><table border=\"1\" style=\"margin-left:0pt;border-collapse:collapse;border:none\" class=\"MsoTableGrid\"><tbody><tr><td><p style=\"line-height:7pt;text-align:center\"><span style=\"font-size:large\"><strong>CAMINHO DO LUTADOR</strong></span></p></td></tr></tbody></table><p style=\"text-align:justify\">A partir do <strong>2º nível de Lutador</strong>, você pode definir a natureza das suas habilidades, permitindo que você possa escolher entre Punho Divergente, Mestre do Fulgor, Demolidor ou Mestre das Armas. Você pode ver as características desse caminho no fim desse Estilo de Combate.</p><p></p><table border=\"1\" style=\"margin-left:0pt;border-collapse:collapse;border:none\" class=\"MsoTableGrid\"><tbody><tr><td><p style=\"line-height:7pt;text-align:center\"><span style=\"font-size:large\"><strong>MESTRE DO COMBATE</strong></span></p></td></tr></tbody></table><p style=\"text-align:justify\">A partir do 3º nível de Lutador, sua natureza agressiva e seu porte físico vigoroso lhe concedem os seguintes benefícios:</p><ul><li><p><strong>Mãos Letais:</strong> Suas jogadas de ataque (comum) corpo a corpo desarmado passam a receber os mesmos benefícios de uma arma marcial. Dessa forma, você pode escolher qualquer uma de suas propriedades para esses ataques. Essa escolha pode ser refeita sempre que você adquirir um novo nível de Lutador.</p></li><li><p><strong>Truque Sujo:</strong> Jogadas de ataque (comum) com resultado 1 no d20 são considerados acertos críticos.</p></li><li><p><strong>Ippon Seoi:</strong> Ao atingir uma criatura com uma jogada de ataque (Comum), você pode escolher diminuir seu dano pela metade para agarra-la na altura do peito e atira-la por cima do seu ombro. A criatura deve realizar uma Salvaguarda de Agilidade para não sofrer a condição “Caído”.</p><p class=\"MsoListParagraph\">Se a criatura já estiver agarrada, você pode usar uma ação bônus ou ação de poder para ativar essa característica sem precisar realizar uma rolagem de acerto.</p></li><li><p><strong>Golpe Esmagador:</strong> Ao realizar uma jogada de ataque (Comum) corpo a corpo contra uma criatura sob a condição “Caído”, você recebe +5 de acerto.</p></li></ul><p style=\"text-align:justify\">\_</p><p style=\"text-align:justify\">Além disso, você também pode realizar os seguintes feitos, uma quantidade de vezes igual ao seu bônus de Proficiência e você recupera todos os seus usos ao término de um descanso curto ou longo.</p><ul><li><p>Ignorar o acerto crítico de uma criatura contra você e receber o dano normal da jogada, no lugar;</p></li><li><p>Ignora resistências ou invulnerabilidades de um alvo que acertou com uma jogada de ataque (comum ou Técnicas);</p></li><li><p>Ignorar a falha de uma jogada de ataque (comum) corpo a corpo que você faça e jogar novamente.</p></li></ul><p style=\"text-align:justify\"></p><table border=\"1\" style=\"margin-left:0pt;border-collapse:collapse;border:none\" class=\"MsoTableGrid\"><tbody><tr><td><p style=\"line-height:7pt;text-align:center\"><span style=\"font-size:large\"><strong>AUMENTO NO VALOR DE ATRIBUTO</strong></span></p></td></tr></tbody></table><p style=\"text-align:justify\">Quando você atinge o <strong>4º nível</strong> e novamente no <strong>8º, 12º, 16º</strong> e <strong>19º nível</strong>, você pode aumentar um valor de atributo, à sua escolha, em 2 ou você pode aumentar dois valores de atributo, à sua escolha, em 1. Como padrão, você não pode elevar um valor de atributo acima de 20 com esta característica.</p><p style=\"text-align:justify\">A partir do <strong>12º nível</strong>, você pode elevar um valor de atributo até 22 com está característica. A partir do <strong>16º nível,</strong> você pode elevar um valor de atributo até 24 com está característica.</p><p style=\"text-align:justify\"></p><table border=\"1\" style=\"margin-left:0pt;border-collapse:collapse;border:none\" class=\"MsoTableGrid\"><tbody><tr><td><p style=\"line-height:7pt;text-align:center\"><span style=\"font-size:large\"><strong>REFORÇO DE VIGOR</strong></span></p></td></tr></tbody></table><p style=\"text-align:justify\">A partir do <strong>5º nível de Lutador</strong>, você aprende a liberar uma quantidade enorme de Energia Amaldiçoada em um momento oportuno. No início do seu turno, você pode gerar um valor de Pontos de Energia Amaldiçoada (PA) adicional igual ao nível do seu personagem. Essa característica pode ser utilizada 3 vezes por encontro.</p><p class=\"MsoNormal\"><span style=\"font-size:8pt;font-family:'Chaparral Pro', serif;color:black\"><em>\_</em></span></p><table border=\"1\" style=\"margin-left:0pt;border-collapse:collapse;border:none\" class=\"MsoTableGrid\"><tbody><tr><td><p style=\"line-height:7pt;text-align:center\"><span style=\"font-size:large\"><strong>ATAQUE EXTRA</strong></span></p></td></tr></tbody></table><p>A partir do <strong>7º nível de Restringido</strong>, você pode atacar duas vezes, ao invés de uma, quando usar a ação “Atacar” durante o seu turno. A partir do <strong>12º nível</strong>, você passa a poder atacar três vezes ao usar a ação “Atacar”.</p><p></p><table border=\"1\" style=\"margin-left:0pt;border-collapse:collapse;border:none\" class=\"MsoTableGrid\"><tbody><tr><td><p style=\"line-height:7pt;text-align:center\"><span style=\"font-size:large\"><strong>POTENCIAL AMALDIÇOADO</strong></span></p></td></tr></tbody></table><p style=\"text-align:justify\">A partir do <strong>9º nível de Lutador</strong>, você pode escolher entre receber 15 Pontos de Maldição ou 30 Pontos de Treinamento ou 50 PA máximos. Você recebe esse benefício novamente no 13º e 17º nível.</p><p style=\"text-align:justify\"></p><table border=\"1\" style=\"margin-left:0pt;border-collapse:collapse;border:none\" class=\"MsoTableGrid\"><tbody><tr><td><p style=\"line-height:7pt;text-align:center\"><span style=\"font-size:large\"><strong>ESPÍRITO INABALÁVEL</strong></span></p></td></tr></tbody></table><p style=\"text-align:justify\"><span style=\"mso-bidi-font-size:10.0pt\">A partir do <strong>11º nível de Lutador</strong>,</span><span style=\"mso-bidi-font-size:10.0pt;mso-bidi-font-family:'Times New Roman';mso-bidi-theme-font:minor-bidi\"> </span>você consegue se manter em combate puramente com seu espírito inabalável, secando até os últimos vestígios de energia para continuar em combate. Você recebe resistência a todos os tipos de dano.</p><p style=\"text-indent:49.6pt;tab-stops:467.8pt;text-align:justify\">Adicionalmente, se você cair a 0 Pontos de Vida e não morrer, você recupera metade dos seus Pontos de Vida e pode continuar lutando. Essa característica não pode ser usada novamente por 3 dias.</p><p></p><table border=\"1\" style=\"margin-left:0pt;border-collapse:collapse;border:none\" class=\"MsoTableGrid\"><tbody><tr><td><p style=\"line-height:7pt;text-align:center\"><span style=\"font-size:large\"><strong>VISÃO DO FULGOR</strong></span></p></td></tr></tbody></table><p style=\"text-align:justify\">A partir do <strong>15º nível de Lutador</strong>, ao atingir o fulgor, você teve um vislumbre que te causou um sentimento instintivo de como circular sua energia amaldiçoada com perfeição. Desde que você já tenha ativado o Fulgor Negro antes, você pode usar essa característica para que sua próxima rolagem de acerto (Comum) ative seu Fulgor Negro de forma garantida, desde que ela acerte o alvo, mas você não entra em zona.</p><p style=\"text-align:justify\">Você não pode utilizar essa característica novamente até o fim de um descanso longo.</p><p></p><table border=\"1\" style=\"margin-left:0pt;border-collapse:collapse;border:none\" class=\"MsoTableGrid\"><tbody><tr><td><p style=\"line-height:7pt;text-align:center\"><span style=\"font-size:large\"><strong>MESTRE LUTADOR</strong></span></p></td></tr></tbody></table><p style=\"text-align:justify\">A partir do <strong>18º nível de Lutador</strong>, você pode distribuir livremente 6 pontos entre seus atributos, respeitando o limite máximo de 24 em cada um deles. Além disso, você pode escolher dois atributos para aplicar esses pontos até o valor máximo de 30.</p><p></p><table border=\"1\" style=\"margin-left:0pt;border-collapse:collapse;border:none\" class=\"MsoTableGrid\"><tbody><tr><td><p style=\"line-height:7pt;text-align:center\"><span style=\"font-size:large\"><strong>CONTROLE ABSOLUTO</strong></span></p></td></tr></tbody></table><p style=\"text-align:justify\">A partir do <strong>19º nível de lutador</strong>, você transcende os limites de meros combatentes e atinge um patamar que será passado adiante em lendas. Como resultado, você recebe as seguintes características:</p><ul><li><p style=\"text-align:justify\"><strong>Golpe Potencializado:</strong> Suas jogadas de ataque (Comuns) com margem 15-19 que não forem consideradas um acerto crítico, causam o resultado máximo possível da rolagem dos dados;</p></li><li><p style=\"text-align:justify\"><strong>Ataque Destruidor:</strong> Atingir uma criatura com ND 10 ou menor reduz os Pontos de Vida dela a 0;</p></li><li><p style=\"text-align:justify\"><strong>Ataque Certeiro:</strong> Você acerta automaticamente suas rolagens de ataque (Comuns e de Técnica) e rola apenas para definir um acerto crítico e o efeito do “Golpe Potencializado”.</p></li></ul><p></p>"
