      ataque (Comuns e de Técnica) contra essa criatura.</p><p
      style="text-indent:35.45pt" class="TextoPadro"><span>Adicionalmente,
      enquanto o Shikigami estiver conjurado, você e ele recebem +1 de
      acerto.</span></p>
