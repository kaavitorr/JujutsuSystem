system:
  description:
    value: "<table border=\"1\" style=\"margin-left:0pt;border-collapse:collapse;border:none\" class=\"MsoTableGrid\"><tbody><tr><td><p style=\"line-height:7pt;text-align:center\"><span style=\"font-size:large\"><strong>EXECUTOR</strong></span></p></td></tr></tbody></table><p class=\"MsoNormal\">Executores são aqueles que sacrificam a auto preservação ao focar menos da sua energia amaldiçoada na defesa em troca de mais poder de fogo. Permitindo que seus feitiços se tornem mais poderosos e versáteis.</p><p style=\"margin-top:0cm;margin-right:.15pt;margin-bottom:.0001pt;margin-left:7.1pt;text-justify:inter-ideograph;tab-stops:7.1pt 467.8pt;text-align:justify\"></p><table border=\"1\" style=\"margin-left:7.1pt;border-collapse:collapse;border:none;mso-border-alt:solid windowtext .5pt;mso-yfti-tbllook:1184;mso-padding-alt:0cm 5.4pt 0cm 5.4pt\" class=\"MsoTableGrid\"><tbody><tr style=\"mso-yfti-irow:0;mso-yfti-firstrow:yes;mso-yfti-lastrow:yes\"><td><p class=\"MsoNormal\"><span style=\"font-size:large\"><strong>PECULIARIDADES DO EXECUTOR</strong></span></p><p class=\"MsoNormal\">Como um executor, você fez um voto restritivo que afetava a capacidade da sua energia amaldiçoada de proteger seu corpo, aumentando tremendamente sua capacidade ofensiva. Você não pode ter feitiços do tipo “Defensivo” e qualquer efeito de redução de dano que utilize PA, reduz apenas metade do valor que deveria no efeito. Além disso, efeitos de negação de dano não podem ser utilizados por você em si mesmo.</p><p class=\"MsoNormal\">Por exemplo: Ao utilizar uma Defesa Sólida e rodar 60, a redução é apenas de 30.</p></td></tr></tbody></table><p style=\"margin:0cm 0.15pt 0.0001pt 7.1pt;text-align:justify\"></p><p class=\"MsoNormal\"><span style=\"font-size:large\"><strong>CANHÃO DE VIDRO</strong></span></p><hr><p class=\"MsoNormal\">A partir do <strong>2º nível de Especialista</strong>, sua energia amaldiçoada perde uma grande capacidade defensiva em troca de uma versatilidade e ofensiva mais poderosa. Você perde imediatamente 2 Pontos de Vida e; seu dado de vida do nível 2 e nos níveis seguintes se torna d6. Adicionalmente, você também perde 1 Ponto de Vida por nível de personagem. Em troca dessa restrição, você recebe as seguintes características:</p><ul><li><p><em>Você recebe o dobro de dados de energia amaldiçoada por nível de personagem inclusive do 1º nível;</em></p></li><li><p><em>Você recebe acerto adicional em suas jogadas de ataque (Comuns e de Técnica) igual seu bônus de proficiência;</em></p></li><li><p><em>Suas jogadas de ataque (de Técnica) e técnicas em área recebem 1 de dano adicional para cada dado usado na rolagem, até um valor máximo igual seu nível de personagem. Por Exemplo: 3 dados = 3 de dano adicional.</em></p></li></ul><p style=\"margin-right:0.15pt\" class=\"TextoPadro\"><span style=\"font-size:7pt;font-family:''\">\_</span></p><p class=\"MsoNormal\"><span style=\"font-size:large\"><strong>FEITIÇO POTENCIALIZADO</strong></span></p><hr><p class=\"TextoPadro\">A partir do <strong>6º nível de Especialista</strong>, você aprendeu a canalizar sua energia amaldiçoada com maior potencial ofensivo. Toda vez que você receber Dados de Técnica, você recebe 1 adicional. Além disso, você recebe as seguintes características:</p><ul><li><p><em>Seus Dados de Técnica se tornam d8 no lugar do d6 original;</em></p></li><li><p><em>Você não tem mais limite para quantos dados de técnica pode acumular, mas o excedente some ao fim do combate;</em></p></li><li><p><em>Você pode usar Regenerar Maldição em si mesmo, mas com limite de 5 dados e apenas uma vez por descanso longo.</em></p><p style=\"text-indent:1cm\" class=\"TextoPadro\"></p></li></ul><p class=\"MsoNormal\"><span style=\"font-size:large\"><strong>ADAPTAÇÃO CONSTANTE</strong></span></p><hr><p class=\"MsoNormal\">A partir do <strong>10º nível de Especialista</strong>, você aprende a manipular seu feitiço para utiliza-lo constantemente ao seu favor a cada segundo do combate, criando vantagens e aberturas para causar ainda mais dano ao seu oponente. Você recebe as seguintes características:</p><ul><li><p><em>Você não pode ter desvantagem em jogadas de ataque (Comuns e de Técnica);</em></p></li><li><p><em>Você recebe 2d4 de dano adicional em cada uma de suas jogadas de ataque (Comuns e de Técnica);</em></p></li><li><p><em>Toda vez que você causar um acerto crítico, você causa 1 dado de dano adicional em ataques (Comuns) e 3 dados adicionais em técnicas. Esse dano é sempre aplicado ao final da rolagem de dano, de acordo com as regras padrões.</em></p></li></ul><p class=\"MsoNormal\">\_</p><p class=\"MsoNormal\"><span style=\"font-size:large\"><strong>ARTILHARIA HUMANA</strong></span></p><hr><p class=\"TextoPadro\">A partir do <strong>14º nível de Especialista</strong>, você consegue executar seus feitiços com ainda mais velocidade, assim como gerar uma quantidade de energia bem maior durante o combate. Você recebe acesso as seguintes características:</p><ul><li><p><em>No início de cada um de seus turnos, você pode sacrificar 5 Pontos de Vida para gerar energia adicional igual seu nível;</em></p></li><li><p><em>Ao usar o Movimentos Empoderados, você pode sacrificar a ação para receber uma ação de poder adicional;</em></p></li><li><p><em>Sua característica Movimentos Empoderados te concede uma ação bônus adicional sem precisar sacrificar sua ação, mas ela só pode ser utilizada para causar dano, seja por ataques comuns, jogadas de ataque (de Técnica) ou técnicas em área.</em></p></li></ul>"
