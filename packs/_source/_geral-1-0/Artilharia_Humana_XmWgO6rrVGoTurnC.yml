system:
  description:
    value: >-
      <p class="MsoNormal">A partir do <strong>14º nível de
      Especialista,</strong> você consegue executar seus feitiços com ainda mais
      velocidade, assim como gerar uma quantidade de energia bem maior durante o
      combate. Você recebe acesso as seguintes
      características:</p><ul><li><p><em>No início de cada um de seus turnos,
      você pode sacrificar 5 Pontos de Vida para gerar energia adicional igual
      seu nível;</em></p></li><li><p><em>Ao usar o <strong>Movimentos
      Empoderados</strong>, você pode sacrificar a ação para receber uma ação de
      poder adicional;</em></p></li><li><p><em>Sua característica
      <strong>Movimentos Empoderados</strong> te concede uma ação bônus
      adicional sem precisar sacrificar sua ação, mas ela só pode ser utilizada
      para causar dano, seja por ataques comuns, jogadas de ataque (de Técnica)
      ou técnicas em área.</em></p></li></ul>
