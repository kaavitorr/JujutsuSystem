name: Adaptação Constante
type: feat
img: icons/magic/symbols/rune-sigil-rough-white-teal.webp
system:
  description:
    value: >-
      <p class="MsoNormal">A partir do <strong>10º nível de
      Especialista</strong>, você aprende a manipular seu feitiço para
      utiliza-lo constantemente ao seu favor a cada segundo do combate, criando
      vantagens e aberturas para causar ainda mais dano ao seu oponente. Você
      recebe as seguintes características:</p><ul><li><p><em>Você não pode ter
      desvantagem em jogadas de ataque (Comuns e de
      Técnica);</em></p></li><li><p><em>Você recebe 2d4 de dano adicional em
      cada uma de suas jogadas de ataque (Comuns e de
      Técnica);</em></p></li><li><p><em>Toda vez que você causar um acerto
      crítico, você causa 1 dado de dano adicional em ataques (Comuns) e 3 dados
      adicionais em técnicas. Esse dano é sempre aplicado ao final da rolagem de
      dano, de acordo com as regras padrões.</em></p></li></ul>
