system:
  description:
    value: "<p>Por ser nascido e criado na cidade meteoro, você é uma pessoa sem identidade ou importância pra a sociedade, sendo apenas uma párea que nunca será aceita em lugar algum senão os meios criminosos.</p><p>\_\_\_\_\_\_\_\_\_\_\_\_\_\_ Você recebe -1 em Testes de Atributo de Interação social quando estiver interagindo com um membro comum da sociedade. Além disso, ao descobrirem que você é da cidade meteoro, essas criaturas irão tentar te expulsar ou se recusar a fornecer serviços a você (mesmo sendo um hunter) e, com exceção da licença de caçador, você não consegue criar novas identidades ou documentos legais.</p>"
