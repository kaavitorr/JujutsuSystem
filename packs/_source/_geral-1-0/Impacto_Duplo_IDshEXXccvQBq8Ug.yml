name: Impacto Duplo
type: feat
img: icons/skills/melee/unarmed-punch-fist-white.webp
system:
  description:
    value: >-
      <p class="MsoNormal">A partir do 2º nível de Lutador, você aprende a
      controlar sua energia amaldiçoada de forma a maximizar o dano causado no
      seu alvo. Você recebe acesso as seguintes
      características:</p><p><strong>Castigo de Ferro:</strong> Quando você ou
      uma criatura aliada a até 1,5 metros de você sofrer uma jogada de ataque
      (comum), você pode usar sua reação para realizar uma jogada de ataque
      (comum) corpo a corpo antes que o ataque seja concluído. Se acertar, o
      ataque causa dano Contundente em um valor igual 5 + o seu nível de Lutador
      e interrompe o ataque inimigo.</p><p class="TextoPadro">A partir do 10º
      nível, você não utiliza mais reação para esse efeito, mas pode utiliza-lo
      apenas uma vez por rodada.</p><p><strong>Energia Atrasada:</strong> Você
      pode escolher ter -3 de acerto ao realizar uma jogada de ataque (Comum)
      para fazer com que sua energia amaldiçoada dê um pequeno atraso, acertando
      o alvo uma segunda vez logo após seu golpe, liberando dois impactos
      distintos. Caso você role um resultado no dado de 15 ou mais e acerte o
      alvo, você causa novamente o dano do seu primeiro ataque, até um máximo de
      dano igual a 4 vezes o seu nível de personagem.</p><p>Dispersão de
      Energia: Toda vez que você ativar o efeito do Energia Atrasada com
      sucesso, você pode escolher receber dois dos seguintes
      efeitos:</p><ul><li><p class="MsoListParagraph">Você reduz o próximo dano
      sofrido em 6 Pontos de Dano;</p></li><li><p class="MsoListParagraph">Você
      impõe desvantagem na próxima rolagem de acerto contra você;</p></li><li><p
      class="MsoListParagraph">Você recebe vantagem na sua próxima Salvaguarda
      de Agilidade até o início do seu próximo turno;</p></li><li><p
      class="MsoListParagraph">Suas jogadas de ataque (Comuns e de Técnica)
      recebem 1d4 de dano adicional até o início do seu próximo
      turno.</p></li></ul><p class="TextoPadro">Alternativamente, você pode
      escolher consumir 2 Pontos de Energia Amaldiçoada (PA) para receber os
      efeitos acima sem precisar ativar a característica “Energia
      Atrasada”.</p><p class="TextoPadro">A partir do 10º nível, você recebe os
      4 benefícios ao ativar o “Dispersão de Energia”.</p>
