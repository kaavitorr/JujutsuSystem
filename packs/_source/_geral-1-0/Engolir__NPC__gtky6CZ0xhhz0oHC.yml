system:
  description:
    value: >-
      <p>O bagre realiza um ataque de mordida contra um alvo Grande ou menor que
      esteja agarrando. Se o ataque atingir, o alvo sofre o dano da mordida, o
      alvo também será engolido e o agarrão termina. Enquanto estiver engolido,
      o alvo estará cego e impedido, ele terá cobertura total contra ataques e
      outros efeitos de fora do bagre e sofre 11 (3d6) de dano ácido no começo
      de cada turno do bagre. Se o bagre sofrer 13 de dano ou mais em um único
      turno pela criatura engolida, o bagre deve ser bem sucedido em um teste de
      resistência de Constituição CD 22 no final desse turno ou regurgitará
      todas as criaturas engolidas, que cairão em um espaço a até 3 metros do
      bagre. Se o bagre morrer, uma criatura engolida não estará mais impedida
      por ele e poderá escapar do corpo usando 6 metros de movimento, estando
      caída ao sair.</p>
