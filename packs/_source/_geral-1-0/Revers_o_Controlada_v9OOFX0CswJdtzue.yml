system:
  description:
    value: >-
      <p class="MsoNormal">A partir do 6º nível de Especialista, você aprende a
      utilizar energia reversa de forma consciente, podendo até utiliza-la ao
      seu favor durante um combate ou para auxiliar seus companheiros. Você
      recebe acesso as seguintes características:</p><ul><li><p><em>Você aprende
      a habilidade de manipulação “Energia Reversa”;</em></p></li><li><p><em>Ao
      usar uma ação bônus, você envolve seu corpo com energia reversa, podendo
      gastar uma quantidade de PA igual ao número de dados de cura de Energia
      Reversa que deseja gerar, conforme a habilidade de manipulação — porém,
      sem utilizá-los para se curar.</em></p><p><em>Até o início do seu próximo
      turno, sempre que você ou uma criatura (inimiga ou aliada) a até 21 metros
      realizar uma jogada de ataque (Comum ou de Técnica), você pode rolar
      qualquer quantidade desses dados armazenados e adicionar ou subtrair o
      resultado da rolagem.</em></p></li></ul>
