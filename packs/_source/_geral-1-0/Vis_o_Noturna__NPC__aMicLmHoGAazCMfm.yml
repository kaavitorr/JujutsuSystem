system:
  description:
    value: >-
      <p><strong>Visão Noturna (–):</strong> A criatura pode ver na escuridão
      dentro de um raio de 18 metros. Pode ver na penumbra dentro do raio como
      se estivesse sob luz direta e na escuridão como se estivesse na penumbra.
      A criatura não consegue discernir cores na escuridão, apenas tons de
      cinza.</p>
