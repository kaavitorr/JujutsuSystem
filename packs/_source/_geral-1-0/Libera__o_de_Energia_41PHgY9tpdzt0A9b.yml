system:
  description:
    value: >-
      <p class="MsoBodyText">Você é capaz de explodir com uma quantidade
      incrível de energia amaldiçoada após devido tempo de concentração. Desde
      que você não tenha se movido durante seu turno, você pode manter sua
      concentração e sacrificar sua ação, ação de poder e possíveis ação bônus e
      reação para acumular sua energia amaldiçoada dentro do seu corpo. No
      início do seu próximo turno, você gera 3 vezes a quantidade de Energia
      Amaldiçoada normal para seu nível de personagem.</p><p
      class="MsoBodyText">Você recupera essa característica após realizar um
      descanso curto ou longo.</p>
