system:
  description:
    value: "<p><strong>Ajuste de Atributo:</strong> +4 Pontos de Atributo para distribuir entre todos os 6 atributos.</p><p><strong>Vida Base:</strong> 10 Pontos de Vida.</p><p><strong>Tamanho:</strong> 1,50 a 2,00 metros (pequeno, médio).</p><p><strong>Peso:</strong> Normalmente, entre 45 kg e 200 kg.</p><p><strong>Deslocamento:</strong> 9 metros.</p><p><strong>Nado:</strong> 4,5 metros.</p><p>\_</p><table border=\"1\" style=\"margin-left:0pt;border-collapse:collapse;border:none\" class=\"MsoTableGrid\"><tbody><tr><td><p style=\"line-height:7pt;text-align:center\"><span style=\"font-size:large\"><strong>CARACTERÍSTICAS DA ESPÉCIA</strong></span></p></td></tr></tbody></table><p>Essas características acompanham a existência do personagem, são representações da sua origem, sendo uma parte essencial de como ele vê o mundo e de como o mundo olha pra ele.</p><p style=\"margin:0.5pt 0cm 0.0001pt 7.1pt;text-align:justify\"></p><p><span style=\"font-size:large\"><strong>BENEFÍCIOS DA ORIGEM - ZENIN</strong></span></p><hr><ul><li><p><strong>Talento de Origem: </strong>No <strong>3º nível</strong>, você recebe um talento de origem de acordo com o <strong>Capítulo 6</strong>.\_</p></li><li><p><strong>Técnica Herdada: </strong>Como um membro da linhagem do Clã Zenin, você deve escolher entre ter acesso as técnicas herdadas das <strong>“10 Sombras”</strong> ou <strong>“Projeção”</strong>.</p></li><li><p><strong>Encarando a Morte: </strong>Você é capaz de explodir com um poder incomparável em momentos de necessidade. Ao cair a 1/3 dos Pontos de Vida ou menos, você passa a gerar Pontos de Energia Amaldiçoada (PA) adicionais iguais seu bônus de proficiência.</p></li></ul><p></p><p><span style=\"font-size:large\"><strong>DESVANTAGENS DA VARIANTE</strong></span></p><hr><ul><li><p><strong>Linhagem de Supremacistas:</strong> Seu clã acredita no poder acima de tudo, e isso lhe causa empecilhos quando você decide não seguir a agenda deles. Enquanto você se recusar a se tornar um pau-mandado do Clã Zenin, um assassino aparecerá todo mês para tentar matar um de seus companheiros. Essa desvantagem pode ser anulada por meios políticos mais à frente durante a aventura.</p></li></ul>"
