  description:
    value: >-
      <p class="MsoNormal"><span>A partir do <strong>2º nível de
      Especialista</strong>, </span>você aprendeu a lutar em conjunto com outras
      criaturas para fazer melhor uso de suas habilidades. Enquanto tiver outra
      criatura aliada a até 3 metros do seu alvo, você recebe 1d4 de dano
      adicional em suas jogadas de ataque contra a criatura.</p><p
      style="text-indent:35.45pt" class="TextoPadro"><span>Além disso, qualquer
      Shikigami que você venha a controlar, recebe 25 Pontos de Vida adicionais
      quando for conjurado.</span></p>
