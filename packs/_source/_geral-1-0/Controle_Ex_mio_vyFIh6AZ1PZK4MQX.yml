name: Controle Exímio
type: feat
img: icons/magic/lightning/bolt-strike-hand-gray.webp
system:
  description:
    value: "<p style=\"text-align:justify\">A partir do <strong>3º nível</strong> <strong>de Estrategista</strong>, você sente instintivamente como manipular sua energia, permitindo refinar seu controle além do que seria normal para alguém com seu nível de força. Você recebe acesso aos Dados de Estrategista, que permitem utilizar suas características.</p><p style=\"text-indent:42.55pt\" class=\"TextoPadro\">Ao fim de um descanso curto ou longo, você recebe um número de Dados de Estrategista igual ao seu nível de personagem (representados por d8), que podem ser consumidos para ativar os seguintes efeitos em criaturas a até 24 metros, usando uma reação:</p><ul><li><p><strong>Ação Precisa (1): </strong>Sempre que você rolar 1 no resultado do d20, você pode usar um dado para rolar novamente;</p></li><li><p><strong>Reversão Rápida (Até 2):</strong> Quando você ou uma criatura aliada receber dano de uma jogada de ataque, você pode rolar os dados e reduzir o dano pelo resultado dele + seu nível de Estrategista;</p></li><li><p><strong>Explosão de Energia (Até 2): </strong>Quando um aliado atacar uma criatura inimiga, você pode gastar dados para atirar um ataque contra o ataque dela, criando uma explosão e aumentando o dano do ataque pelo número de dados de estrategista rolados.</p></li><li><p><strong>Distração Súbita (1): </strong>Quando você ou uma criatura aliada errar uma jogada de ataque (Comum ou de Técnica), você pode rolar o dado e aumentar o valor do acerto pelo resultado da rolagem do dado de Estrategista;</p></li><li><p><strong>Remoção Rápida (1): </strong>Quando uma criatura tiver o deslocamento reduzido por algum motivo que não seja condições de 4 PA ou mais, você pode gastar rolar um dado, remover o efeito negativo afetando-a e aumentar o deslocamento dela no turno atual ou no início do próximo turno dela por um valor igual ao resultado do dado vezes 1,5 metros.</p></li></ul><p class=\"TextoPadro\"><span style=\"font-size:7pt\">\_</span></p><p class=\"TextoPadro\">A partir do <strong>8º nível</strong>, você não consome mais sua reação para utilizar as características acima e pode utilizá-las uma vez no turno de cada criatura.</p><p class=\"TextoPadro\">Sempre que você errar uma jogada de ataque (Comum) ou uma técnica que tenha tentado utilizar em um aliado ou inimigo que estaria suscetível a ela, falhar, você recupera 1 Dado de Estrategista.</p>"
