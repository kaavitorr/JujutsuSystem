system:
  description:
    value: >-
      <p><strong>Fúria (–): </strong>Ao começar o turno com menos da metade do
      seus Pontos de Vida, role um d6. Em um resultado 6, a criatura entra em
      fúria. Em cada um dos seus turnos, enquanto estiver em fúria, a criatura
      ataca o alvo mais próxima que ela possa ver. Se não houver uma criatura
      como alvo próxima o bastante para se mover e atacar, a criatura atacará um
      objeto, de preferência um objeto menor que ela. Quando a criatura entrar
      em fúria, ela continuará assim até recuperar todos os seus Pontos de
      Vida.</p>
