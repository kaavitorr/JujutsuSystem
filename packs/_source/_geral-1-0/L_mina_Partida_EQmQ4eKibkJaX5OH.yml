    value: >-
      <p><span>A partir do <strong>11º nível de Sentinela</strong>, </span>você
      se torna capaz de canalizar todo seu espírito mesmo diante de uma situação
      de derrota iminente. Quando seu domínio simples quebrar, você pode formar
      um novo imediatamente e, logo em seguida, realizar uma técnica que vai ser
      considerada como um crítico automático. Essa técnica irá ignorar efeitos
      de forçar o erro, acertando automaticamente o alvo.</p><p
      style="text-indent:35.45pt" class="TextoPadro">Você não pode utilizar essa
      característica novamente até o fim de um descanso longo.</p>
