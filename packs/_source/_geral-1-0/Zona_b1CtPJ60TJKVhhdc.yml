system:
  description:
    value: "<p>Você pode entrar em um estado de concentração absoluto onde você exerce sua força com o máximo de eficiência possível. Ao utilizar uma ação bônus, você pode escolher um dos 3 efeitos para se beneficiar:</p><ul><li><p><strong>Brutalidade Transbordante:</strong> Sua próxima técnica causa 3 dados de dano adicionais e recebe margem de acerto crítico 18-20. Além disso seu dano mínimo não pode ser menor que a metade.</p></li><li><p><strong>Jogando Seguro:</strong> Durante 1 minuto, você pode optar por converter qualquer dano causado que seja inferior à metade do dano total possível em exatamente metade desse valor.\_</p></li><li><p><strong>Defesa Inquebrável:</strong> Dentro de um minuto, você pode escolher uma única técnica de cura ou redução de dano e curar ou reduzir o valor máximo possível dos dados. Caso seja uma técnica que se renova toda rodada, você só maximiza o dado da primeira rolagem.</p></li></ul><p>\_</p><p>Você não pode ativar essa habilidade básica novamente até o fim de um descanso longo.</p>"
