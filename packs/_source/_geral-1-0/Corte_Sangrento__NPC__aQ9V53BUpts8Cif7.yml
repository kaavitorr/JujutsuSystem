    value: >-
      <p><strong>Corte Sangrento (–): </strong>Uma vez por turno, após acertar
      um alvo com uma jogada de ataque corpo-a-corpo com arma cortante, o alvo
      atingido deve ser bem sucedido em um Teste de Resistência de Constituição
      ou receberá a condição “Sangramento”. Esta característica pode ser usada
      até 5 vezes por dia e recarrega logo após o término de um descanso
      longo.</p>
