system:
  description:
    value: >-
      <p>Ataque Corpo-a-Corpo com Arma: A baleia insular realiza uma investida
      com a cabeça em um cilindro de 15 metros. Cada criatura na área deve
      realizar um teste de resistência de destreza CD 24, sofrendo 83 (15d10) de
      concussão se falhar na resistência, ou metade desse dano caso obtenha
      sucesso. Empurrando todas as criaturas, que não passarem em um teste de
      força CD 20, por 9 metros, também deve ser bem sucedida em um teste de
      resistência de Constituição CD 20 ou ficará atordoada até o final do
      próximo turno da baleia.</p>
