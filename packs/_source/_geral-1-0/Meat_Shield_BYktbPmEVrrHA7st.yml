system:
  description:
    value: "<p>Quando você for alvo de uma jogada de ataque (Comum ou de Técnica) ou tiver que realizar uma Salvaguarda para tomar todo ou metade do dano, você pode usar sua reação para mitigar o dano ao desviar ou contra atacar, reduzindo [[/roll 10d8]] de dano.</p><p>\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_ Você pode gastar 1 Ponto de Vigor para aumentar 2d8 de redução até um máximo de 30d8.</p><hr><p>\_<strong>Duração:</strong>\_Instantâneo</p><p><strong>Alcance:</strong>\_Toque</p><p><strong>Requisito:</strong>\_Reação</p><p><strong>Custo:</strong> 3 PA</p>"
