    value: >-
      <p class="MsoNormal">Talvez você tenha crescido em um local com culturas
      tribais ou em meio aos animais, talvez tenha combatido muitas feras,
      durante sua vida, ou só nasceu assim. O fato é que você se parece muito
      com um animal, às vezes, e têm instintos de sobrevivência aflorados.</p><p
      class="MsoListParagraph"><strong>Característica:</strong> Sempre que uma
      criatura assumida como inimiga estiver no seu campo de visão, você pode
      rolar um Teste de Atributo de Sabedoria (Intuição) CD 15 para saber se ele
      é mais fraco, igualmente forte ou mais forte que você. Adicionalmente, se
      uma criatura hostil estiver te olhando diretamente, você consegue sentir o
      olhar, mas não sabe de onde ele está vindo.</p>
