img: icons/magic/control/buff-flight-wings-runes-red-yellow.webp
system:
  description:
    value: "<p class=\"TextoPadro\">A partir do 6º nível de Lutador, você pode utilizar a pressão do combate para acumular momento de forma a explodir com potencial em períodos específicos. A cada 6 Pontos de Dano que você receber em combate com uma criatura inimiga, você ganha 1 Ponto de Potencial. Você pode gastar Pontos de Potencial (PP) para ativar as seguintes características:</p><ul><li><p><strong>2 PP:</strong> Você recebe vantagem na sua próxima rolagem de acerto;</p></li><li><p><strong>5 PP:</strong> Você recebe acerto automático na sua próxima rolagem de acerto;</p></li><li><p><strong>1 ~ 5 PP:</strong> Você recebe +1 de acerto na sua próxima rolagem de acerto para cada PP gasto;</p></li><li><p><strong>1 ~ 5 PP:</strong> Você recebe 1 dado de dano na sua próxima técnica para cada PP gasto, mas esses dados não podem fazer seu dano ir acima do dano máximo possível sem a utilização deles. </p></li></ul><p class=\"TextoPadro\">Por exemplo: Se uma técnica causar 3d10 de dano, o dano máximo possível para ela é de 30.</p><p class=\"TextoPadro\">\_</p><p>Os Pontos de Potencial não têm limite de quantidade e desaparecem ao fim de um descanso longo, mas você pode manter um valor guardado ao fim dele igual seu nível de personagem.</p>"
