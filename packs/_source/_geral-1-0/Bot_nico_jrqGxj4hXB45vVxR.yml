    value: >-
      <p class="MsoNormal">Você é um grande conhecedor de plantas, e aprendeu a
      utiliza-las de diversas formas possíveis para ajudar seu corpo a manter um
      estado otimizado.</p><p
      class="MsoBodyText"><strong>Característica:</strong> Você recebe +2 em
      Testes de Atributo e Salvaguardas relacionados a plantas. Adicionalmente,
      você pode utilizar ¥ 10.000 em ervas e/ou plantas para estabilizar uma
      criatura caída e recuperar 1d10 Pontos de Vida dela. Essa característica
      pode ser utilizada uma vez por dia por criatura.</p>
