system:
  description:
    value: >-
      <p>A partir do <strong>15º nível de Sentinela</strong>, você se tornou tão
      habilidoso na utilização do seu domínio que ele deixa de impor limitações
      sobre seus movimentos. Enquanto seu domínio simples estiver ativo, você
      pode se mover livremente e não consome mais Pontos de Energia Amaldiçoada
      (PA) para ativá-lo ou mantê-lo ativo.</p><p class="MsoNormal">Além disso,
      durante um choque de domínios, a quantidade de Pontos de Vida do seu
      domínio é duplicada, permitindo que ele resista por muito mais tempo.</p>
