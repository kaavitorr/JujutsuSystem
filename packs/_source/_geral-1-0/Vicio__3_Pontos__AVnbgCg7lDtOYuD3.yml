system:
  description:
    value: >-
      <p>Você é dependente de uma substância específica, como álcool, nicotina,
      açúcar, drogas, determinados alimentos ou compostos similares. Sempre que
      deixa de consumir essa substância, os efeitos da abstinência passam a se
      acumular da seguinte forma:</p><p><strong>1 Dia Sem Consumo:</strong> você
      recebe desvantagem nas jogadas para determinar a
      iniciativa.</p><p><strong>2 Dias Sem Consumo:</strong> você não recebe
      nenhum benefício ao finalizar descansos curtos.</p><p><strong>A Partir do
      3º Dia:</strong> para cada dia adicional sem consumir a substância, você
      perde 5 Pontos de Aura do seu valor máximo.</p><p>Os Pontos de Aura
      perdidos dessa forma só são recuperados após o término de um descanso
      longo, desde que o vício tenha sido satisfeito antes desse descanso.</p>
