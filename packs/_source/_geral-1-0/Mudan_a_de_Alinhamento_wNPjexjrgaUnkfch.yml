    value: "<p class=\"MsoNormal\">Você pode mudar seu atributo principal, permitindo que ele se torne a base da sua categoria para seus ataques e técnicas.\_ Você pode escolher entre: Força, Agilidade, Intelecto, Sabedoria e Presença.</p><p class=\"MsoNormal\">Além disso, você recebe proficiência em uma perícia ou maestria, caso você já possua proficiência nela, e proficiência na Salvaguarda do Atributo escolhido. Caso você já possua proficiência na Salvaguarda, você pode escolher uma outra para receber proficiência.</p>"
