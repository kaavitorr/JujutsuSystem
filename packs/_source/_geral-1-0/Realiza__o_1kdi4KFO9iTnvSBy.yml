system:
  description:
    value: >-
      <p>A partir do 19º nível de Restringido, você supera os limites do que
      seria possível normalmente até para suas habilidades, atingindo um novo
      patamar de poder. Você recebe acesso as seguintes
      características:</p><ul><li><p><em>O dano de seus ataques com arma
      amaldiçoada se torna 4d8 no lugar do
      original;</em></p></li><li><p><em>Você recebe uma jogada de ataque (Comum)
      adicional na característica Ataque Extra;</em></p></li><li><p><em>Você
      recebe todos os benefícios do Mestre do Combate simultaneamente,
      independentemente da arma utilizada;</em></p></li><li><p><em>Sua Classe de
      Resistência se torna 30. Qualquer aumento externo, sem ser HB, pode
      eleva-la até um máximo de 35;</em></p></li><li><p><em>Sua resistência a
      dano do Existência Aprimorada passa a englobar dano do tipo “Verdadeiro”
      independentemente da fonte, e suas resistências não podem ser ignoradas de
      nenhuma forma.</em></p></li></ul><p></p>
