system:
  description:
    value: >-
      <p class="MsoNormal">Quando você tiver uma criatura hostil à 1,5 metros de
      você, você pode usar uma ação bônus e recuar até o dobro do seu
      deslocamento normal, desde que você não tenha feito uma jogada de ataque
      no seu turno ou causado qualquer tipo de dano, ficando impedido de causar
      danos após o recuo.</p><p class="MsoNormal">No próximo turno, após ter
      executado essa característica, você pode executar um feitiço de ataque de
      até 12 dados de dano (sem explosão ofensiva) ou técnica de 4º grau ou
      menor pela metade do custo de Pontos de Energia Amaldiçoada (PA) que são
      retirados da sua energia total. Caso a técnica ou feitiço cause menos da
      metade do dano possível ou não provoque nenhum efeito, não haverá consumo
      de PA. O deslocamento feito durante essa característica não provoca
      reações, como a característica “Ataque de Oportunidade”.</p><p>Essa
      característica pode ser usada até 3 vezes e você recupera todos os seus
      usos ao término de um descanso longo.</p>
