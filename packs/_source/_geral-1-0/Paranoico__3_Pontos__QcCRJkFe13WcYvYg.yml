  description:
    value: >-
      <p>Você não confia em ninguém, nem em seus amigos. Nunca pede e nem aceita
      nenhuma ajuda, nem mesmo o tratamento de seus ferimentos. Não consegue
      descansar ou dormir direito: mesmo que esteja em uma estalagem ou outro
      lugar que parece ser totalmente seguro.</p><p>Você precisa de, no mínimo,
      2 horas para se acalmar e achar que está tudo certo, para começar um
      descanso curto ou longo.</p>
