system:
  description:
    value: >-
      <p style="text-align:justify">A partir do <strong>15º nível de
      Lutador</strong>, ao atingir o fulgor, você teve um vislumbre que te
      causou um sentimento instintivo de como circular sua energia amaldiçoada
      com perfeição. Desde que você já tenha ativado o Fulgor Negro antes, você
      pode usar essa característica para que sua próxima rolagem de acerto
      (Comum) ative seu Fulgor Negro de forma garantida, desde que ela acerte o
      alvo, mas você não entra em zona.</p><p style="text-align:justify">Você
      não pode utilizar essa característica novamente até o fim de um descanso
      longo.</p>
