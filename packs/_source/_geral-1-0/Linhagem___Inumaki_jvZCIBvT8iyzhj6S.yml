  description:
    value: "<p><strong>Ajuste de Atributo:</strong> +4 Pontos de Atributo para distribuir entre todos os 6 atributos.</p><p><strong>Vida Base:</strong> 10 Pontos de Vida.</p><p><strong>Tamanho:</strong> 1,50 a 2,00 metros (pequeno, médio).</p><p><strong>Peso:</strong> Normalmente, entre 45 kg e 200 kg.</p><p><strong>Deslocamento:</strong> 9 metros.</p><p><strong>Nado:</strong> 4,5 metros.</p><p>\_</p><table border=\"1\" style=\"margin-left:0pt;border-collapse:collapse;border:none\" class=\"MsoTableGrid\"><tbody><tr><td><p style=\"line-height:7pt;text-align:center\"><span style=\"font-size:large\"><strong>CARACTERÍSTICAS DA ESPÉCIA</strong></span></p></td></tr></tbody></table><p><span style=\"font-size:10pt;line-height:102%;font-family:'Chaparral Pro', serif\">Essas</span><span style=\"letter-spacing:0.7pt\"> </span><span style=\"font-size:10pt;line-height:102%;font-family:'Chaparral Pro', serif\">características</span><span style=\"letter-spacing:0.55pt\"> </span><span style=\"font-size:10pt;line-height:102%;font-family:'Chaparral Pro', serif\">acompanham</span><span style=\"letter-spacing:0.55pt\"> </span><span style=\"font-size:10pt;line-height:102%;font-family:'Chaparral Pro', serif\">a</span><span style=\"letter-spacing:0.7pt\"> </span><span style=\"font-size:10pt;line-height:102%;font-family:'Chaparral Pro', serif\">existência</span><span style=\"letter-spacing:0.65pt\"> </span><span style=\"font-size:10pt;line-height:102%;font-family:'Chaparral Pro', serif\">do</span><span style=\"letter-spacing:0.8pt\"> </span><span style=\"font-size:10pt;line-height:102%;font-family:'Chaparral Pro', serif\">personagem,</span><span style=\"letter-spacing:0.75pt\"> </span><span style=\"font-size:10pt;line-height:102%;font-family:'Chaparral Pro', serif\">são</span><span style=\"letter-spacing:0.6pt\"> </span><span style=\"font-size:10pt;line-height:102%;font-family:'Chaparral Pro', serif\">representações</span><span style=\"letter-spacing:0.75pt\"> </span><span style=\"font-size:10pt;line-height:102%;font-family:'Chaparral Pro', serif\">da</span><span style=\"letter-spacing:0.65pt\"> </span><span style=\"font-size:10pt;line-height:102%;font-family:'Chaparral Pro', serif\">sua</span><span style=\"letter-spacing:0.7pt\"> </span><span style=\"font-size:10pt;line-height:102%;font-family:'Chaparral Pro', serif\">origem,</span><span style=\"letter-spacing:0.55pt\"> </span><span style=\"font-size:10pt;line-height:102%;font-family:'Chaparral Pro', serif\">sendo</span><span style=\"letter-spacing:0.6pt\"> </span><span style=\"font-size:10pt;line-height:102%;font-family:'Chaparral Pro', serif\">uma</span><span style=\"letter-spacing:0.8pt\"> </span><span style=\"font-size:10pt;line-height:102%;font-family:'Chaparral Pro', serif\">parte</span><span style=\"letter-spacing:0.6pt\"> </span><span style=\"font-size:10pt;line-height:102%;font-family:'Chaparral Pro', serif\">essencial</span><span style=\"letter-spacing:0.75pt\"> </span><span style=\"font-size:10pt;line-height:102%;font-family:'Chaparral Pro', serif\">de</span><span style=\"letter-spacing:0.05pt\"> </span><span>como</span><span style=\"letter-spacing:-0.45pt\"> </span><span>ele</span><span style=\"letter-spacing:-0.4pt\"> </span><span>vê</span><span style=\"letter-spacing:-0.45pt\"> </span><span>o</span><span style=\"letter-spacing:-0.4pt\"> </span><span>mundo</span><span style=\"letter-spacing:-0.55pt\"> </span><span>e</span><span style=\"letter-spacing:-0.4pt\"> </span><span>de</span><span style=\"letter-spacing:-0.45pt\"> </span><span>como</span><span style=\"letter-spacing:-0.5pt\"> </span><span>o</span><span style=\"letter-spacing:-0.45pt\"> </span><span>mundo</span><span style=\"letter-spacing:-0.4pt\"> </span><span>olha</span><span style=\"letter-spacing:-0.4pt\"> </span><span>pra</span><span style=\"letter-spacing:-0.35pt\"> </span><span>ele.</span></p><p style=\"margin:0.5pt 0cm 0.0001pt 7.1pt;text-align:justify\"></p><p><span style=\"font-size:large\"><strong>BENEFÍCIOS DA ORIGEM - INUMAKI</strong></span></p><hr><ul><li><p><strong>Talento de Origem: </strong>No <strong>3º nível</strong>, você recebe um talento de origem de acordo com o <strong>Capítulo 6</strong>.\_</p></li><li><p><strong>Técnica Herdada: </strong>Como um membro da linhagem do Clã Inumaki, você recebe acesso a técnica herdada da <strong>“Fala Amaldiçoada”</strong>.</p></li><li><p><strong>Voz Soberana: </strong>Seu atributo principal se torna Presença e você recebe proficiência em Salvaguardas desse atributo. Além disso, sua voz pode ecoar por todo local atingindo o máximo de criaturas possíveis. Você dobra o alcance de suas habilidades de <strong>“Fala Amaldiçoada”</strong>.</p></li></ul><p></p><p><span style=\"font-size:large\"><strong>DESVANTAGENS DA VARIANTE</strong></span></p><hr><ul><li><p><strong>Língua Traiçoeira: </strong>Devido as peculiaridades da sua técnica herdada, ela se encontra sempre ativa, fazendo com que seja impossível que você fale normalmente sem ativa-la. Qualquer sentença que possua um imperativo e sinônimos pode ativar ela contra sua vontade, assim como qualquer palavra que o Narrador julgar que possa ser um gatilho para sua habilidade.</p></li><li><p><strong>Dano Localizado: </strong>Enquanto usar a fala amaldiçoada não seja perigoso em si, utiliza-la contra um grande grupo de criaturas ou uma muito poderosa pode ter um efeito colateral caso sua energia amaldiçoada não seja o suficiente. Quando uma criatura passar em uma Salvaguarda contra sua fala amaldiçoada, você recebe 1d4 de dano diretamente na sua vida.</p></li></ul>"
