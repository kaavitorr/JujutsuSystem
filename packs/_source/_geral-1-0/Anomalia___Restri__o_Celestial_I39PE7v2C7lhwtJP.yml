system:
  description:
    value: "<p style=\"text-align:center\"><span><span style=\"font-size:38px\"><strong>RESTRIÇÃO CELESTIAL</strong></span></span></p><p style=\"margin-bottom:.0001pt;text-justify:inter-ideograph;line-height:normal;mso-layout-grid-align:none;text-autospace:none;text-align:justify\"><span style=\"font-family:'Chaparral Pro, serif'\">\_</span></p><p><strong>Ajuste de Atributo:</strong> +4 Pontos de Atributo para distribuir entre todos os 6 atributos.</p><p><strong>Vida Base:</strong> 10 Pontos de Vida.</p><p><strong>Tamanho:</strong> 1,50 a 2,00 metros (pequeno, médio).</p><p><strong>Peso:</strong> Normalmente, entre 45 kg e 200 kg.</p><p><strong>Deslocamento:</strong> 9 metros.</p><p><strong>Nado:</strong> 4,5 metros.</p><p>\_</p><table border=\"1\" style=\"margin-left:0pt;border-collapse:collapse;border:none\" class=\"MsoTableGrid\"><tbody><tr><td><p style=\"line-height:7pt;text-align:center\"><span style=\"font-size:large\"><strong>CARACTERÍSTICAS DA ESPÉCIA</strong></span></p></td></tr></tbody></table><p><span style=\"font-size:10.0pt;line-height:102%;font-family:'Chaparral Pro',serif\">Essas</span><span style=\"letter-spacing:.7pt\"> </span><span style=\"font-size:10.0pt;line-height:102%;font-family:'Chaparral Pro',serif\">características</span><span style=\"letter-spacing:.55pt\"> </span><span style=\"font-size:10.0pt;line-height:102%;font-family:'Chaparral Pro',serif\">acompanham</span><span style=\"letter-spacing:.55pt\"> </span><span style=\"font-size:10.0pt;line-height:102%;font-family:'Chaparral Pro',serif\">a</span><span style=\"letter-spacing:.7pt\"> </span><span style=\"font-size:10.0pt;line-height:102%;font-family:'Chaparral Pro',serif\">existência</span><span style=\"letter-spacing:.65pt\"> </span><span style=\"font-size:10.0pt;line-height:102%;font-family:'Chaparral Pro',serif\">do</span><span style=\"letter-spacing:.8pt\"> </span><span style=\"font-size:10.0pt;line-height:102%;font-family:'Chaparral Pro',serif\">personagem,</span><span style=\"letter-spacing:.75pt\"> </span><span style=\"font-size:10.0pt;line-height:102%;font-family:'Chaparral Pro',serif\">são</span><span style=\"letter-spacing:.6pt\"> </span><span style=\"font-size:10.0pt;line-height:102%;font-family:'Chaparral Pro',serif\">representações</span><span style=\"letter-spacing:.75pt\"> </span><span style=\"font-size:10.0pt;line-height:102%;font-family:'Chaparral Pro',serif\">da</span><span style=\"letter-spacing:.65pt\"> </span><span style=\"font-size:10.0pt;line-height:102%;font-family:'Chaparral Pro',serif\">sua</span><span style=\"letter-spacing:.7pt\"> </span><span style=\"font-size:10.0pt;line-height:102%;font-family:'Chaparral Pro',serif\">origem,</span><span style=\"letter-spacing:.55pt\"> </span><span style=\"font-size:10.0pt;line-height:102%;font-family:'Chaparral Pro',serif\">sendo</span><span style=\"letter-spacing:.6pt\"> </span><span style=\"font-size:10.0pt;line-height:102%;font-family:'Chaparral Pro',serif\">uma</span><span style=\"letter-spacing:.8pt\"> </span><span style=\"font-size:10.0pt;line-height:102%;font-family:'Chaparral Pro',serif\">parte</span><span style=\"letter-spacing:.6pt\"> </span><span style=\"font-size:10.0pt;line-height:102%;font-family:'Chaparral Pro',serif\">essencial</span><span style=\"letter-spacing:.75pt\"> </span><span style=\"font-size:10.0pt;line-height:102%;font-family:'Chaparral Pro',serif\">de</span><span style=\"letter-spacing:.05pt\"> </span><span style=\"mso-font-width:105%\">como</span><span style=\"letter-spacing:-.45pt\"> </span><span style=\"mso-font-width:105%\">ele</span><span style=\"letter-spacing:-.4pt\"> </span><span style=\"mso-font-width:105%\">vê</span><span style=\"letter-spacing:-.45pt\"> </span><span style=\"mso-font-width:105%\">o</span><span style=\"letter-spacing:-.4pt\"> </span><span style=\"mso-font-width:105%\">mundo</span><span style=\"letter-spacing:-.55pt\"> </span><span style=\"mso-font-width:105%\">e</span><span style=\"letter-spacing:-.4pt\"> </span><span style=\"mso-font-width:105%\">de</span><span style=\"letter-spacing:-.45pt\"> </span><span style=\"mso-font-width:105%\">como</span><span style=\"letter-spacing:-.5pt\"> </span><span style=\"mso-font-width:105%\">o</span><span style=\"letter-spacing:-.45pt\"> </span><span style=\"mso-font-width:105%\">mundo</span><span style=\"letter-spacing:-.4pt\"> </span><span style=\"mso-font-width:105%\">olha</span><span style=\"letter-spacing:-.4pt\"> </span><span style=\"mso-font-width:105%\">pra</span><span style=\"letter-spacing:-.35pt\"> </span><span style=\"mso-font-width:105%\">ele.</span></p><p style=\"margin-top:.5pt;margin-right:0cm;margin-bottom:.0001pt;margin-left:7.1pt;text-justify:inter-ideograph;tab-stops:7.1pt 345.55pt 467.8pt 522.85pt;text-align:justify\"></p><p><span style=\"font-size:large\"><strong>BENEFÍCIOS DA ORIGEM - RESTRIÇÃO CELESTIAL</strong></span></p><hr><ul><li><p><strong>Talento de Origem: </strong>No <strong>3º nível</strong>, você recebe um talento de origem de acordo com o <strong>Capítulo 6</strong>.\_</p></li><li><p><strong>Fisicamente Dotado:</strong> Você recebe acesso ao Estilo de Combate “Restringido”, sendo essa sua única opção de Estilo de Combate e suas técnicas de dano com ele causam 1 dado de dano adicional, aumentando para 2 dados adicionais no 9º nível e novamente para 3 dados no 15º nível de personagem.</p></li><li><p><strong>Físico Extremo:</strong> Ao criar seu personagem, veja o jogador que possui a maior soma de atributos, você recebe o mesmo valor e um adicional de 6 Pontos de Atributos que podem ser distribuídos livremente entre Força, Agilidade e Constituição, até um máximo de 22. Após isso, seu valor máximo para esses atributos se torna 30.</p><p></p></li></ul><p><span style=\"font-size:large\"><strong>DESVANTAGENS DA VARIANTE</strong></span></p><hr><ul><li><p><strong>Vazio de Energia: </strong>Você não possui energia amaldiçoada, recebendo diversas limitações que os outros feiticeiros não possuem. Você não pode causar dano ou enxergar Espíritos Amaldiçoados sem o auxílio de<strong> “Ferramentas Amaldiçoadas”</strong>.</p></li><li><p><strong>Manipulação Inexistente:</strong> Você não pode treinar Energia Amaldiçoada (<strong>Capítulo 6.5</strong>) ou utilizar características e habilidades de manipulação de energia amaldiçoada (<strong>Capítulo 6</strong>) e nem recebe acesso a habilidades do <strong>Manual de Feitiços.</strong></p></li></ul>"
