name: Remoção de Limitador
type: feat
img: icons/magic/light/orbs-firefly-hand-yellow.webp
system:
  description:
    value: >-
      <p class="TextoPadro">A partir do <strong>14º nível de Lutador</strong>,
      seu corpo transborda de energia amaldiçoada que permite que você acabe
      formando um estoque de energia reversa em seu corpo que é formada
      instintivamente. Você gera Pontos de Energia Amaldiçoada (PA) adicionais
      por rodada igual ao seu nível de personagem.</p><p
      class="TextoPadro">Adicionalmente, você pode usar uma ação bônus para
      receber 1d4 adicional em suas rolagens de acerto pelo próximo minuto
      (também afeta a rolagem secundária para ativar o fulgor), aumentando seu
      resultado final da rolagem pelo resultado do d4. Você também pode, em um
      resultado de 4, aumentar o resultado do seu DADO em 1. Se isso ocorrer e o
      resultado da rolagem do dado entrar na margem de um crítico, ela passa a
      ser considerada um.</p><p class="TextoPadro">Você recupera essa
      característica ao fim de um descanso longo.</p>
