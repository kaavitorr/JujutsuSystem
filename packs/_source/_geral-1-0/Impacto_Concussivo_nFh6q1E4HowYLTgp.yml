system:
  description:
    value: >-
      <p class="MsoNormal">A partir do <strong>10º nível de Lutador,</strong>
      você faz com que seus golpes com “Energia Atrasada” se tornem ainda mais
      potentes. Você não precisa mais sacrificar seu acerto para usar a
      característica e, uma vez por rodada, quando você acertar um crítico com
      “Energia Atrasada”, a criatura deve realizar uma Salvaguarda de
      Constituição para não receber a condição “Estremecido” até o fim do
      próximo turno dela.</p><p class="MsoNormal">Adicionalmente, seu resultado
      no dado para ativar a característica se torna 14 ou maior e seu limite de
      dano muda para 5 vezes o seu nível de personagem.</p>
