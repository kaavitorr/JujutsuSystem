system:
  description:
    value: >-
      <p>Seu físico evoluiu, te dando um metabolismo extremamente acelerado e um
      vigor extremo. Você recebe acesso as seguintes
      características:</p><ul><li><p><strong>Gênio Marcial:</strong> Você possui
      uma capacidade extraordinária para desenvolver técnicas e habilidades que
      auxiliam em combate. A qualquer momento, você pode consumir 5 PT para
      criar uma nova técnica de até 7º grau, seguindo as regras de criação de
      técnicas comuns apresentadas no Manual de Feitiços. Não existe um limite
      de quantas técnicas adicionais você pode criar, desde que você consuma os
      Pontos de Treinamento necessários.</p></li><li><p><strong>Metabolismo
      Extremo:</strong> Seu descanso longo se torna de 2 horas e seu curto de 5
      minutos.</p></li><li><p><strong>Impulso Físico:</strong> Você pode gastar
      1 PE para aumentar seu dano em 2d4 o diminuir o dano sofrido no mesmo
      valor, até um máximo de PE igual metade do seu nível de personagem
      (arredondado para cima).</p></li><li><p><strong>Sentidos
      Extremos:</strong> Você recebe Sentido Verdadeiro em uma área de 36 metros
      ao seu redor.</p></li></ul>
