      selos.</li><li><strong>Selos Complexos:</strong> Ao reduzir seu
      deslocamento a 0 e se negar qualquer bônus posterior de deslocamento, você
      pode fazer um selo complexo sem consumir nenhum uso de seus
      selos.</li></ul>
