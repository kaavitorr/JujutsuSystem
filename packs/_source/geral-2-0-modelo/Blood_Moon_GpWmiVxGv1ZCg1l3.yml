system:
  description:
    value: "<p>Uma técnica que pode ser utilizada dentro do domínio simples ao criar uma lâmina de energia amaldiçoada envolta da sua katana. Quando uma criatura entrar dentro da área do seu domínio simples, você 3 cortes extremamente velozes que parecem ser feitos quase simultaneamente. Após atingir o alvo, você deve realizar mais duas rolagens de acerto que não causam dano, impondo a condição <strong>“Sangramento”</strong> sem a necessidade de uma Salvaguarda ao atingir as 3.</p><hr><p>\_<strong>Duração:</strong>\_Instantâneo</p><p><strong>Alcance:</strong>\_Até 4,5 metros, Linha</p><p><strong>Requisito:</strong> Katana, Domínio Simples, Ação de Poder</p><p><strong>Dano:</strong> 10d10 de dano Cortante</p><p><strong>Custo:</strong> 10 PA</p>"
