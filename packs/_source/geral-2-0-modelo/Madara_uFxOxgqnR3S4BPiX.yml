system:
  description:
    value: "<p>O usuário se agacha enquanto estiver com seu domínio simples ativo, fazendo com que diversos domínios apareçam ao seu redor em uma área de 9 metros de raio.</p><p class=\"MsoNormal\">\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_ Toda criatura que realizar um ataque contra ele dentro dessa área irá ter o ataque bloqueado reduzindo o dano a 0 e o usuário pode realizar um ataque (Comum ou de Técnica) contra a criatura em resposta sem consumir nenhuma ação, mas ainda gastando qualquer custo proveniente do ataque.</p><p>\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_ Essa técnica consome 6 Pontos de Energia Amaldiçoada (PA) no início de cada um dos turnos do usuário para mantê-la ativa.</p><hr><p>\_<strong>Duração:</strong> Especial</p><p><strong>Alcance:</strong>\_Pessoal</p><p><strong>Requisito:</strong>Domínio Simples, Ação de Poder</p><p><strong>Custo:</strong> 15 PA</p>"
