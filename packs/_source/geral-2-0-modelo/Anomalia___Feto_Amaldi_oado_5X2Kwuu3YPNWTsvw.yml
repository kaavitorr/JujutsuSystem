system:
  description:
    value: "<p style=\"text-align:center\"><span><span style=\"font-size:38px\"><strong>FETO AMALDIÇOADO</strong></span></span></p><p style=\"margin-bottom:.0001pt;text-justify:inter-ideograph;line-height:normal;mso-layout-grid-align:none;text-autospace:none;text-align:justify\"><span style=\"font-family:'Chaparral Pro, serif'\">\_</span></p><p><strong>Ajuste de Atributo:</strong> +4 Pontos de Atributo para distribuir entre todos os 6 atributos.</p><p><strong>Vida Base:</strong> 10 Pontos de Vida</p><p><strong>Tamanho:</strong> 1,50 a 2,50 metros (pequeno, médio ou grande).</p><p><strong>Peso:</strong> Normalmente, entre 45 kg e 200 kg.</p><p><strong>Deslocamento:</strong> 9 metros.</p><p><strong>Nado:</strong> 1.5 metros.</p><p>\_</p><table border=\"1\" style=\"margin-left:0pt;border-collapse:collapse;border:none\" class=\"MsoTableGrid\"><tbody><tr><td><p style=\"line-height:7pt;text-align:center\"><span style=\"font-size:large\"><strong>CARACTERÍSTICAS DA ESPÉCIA</strong></span></p></td></tr></tbody></table><p><span style=\"font-size:10.0pt;line-height:102%;font-family:'Chaparral Pro',serif\">Essas</span><span style=\"letter-spacing:.7pt\"> </span><span style=\"font-size:10.0pt;line-height:102%;font-family:'Chaparral Pro',serif\">características</span><span style=\"letter-spacing:.55pt\"> </span><span style=\"font-size:10.0pt;line-height:102%;font-family:'Chaparral Pro',serif\">acompanham</span><span style=\"letter-spacing:.55pt\"> </span><span style=\"font-size:10.0pt;line-height:102%;font-family:'Chaparral Pro',serif\">a</span><span style=\"letter-spacing:.7pt\"> </span><span style=\"font-size:10.0pt;line-height:102%;font-family:'Chaparral Pro',serif\">existência</span><span style=\"letter-spacing:.65pt\"> </span><span style=\"font-size:10.0pt;line-height:102%;font-family:'Chaparral Pro',serif\">do</span><span style=\"letter-spacing:.8pt\"> </span><span style=\"font-size:10.0pt;line-height:102%;font-family:'Chaparral Pro',serif\">personagem,</span><span style=\"letter-spacing:.75pt\"> </span><span style=\"font-size:10.0pt;line-height:102%;font-family:'Chaparral Pro',serif\">são</span><span style=\"letter-spacing:.6pt\"> </span><span style=\"font-size:10.0pt;line-height:102%;font-family:'Chaparral Pro',serif\">representações</span><span style=\"letter-spacing:.75pt\"> </span><span style=\"font-size:10.0pt;line-height:102%;font-family:'Chaparral Pro',serif\">da</span><span style=\"letter-spacing:.65pt\"> </span><span style=\"font-size:10.0pt;line-height:102%;font-family:'Chaparral Pro',serif\">sua</span><span style=\"letter-spacing:.7pt\"> </span><span style=\"font-size:10.0pt;line-height:102%;font-family:'Chaparral Pro',serif\">origem,</span><span style=\"letter-spacing:.55pt\"> </span><span style=\"font-size:10.0pt;line-height:102%;font-family:'Chaparral Pro',serif\">sendo</span><span style=\"letter-spacing:.6pt\"> </span><span style=\"font-size:10.0pt;line-height:102%;font-family:'Chaparral Pro',serif\">uma</span><span style=\"letter-spacing:.8pt\"> </span><span style=\"font-size:10.0pt;line-height:102%;font-family:'Chaparral Pro',serif\">parte</span><span style=\"letter-spacing:.6pt\"> </span><span style=\"font-size:10.0pt;line-height:102%;font-family:'Chaparral Pro',serif\">essencial</span><span style=\"letter-spacing:.75pt\"> </span><span style=\"font-size:10.0pt;line-height:102%;font-family:'Chaparral Pro',serif\">de</span><span style=\"letter-spacing:.05pt\"> </span><span style=\"mso-font-width:105%\">como</span><span style=\"letter-spacing:-.45pt\"> </span><span style=\"mso-font-width:105%\">ele</span><span style=\"letter-spacing:-.4pt\"> </span><span style=\"mso-font-width:105%\">vê</span><span style=\"letter-spacing:-.45pt\"> </span><span style=\"mso-font-width:105%\">o</span><span style=\"letter-spacing:-.4pt\"> </span><span style=\"mso-font-width:105%\">mundo</span><span style=\"letter-spacing:-.55pt\"> </span><span style=\"mso-font-width:105%\">e</span><span style=\"letter-spacing:-.4pt\"> </span><span style=\"mso-font-width:105%\">de</span><span style=\"letter-spacing:-.45pt\"> </span><span style=\"mso-font-width:105%\">como</span><span style=\"letter-spacing:-.5pt\"> </span><span style=\"mso-font-width:105%\">o</span><span style=\"letter-spacing:-.45pt\"> </span><span style=\"mso-font-width:105%\">mundo</span><span style=\"letter-spacing:-.4pt\"> </span><span style=\"mso-font-width:105%\">olha</span><span style=\"letter-spacing:-.4pt\"> </span><span style=\"mso-font-width:105%\">pra</span><span style=\"letter-spacing:-.35pt\"> </span><span style=\"mso-font-width:105%\">ele.</span></p><p style=\"margin-top:.5pt;margin-right:0cm;margin-bottom:.0001pt;margin-left:7.1pt;text-justify:inter-ideograph;tab-stops:7.1pt 345.55pt 467.8pt 522.85pt;text-align:justify\"></p><p><span style=\"font-size:large\"><strong>BENEFÍCIOS DA ORIGEM - VARIANTE</strong></span></p><hr><ul><li><p><strong style=\"mso-bidi-font-weight:normal\">Talento de Origem: </strong>No <strong style=\"mso-bidi-font-weight:normal\">3º nível</strong>, você recebe um talento de origem de acordo com o <strong style=\"mso-bidi-font-weight:normal\">Capítulo 6</strong>.\_</p></li><li><p><strong>Corpo Hibrido</strong>: Como um feto amaldiçoado, você tem um corpo espiritual capaz de se regenerar mais facilmente. Você pode pegar a habilidade de manipulação <strong>“Energia Reversa”</strong> pela metade do custo de Pontos de Maldição e ignorando os outros requisitos dela.Além disso, você pode escolher sacrificar metade dos seus dados de energia amaldiçoada ao realizar um descanso curto ou longo para se recuperar de qualquer <strong>“Ferida Brutal”</strong>, <strong>“Ferimento Persistente”</strong> ou Penalidade de Pontos de Vida máximos que tenha sofrido, assim como recuperar todos os membros perdidos.</p></li><li><p><strong>Habilidade Vinculada:</strong> Você pode receber uma técnica inata vinculada a um objeto amaldiçoado utilizado na sua existência. Você recebe o <strong>“Despertar Habilidade”</strong> do <strong>Capítulo 6</strong> e começa com um Feitiço Inerente.</p></li></ul><p></p><p><span style=\"font-size:large\"><strong>DESVANTAGENS DA VARIANTE</strong></span></p><hr><ul><li><p><strong>Composição Estranha: </strong>Seu corpo é feito parcialmente de energia amaldiçoada e parcialmente de carne e osso, tornando o processo de cura um pouco mais complexo que o normal. Você gasta 1 Ponto de Energia Amaldiçoada (PA) adicional para cada dado de cura da habilidade <strong>“Energia Reversa”</strong> que utilizar. A partir do <strong>4º nível</strong>, você ganha um entendimento melhor da composição do seu corpo e como melhor cura-lo, removendo totalmente essa limitação.</p></li></ul>"
