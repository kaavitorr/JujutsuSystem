  description:
    value: >-
      <p>A existência aprimorada - ofensiva é uma arvore de habilidades
      específicas do Restringido, interagindo com seus Pontos de Estamina,
      devido a isso, ela normalmente não pode ser adquirida por outras
      criaturas. Essa arvore é voltada para parte ofensiva e de velocidade das
      habilidades.</p><p>Uma vez no turno de cada criatura, quando uma criatura
      errar uma jogada de ataque (Comum ou de Técnica) corpo-a-corpo que tenha
      você como alvo, você pode, como Reação, realizar uma jogada de ataque
      (Comum) contra a criatura com custo de Pontos de Ação [⬢] reduzido em 1,
      mas você consome 1 PE por ataque.</p>
