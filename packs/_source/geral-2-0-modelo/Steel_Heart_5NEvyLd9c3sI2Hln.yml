system:
  description:
    value: "<p>Você fortalece seu corpo com uma quantidade imensa de energia amaldiçoada, protegendo seus pontos vitais de danos catastróficos. Enquanto essa habilidade estiver ativa, você recebe imunidade a danos críticos (não engloba Fulgor), Feridas Brutais e Ferimentos Persistentes.</p><p>\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_ Adicionalmente, você não pode receber mais de 50 Pontos de Dano por vez.</p><hr><p>\_<strong>Duração:</strong> Até 1 minuto</p><p><strong>Alcance:</strong>\_Toque</p><p><strong>Requisito:</strong> Katana, Domínio Simples, Ação de Poder</p><p><strong>Custo:</strong> 15 PA</p>"
