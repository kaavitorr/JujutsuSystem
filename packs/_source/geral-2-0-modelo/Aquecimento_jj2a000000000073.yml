  description:
    value: >-
      <p><em><strong>Requisito:</strong> 4 Habilidades do Existência Aprimorada
      - Ofensivo</em></p><p>Você pode se preparar antes de realizar um ataque,
      permitindo que você desencadeie um efeito muito mais poderoso que o
      normal. Ao sacrificar qualquer número de ações [⬢] enquanto mantém sua
      Concentração, você pode executar uma técnica no turno seguinte podendo
      escolher um dos seguintes efeitos:</p><ul><li><strong>Dano
      (Técnica):</strong> Pode sacrificar uma ação [⬢] para aumentar em 2 dados
      ou duas ações [⬢⬢] para 4 dados.</li><li><strong>CD:</strong> Pode
      sacrificar uma ação [⬢] para aumentar em +2 ou duas ações [⬢⬢] para
      +4.</li><li><strong>Acerto:</strong> Pode sacrificar uma ação [⬢] para
      aumentar +2 ou duas ações [⬢⬢] para +4.</li></ul><p>Ao sacrificar mais de
      duas ações, você pode escolher pegar mais de um efeito diferente.</p>
