system:
  description:
    value: "<p>Ajuste de Atributo: +4 Pontos de Atributo para distribuir entre todos os 6 atributos.</p><p class=\"MsoNormal\">Pontos de Vida Base: 6 Pontos de Vida.</p><p class=\"MsoNormal\"><strong>Tamanho:</strong> Normalmente, entre 1,50 e 3,00 metros (Médio).</p><p class=\"MsoNormal\"><strong>Peso:</strong> Normalmente, entre 65 e 300 kg.</p><p class=\"MsoNormal\"><strong>Deslocamento:</strong> 9 metros.</p><p class=\"MsoNormal\"><strong>Nado:</strong> 4,5 metros.\_</p><p></p><table border=\"1\" style=\"margin-left:0pt;border-collapse:collapse;border:none\" class=\"MsoTableGrid\"><tbody><tr><td><p style=\"line-height:7pt;text-align:center\"><span style=\"font-size:large\"><strong>CARACTERÍSTICAS DA ORIGEM</strong></span></p></td></tr></tbody></table><p>Essas características acompanham a existência do personagem, são representações da sua origem, sendo uma parte essencial de como ele vê o mundo e de como o mundo olha pra ele.</p><p style=\"margin:0.5pt 0cm 0.0001pt 7.1pt;text-align:justify\"></p><p><span style=\"font-size:large\"><strong>BENEFÍCIOS DA ORIGEM</strong></span></p><hr><p><strong style=\"mso-bidi-font-weight:normal\">Controle Refinado:</strong><span style=\"mso-bidi-font-weight:bold\"> Você tem um controle exímio que te ajuda em diversos aspectos do combate. Você recebe acesso as seguintes características:</span></p><ul><li><p><span style=\"mso-bidi-font-weight:bold\"><em>Sua margem do </em></span><em><strong style=\"mso-bidi-font-weight:normal\">“Fulgor Negro”</strong></em><span style=\"mso-bidi-font-weight:bold\"><em> aumenta em 1 (20 &gt; 19-20);</em></span></p></li><li><p><span style=\"mso-bidi-font-weight:bold\"><em>Você recebe 6 </em></span><em><strong style=\"mso-bidi-font-weight:normal\">Pontos de Maldição</strong></em><span style=\"mso-bidi-font-weight:bold\"><em> e </em></span><em><strong style=\"mso-bidi-font-weight:normal\">2 Pontos de Maldição </strong></em><span style=\"mso-bidi-font-weight:bold\"><em>adicionais sempre que subir de nível;</em></span></p></li><li><p><span style=\"mso-bidi-font-weight:bold\"><em>O dano de suas técnicas do Novo Estilo das Sombras aumenta em 1 dado de dano. A partir do </em></span><em><strong style=\"mso-bidi-font-weight:normal\">5º nível de personagem</strong></em><span style=\"mso-bidi-font-weight:bold\"><em>, passa a ser de 2 dados adicionais, aumentando novamente para 3 dados no </em></span><em><strong style=\"mso-bidi-font-weight:normal\">12º nível de personagem</strong></em><span style=\"mso-bidi-font-weight:bold\"><em>.</em></span></p></li></ul><p style=\"tab-stops:467.8pt\" class=\"TextoPadro\"><strong style=\"mso-bidi-font-weight:normal\">Núcleo Reforçado: </strong>Toda vez que seus Pontos de Energia Amaldiçoada (PA) máximos aumentarem, seja por avanço de nível ou treinamento, você recebe 3 Pontos Adicionais.</p><p style=\"tab-stops:467.8pt\" class=\"TextoPadro\"><strong style=\"mso-bidi-font-weight:normal\">Foco Extremo: </strong><span style=\"mso-bidi-font-weight:bold\">Ao atingir o </span><strong style=\"mso-bidi-font-weight:normal\">5º nível</strong><span style=\"mso-bidi-font-weight:bold\"> no treinamento de Energia Amaldiçoada (</span><strong style=\"mso-bidi-font-weight:normal\">Capítulo 6.5</strong><span style=\"mso-bidi-font-weight:bold\">), você desperta o conjunto de habilidades do </span><strong style=\"mso-bidi-font-weight:normal\">“Novo Estilo das Sombras”</strong><span style=\"mso-bidi-font-weight:bold\">.</span></p><p style=\"tab-stops:467.8pt\" class=\"TextoPadro\"><strong style=\"mso-bidi-font-weight:normal\">Talento de Origem: </strong>No <strong style=\"mso-bidi-font-weight:normal\">3º nível</strong>, você recebe um talento de origem de acordo com o <strong style=\"mso-bidi-font-weight:normal\">Capítulo 6</strong>.</p><p></p><p><span style=\"font-size:large\"><strong>DESVANTAGENS DA VARIANTE</strong></span></p><hr><p><strong style=\"mso-bidi-font-weight:normal\">Quadro em Branco: </strong><span style=\"mso-bidi-font-weight:bold\">Você não nasceu com nenhum feitiço inato, podendo apenas depender de Ferramentas Amaldiçoadas e Manipulação de Energia Amaldiçoada para lutar. Você não pode aprender a habilidade de manipulação </span><em><strong style=\"mso-bidi-font-weight:normal\">Despertar Habilidade</strong></em><strong style=\"mso-bidi-font-weight:normal\">.</strong></p>"
