  description:
    value: >-
      <p><em><strong>Requisito:</strong> Canalização Amplificadora e Canalização
      de Combate</em></p><p>Seu controle sobre a energia amaldiçoada cresce de
      forma exponencial, aumentando sua capacidade de causar ou resistir a
      danos.</p><ul><li><strong>Foco Ofensivo:</strong> Suas jogadas de ataque
      (Comuns) recebem 1d4 de dano adicional;</li><li><strong>Foco
      Defensivo:</strong> Você envolve seu corpo com uma camada extra de energia
      amaldiçoada, criando 20 Pontos de Armadura. Esses pontos funcionam da
      mesma forma que os Pontos de Vida Temporários, com as seguintes
      diferenças:</li></ul><ul><li>Podem coexistir com PV
      temporários;</li><li>Sempre são consumidos antes dos PV
      temporários;</li><li>Duram apenas até o fim do
      encontro.</li></ul><p>Enquanto esses Pontos de Energia existirem, você
      reduz todo dano sofrido pela metade (mínimo 1). Essa redução é sempre
      aplicada por último.</p>
