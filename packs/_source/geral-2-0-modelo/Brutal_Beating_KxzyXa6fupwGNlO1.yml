system:
  description:
    value: "<p>Você avança na direção de uma criatura antes de desferir incontáveis golpes que são impossíveis de serem totalmente desviados. A criatura deve realizar uma Salvaguarda de Agilidade. Sofrendo todo dano se falhar ou metade se obtiver sucesso.</p><p>\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_ Se a criatura falhar na primeira Salvaguarda ela deve realizar uma nova Salvaguarda de [[/save con dc=@attributes.spell.dc]] para não perder todo deslocamento dela.</p><hr><p>\_<strong>Duração:</strong>\_Instantâneo</p><p><strong>Alcance:</strong>\_Pessoal</p><p><strong>Requisito:</strong>\_Ação de Poder</p><p><strong>Dano:</strong> 6d10 de dano Contundente</p><p><strong>Custo:</strong> 6 PA</p>"
