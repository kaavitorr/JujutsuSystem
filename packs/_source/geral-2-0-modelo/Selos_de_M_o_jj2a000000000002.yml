  description:
    value: >-
      <p>A primeira disciplina dentro das habilidades de Feitiço inato é a dos
      Selos e Encantamentos. Você é capaz de utilizar diversos selos para
      reduzir o custo de ação ou usar encantamentos amplificar suas
      habilidades.</p><p>Você aprendeu a adicionar complexidade a ativação de
      suas habilidades para facilitar sua ativação. Você recebe 3 usos de selos
      ao aprender essa habilidade e 1 adicionais toda vez que aprender uma nova
      habilidade desse caminho, recuperando todos os gastos ao realizar um
      descanso curto ou longo.</p><p>Ao consumir um selo, você deve ter pelo
      menos uma mão livre e faz com que você reduza o custo da sua próxima
      técnica em um Ponto de Ação [⬢], até um mínimo de uma.</p>
