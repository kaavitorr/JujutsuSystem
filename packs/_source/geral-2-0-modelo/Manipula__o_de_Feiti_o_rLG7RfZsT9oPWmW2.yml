name: Manipulação de Feitiço
type: feat
img: icons/magic/light/explosion-beam-impact-silhouette.webp
system:
  description:
    value: >-
      <p>Você adquire a habilidade de manipular seus próprios feitiços para
      adaptá-las às suas necessidades, usando a energia excedente delas para
      beneficiar suas habilidades. Toda vez que você executar um feitiço ou
      técnica de manipulação, seja por si mesmo ou por um Shikigami, você recebe
      2 Dados de Técnica, definidos por um d6.</p><p>A qualquer momento durante
      seu turno, você pode utilizar os dados de técnica para ativar um dos
      seguintes efeitos:</p><ul><li><p><strong>Aprimoramento:</strong> Você pode
      gastar quantos dados de técnica quiser para aumentar o dano da técnica
      pelo resultado da rolagem dos dados, mas deve usa-los antes de saber se
      ela acertou ou errou.</p></li><li><p><strong>Regenerar Maldição:</strong>
      Você pode gastar quantos dados de técnica desejar e curar um Shikigami
      pelo mesmo valor do resultado dos dados.</p></li><li><p><strong>Ativação
      Secundária:</strong> Você pode gastar quantos dados de técnica desejar
      para reduzir o custo da sua técnica pelo mesmo valor de dados
      consumidos.</p></li></ul><p>Você pode ter um máximo de dados de técnica
      igual a 1 + seu bônus de proficiência. Além disso, você também recebe 1
      habilidade de Especialização de Feitiço Inato imediatamente ao adquirir
      esse Estilo de Combate.</p>
