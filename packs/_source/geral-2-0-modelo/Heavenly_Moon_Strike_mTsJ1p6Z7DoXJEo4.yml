system:
  description:
    value: "<p>Você expande seu domínio simples em uma área de 18 metros e ativa essa técnica logo em seguida para se impulsionar na direção de uma criatura escolhida e desferindo um poderoso corte vertical que tenta parti-la ao meio. Em caso de acerto crítico, a criatura deve realizar uma Salvaguarda de Constituição. Se falhar, ela perde um membro a escolha do Narrador.</p><p>\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_ Se essa técnica ativar um <strong>Fulgor Negro</strong> de 20 natural, a cabeça da criatura é arrancada.</p><hr><p>\_<strong>Duração:</strong>\_Instantâneo</p><p><strong>Alcance:</strong>\_Até 18 metros, Linha</p><p><strong>Requisito:</strong> Katana, Domínio Simples, Ação de Poder</p><p><strong>Dano:</strong> 14d10 de dano Cortante</p><p><strong>Custo:</strong> 14 PA</p>"
