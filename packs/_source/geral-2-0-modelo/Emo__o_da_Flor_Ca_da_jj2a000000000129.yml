  description:
    value: >-
      <p><em><strong>Requisito:</strong> 4º nível ou superior</em></p><p>Uma
      técnica anti-domínio que envolve o corpo do usuário em energia amaldiçoada
      que contra ataca os efeitos de acerto garantido de uma expansão de
      domínio, defendendo o usuário de forma automática. Possui as seguintes
      características:</p><ul><li>Você cancela o Inescapável, Fatal e
      Irresistível de uma expansão de domínio contra o próprio
      usuário;</li><li>Toda vez que uma criatura te atacar ou entrar ou sair do
      seu alcance, você pode realizar um ataque ou técnica contra ela como uma
      Reação, mas ainda consome os Pontos de Ação normal da
      ação.</li></ul><p>Uma Emoção da Flor Caída consome 4 Pontos de Energia
      Amaldiçoada (PA) na sua ativação, e no início de cada um de seus
      turnos.</p>
