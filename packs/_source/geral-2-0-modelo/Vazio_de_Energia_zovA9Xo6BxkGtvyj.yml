system:
  description:
    value: >-
      <p>Devido a sua restrição, você recebeu certos benefícios gerais que
      ajudam você a se sobressair em combate. Você recebe as seguintes
      características:</p><ul><li><p>Você é imune ao efeito de acerto garantido
      das Expansões de Domínios e similares;</p></li><li><p>Você é imune a
      habilidade de "Sentir Maldição" da habilidade de Manipulação de
      Energia;</p></li><li><p>Você pode passar livremente em expansões de
      domínio ou barreiras, se movendo livremente;</p></li><li><p>Você sempre
      possui uma progressão de proficiência "Mestre" em Testes de Atributo de
      Atletismo e Coordenação;</p></li><li><p>Você recebe 4 + seu atributo de
      Constituição em Pontos de Estamina (PE) que são recuperados no início de
      cada um de seus turnos. A partir do 10º nível, sua base se torna 8 +
      atributo no lugar do original.</p></li></ul><p>Você não pode se beneficiar
      de características de manipulação de Energia ou Habilidades de
      Especialização de Feitiço Inato, Técnicas de Barreira e Técnicas de
      Reversão.</p>
