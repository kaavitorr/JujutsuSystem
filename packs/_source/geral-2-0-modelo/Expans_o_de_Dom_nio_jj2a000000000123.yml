    value: >-
      <p><em><strong>Requisito:</strong> 10º nível de personagem; Barreira
      Vazia</em></p><p>Você consegue formar uma expansão de domínio completa,
      fechando sua barreira e prendendo todas as criaturas dentro do seu
      interior. Uma expansão de domínio com barreira possui as seguintes
      características:</p><ul><li>Você ativa os efeitos Inescapável, Fatal e
      Irresistível;</li><li>Nenhuma criatura pode entrar ou sair da área do seu
      domínio.</li></ul><p>Uma vez por dia, ao expandir um domínio completo
      durante uma batalha com risco de morte, você pode rolar duas vezes o d20.
      Em um resultado de 20 natural nos dois dados, você alcança a Expansão sem
      Barreiras antes da hora e sem consumir uma escolha de habilidade de
      especialização.</p>
