    value: >-
      <p><em><strong>Requisito:</strong> Ativação Aprimorada</em></p><p>Seus
      golpes de energia atrasada te dão uma leve aceleração quando são ativados
      com sucesso, fazendo com que você possa sumir de vista por um segundo e
      acertar alvos a volta. Toda vez que você ativar o “Energia Atrasada”, você
      se move em alta velocidade, acertando todas as criaturas a 5 metros do
      alvo inicial do seu ataque gastando apenas 1 Ponto de Ação [⬢]
      adicional.</p><p>Os Pontos de Ação usados para ativar essa característica
      pode ser um dos recebidos pela Recuperação de Foco.</p>
