  description:
    value: <p>Uma criatura primeiro deve ser capaz de expandir um domínio incompleto para tentar dominar a versão de barreira fechada do seu domínio.</p><p>A cada 5 habilidades de especialização que você adquirir, você recebe uma escolha livre dentro de uma habilidade de domínio, podendo também usar suas escolhas normais para adquirir uma.</p><p><em><strong>Requisito:</strong> Feitiço com Expansão de Domínio Especial</em></p><p>Você se torna capaz de utilizar uma expansão de domínio como base para seu feitiço, fazendo com que ela seja bem mais fácil de ser usada. Mas sua expansão nunca pode causar dano e seu acerto garantido não pode ter relação ofensiva direta com o inimigo.</p>
