    value: <p><em><strong>Requisito:</strong> Aprimorar Alcance</em></p><p>Você dominou a habilidade de colocar votos em suas técnicas, permitindo modifica-las no meio do combate, adicionando um efeito ao sacrificar outro. Um voto é criado ao limitar uma face do seu feitiço para adicionar uma outra característica compatível com ele. Por exemplo, você pode reduzir 2 dados de dano para adicionar uma condição de até 2 PA a ele.</p><p>Independente do efeito escolhido, você pode criar quantos votos quiser junto do seu Narrador, mas só pode manter dois deles preparados até o fim de cada descanso longo, podendo muda-los toda vez que você realizar um novo descanso longo.</p>
