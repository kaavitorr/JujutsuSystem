    value: <p>Você pode escolher sofrer até 6 Desvantagens em sua Rolagem de Ataque Comum para atrasar propositalmente sua Energia Amaldiçoada, fazendo com que ela atinja o alvo uma segunda vez logo após o impacto inicial e produza dois golpes distintos. Caso obtenha um resultado natural de 15 ou mais na Rolagem de Ataque e acerte o alvo, você causa novamente o dano do primeiro ataque, até um limite igual à metade do seu Atributo Principal para cada Desvantagem escolhida.</p><p>Por exemplo, ao se impor 3 Desvantagens, o limite de dano adicional passa a ser igual a 3 vezes a metade do seu Atributo Principal.</p><p>Esse segundo impacto conta como uma Rolagem de Ataque Comum separada, mas utiliza o mesmo resultado de acerto do ataque original.</p>
