  description:
    value: <p>O punho divergente é um ramo das habilidades de especialização no treino do corpo que permite atrasar propositalmente sua energia amaldiçoada de forma a causar um impacto duplo em seus golpes. Assim como outras habilidades de Energia Amaldiçoada, ela não pode ser adquirida por um Restringido.</p><p>Você pode escolher ter até 5 desvantagens em sua rolagem de ataque (Comum) para fazer com que sua energia amaldiçoada dê um pequeno atraso, acertando o alvo uma segunda vez logo após seu golpe, liberando dois impactos distintos. Caso você role um resultado no dado de 15 ou mais e acerte o alvo, você causa novamente o dano do seu primeiro ataque, até um máximo de dano igual a 1 vez o seu atributo principal para cada desvantagem que você escolheu receber.</p><p><em>Por exemplo, ao se impor 3 desvantagens, você pode aumentar o limite de dano causado, aplicando até 3 vezes o seu atributo principal em dano.</em></p><p>Esse golpe conta como uma jogada de ataque (Comum) diferente usando o mesmo acerto.</p>
