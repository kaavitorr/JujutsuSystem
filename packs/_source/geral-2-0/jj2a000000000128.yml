    value: <p><em><strong>Requisito:</strong> 4º nível ou superior</em></p><p>Uma técnica anti-domínio que toma a forma de um escudo que parece de linhas interligadas como uma cesta. Serve como uma medida poderosa contra outros domínios. Pode ser ativada como resposta a ativação de um domínio.</p><p>Enquanto ela estiver ativa, você anula os Inescapável, Fatal e Irresistível de um domínio sobre o usuário e todo dano recebido que tiver origem de um domínio é reduzido pela metade.</p><p>Além disso, você não pode utilizar as mãos para mais nada e consome 6 Pontos de Energia Amaldiçoada (PA) na ativação e no início de cada um de seus turnos.</p>
